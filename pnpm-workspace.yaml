packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

# Allow postinstall build scripts for packages that require native compilation.
# Without this, pnpm 10 blocks lifecycle scripts by default (interactive approve is
# unavailable in CI). workerd ships a pre-built binary via the platform-specific
# optional dep (@cloudflare/workerd-<platform>), so it only needs this for the
# workerd wrapper postinstall; esbuild and sharp similarly ship native binaries.
#
# Anything not listed stays blocked, and pnpm names it after every install. @scarf/scarf is the one it
# names today: install-time download telemetry that @stoplight/spectral-cli pulls in from 6.17. Its
# postinstall only reports the install, so it is deliberately left off this list.
onlyBuiltDependencies:
  - workerd
  - esbuild
  - sharp

# A version published minutes ago is the shape a compromised release arrives in: the attacker
# publishes, the automated upgrade opens its pull request, and the package is in the tree before the
# registry has heard the report. The cooldown holds every resolution back until a version has been
# public for three days, which is where this class of compromise has been caught every time so far —
# by other people, in public, at no cost to us. It binds the weekly Renovate upgrades in particular,
# which is the one path here that adds versions nobody chose by hand.
#
# It applies at RESOLUTION, so it changes nothing already in the lockfile, and it is a floor rather
# than a wall: a security fix that has to land the day it ships is `pnpm add <package>@<version>
# --config.minimumReleaseAge=0`, a deliberate act with a reason, which is the posture this file takes
# everywhere else.
minimumReleaseAge: 4320

# Single source of truth for dependency versions (pnpm catalog).
# Bump a version here once; every package.json that references `catalog:` follows.
# Keep exact pins (no ^/~) — upgrades are deliberate, one line at a time.
catalog:
  # Toolchain
  # Vite+ 1.x runs upstream Vitest directly (a plain dependency of vite-plus, pinned exactly), so the
  # `vitest` pin below must be the version this vite-plus release depends on. Bump the two together.
  vite-plus: 1.5.0
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  # Network Speed Test tool (apps/web). Cloudflare's own client-side measurement engine, on their
  # default ladder, so the numbers are comparable to speed.cloudflare.com.
  "@cloudflare/speedtest": 1.16.0
  # Browser Sessions for the safe website viewer's interactive mode (apps/api-worker). The quick
  # actions reached through env.BROWSER cannot hold a session across requests; this fork of
  # puppeteer-core speaks CDP to the same binding and can. Apache-2.0.
  "@cloudflare/puppeteer": 1.4.0
  # The type-check compiler for the project-references build graph (`tsc -b tsconfig.build.json`).
  # Distinct from vp's bundled tsc: this is the engine our `vp run typecheck` task owns, and the swap
  # point for the TypeScript 7 native compiler (tsgo) later. See docs/conventions/build-performance.md.
  typescript: 6.0.3
  # Cloudflare
  wrangler: 4.158.0
  "@cloudflare/workers-types": 5.20261106.1
  # The Workers test integration (the `cloudflareTest()` Vite plugin and the `cloudflare:test` module):
  # tests run inside workerd through Miniflare with the real bindings from each worker's wrangler
  # config. It is the renamed successor of @cloudflare/vitest-pool-workers, whose last line peered
  # only Vitest 4. Bump in lockstep with wrangler: each release hard-depends on an exact (wrangler,
  # miniflare) pair, and that miniflare is what pulls undici/ws into the dev/test graph — moving
  # wrangler alone leaves an older miniflare resolved under this package. workers-types tracks the
  # same compatibility date as wrangler; keep all three aligned.
  "@cloudflare/vitest-plugin": 1.6.0
  # The Container base class + getContainer helper for the scan Container (slice 2·1 Plan 2).
  "@cloudflare/containers": 0.3.7
  # Upstream Vitest, the exact version vite-plus depends on, so every package's `import ... from
  # "vitest"` and the runner `vp test` starts resolve to one copy. The worker packages also need it
  # declared so @cloudflare/vitest-plugin can resolve `vitest/worker` into the workerd VM.
  vitest: 5.1.0
  # The Playwright browser provider for the design-system story tests. Upstream Vitest publishes it
  # as its own package, versioned in lockstep with vitest; keep the two pins equal.
  "@vitest/browser-playwright": 5.1.0
  # API / Worker (apps/api-worker)
  # 4.12.34 fixed four security defects reachable from a Worker: JSX cross-request data disclosure,
  # a whitespace-tolerant CORS origin regex (ReDoS), a Language-middleware algorithmic-complexity DoS,
  # and response-header leakage in the proxy helper. Stay at or above it. 4.13.5 fixed three more:
  # unbounded dot-notation nesting in `parseBody()` (memory DoS on any form body), the query parser
  # reading past a `#` fragment, and `toSSG()` writing outside its output directory.
  hono: 4.13.16
  "@hono/zod-openapi": 1.6.3
  zod: 4.6.7
  # API contract pipeline. Hey API generates the typed client (packages/api-client) from the
  # OpenAPI document; Spectral lints the document (apps/api-worker devDeps). The Prism mock server
  # is deliberately NOT a dependency: nothing in the repository ran it, and its HTTP layer dragged in
  # postman-collection, which hard-pins a @faker-js/faker 5.x with a HIGH advisory no override can
  # reach (the fixed line is a different major that the carrier cannot load). Run it on demand with
  # `pnpm dlx` when a consumer wants a mock (docs/conventions/api.md).
  "@hey-api/openapi-ts": 0.98.2
  "@stoplight/spectral-cli": 6.17.1
  "@tanstack/svelte-query": 6.3.11
  # Auth (apps/api-worker). Better Auth runs on the control-plane D1 via its drizzle adapter;
  # otpauth is a devDependency that verifies TOTP codes in two-factor tests.
  better-auth: 1.7.18
  otpauth: 9.6.0
  # Incremental SHA-256 for the browser (apps/web): the upload dialog streams a file through it to
  # ask whether the firm already holds the bytes before sending any. WebCrypto has no incremental
  # digest, so a whole-file buffer was the only native path; this is audited, pure TypeScript, and
  # already in the graph under better-auth's utilities, so it is the same pin.
  "@noble/hashes": 2.4.0
  # Money (packages/money). Bigint API: the consolidated `dinero.js/bigint` subpath bundles the
  # calculator + bigint currencies, so no separate (deprecated) @dinero.js/calculator-bigint is needed.
  "dinero.js": 2.0.2
  decimal.js: 10.6.0
  # Identifiers (packages/identifiers). nanoid v5 (ESM, Web Crypto); customRandom + urlAlphabet.
  # Floor is 5.1.16: below it the non-secure module's generators spin forever on a negative size, and
  # below 5.1.6 customRandom — the one function packages/identifiers/src/nanoid.ts actually calls —
  # does the same on a size of zero. Neither is reachable here (that seam imports the secure entry
  # point and passes compile-time constant sizes), but the floor keeps it that way. Stay on 5.x: 6.0
  # is a major.
  nanoid: 5.1.16
  # Directory (packages/directory). double-metaphone: ES module phonetic encoder, used for fuzzy
  # name search alongside soundex and metaphone. Import: `import { doubleMetaphone } from "double-metaphone"`.
  double-metaphone: 2.0.1
  # Database (packages/database). Stable line, NOT the 1.0 RC: 0.31.x drizzle-kit emits
  # NNNN_tag.sql + meta/_journal.json, which src/migration.ts consumes. Bump both together.
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  # File Manager — uploads & bulk download (packages/file-manager, apps/api-worker).
  # aws4fetch: SigV4 presigning of R2's S3-compatible endpoint (single-key, single-method, short-TTL
  # signed URLs; bytes never transit the Worker). client-zip 2.x: streaming store-mode ZIP64 (no
  # buffering, >4 GiB bundles). file-type 22.x: magic-byte sniffing over the head bytes — the
  # Uint8Array API (no Node streams), so it runs unchanged in the Workers runtime.
  aws4fetch: 1.0.20
  client-zip: 2.5.1
  file-type: 22.3.0
  # Fixtures (packages/fixtures). Seeded via faker.seed(); locale en.
  "@faker-js/faker": 10.6.0
  # Web (apps/web)
  "@types/node": 26.6.6
  svelte: 5.57.3
  svelte-check: 4.7.8
  # Floor is 2.70.2: earlier 2.x negotiates the `Accept` header in quadratic time, so a long crafted
  # header burns CPU without authentication. The shipped SPA is prerendered by adapter-static and
  # serves no SvelteKit request handler, so the reachable surface is the local dev server — but this
  # is also the version the fix landed in, and there is no cost to being on it.
  "@sveltejs/kit": 2.70.4
  "@sveltejs/adapter-static": 3.0.11
  "@sveltejs/vite-plugin-svelte": 7.3.1
  # Image processing (packages/conversion). wasm-vips: libvips compiled to WebAssembly via
  # Emscripten; runs in Node for the conversion test suite and in Workers for small raster jobs.
  wasm-vips: 0.0.19
  # Design tokens (packages/design-tokens)
  "@terrazzo/cli": 2.10.0
  "@terrazzo/plugin-css": 2.10.0
  "@terrazzo/plugin-tailwind": 2.10.0
  "@types/culori": 4.0.1
  culori: 4.0.2
  # Design system (packages/design-system)
  bits-ui: 2.20.6
  clsx: 2.1.1
  formsnap: 2.1.0
  paneforge: 1.0.2
  svelte-sonner: 1.2.3
  sveltekit-superforms: 2.31.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@tanstack/table-core": 8.21.3
  "@internationalized/date": 3.12.4
  "@lucide/svelte": 1.70.0
  virtua: 0.49.3
  # The QR encoder behind the design system's QrCode (an authenticator app scans the two-factor
  # secret from it). Pure TypeScript with no dependencies, and it hands back the module matrix rather
  # than markup, so the component draws its own SVG from design tokens.
  uqr: 0.1.3
  # The IANA top-level-domain list (auto-published from the root zone). The single source for
  # email/URL TLD validation, shared by the design-system form story and the app's real form schemas
  # so both track the same list — never a hand-maintained set.
  tlds: 1.261.0
  # Self-hosted fonts (design language: in-custody, no font CDN). Variable builds where available.
  "@fontsource-variable/atkinson-hyperlegible-next": 5.3.0
  "@fontsource-variable/fraunces": 5.3.0
  "@fontsource/unifrakturmaguntia": 5.3.0
  # Signature-moment animation (design-system internal/signature-motion.ts is the ONLY import
  # site — gated). MIT; supersedes the GSAP+DrawSVG+SplitText plan (ADR with the first consumer).
  animejs: 4.5.0
  # Catalog / stories (packages/design-system Storybook + Playwright VRT)
  storybook: 10.6.6
  "@storybook/addon-a11y": 10.6.6
  "@storybook/addon-docs": 10.6.6
  "@storybook/addon-svelte-csf": 5.1.6
  "@storybook/addon-vitest": 10.6.6
  "@storybook/svelte-vite": 10.6.6
  "@chromatic-com/storybook": 5.6.0
  # Exact pin like everything else here. It used to be held at 1.60 because the hosted gate workflow
  # found the CLI by a version-specific path glob; that workflow left with the Actions budget and
  # nothing in the repository globs for a Playwright version any more.
  "@playwright/test": 1.65.0
  # happy-dom is the DOM test environment for browser-facing unit tests (an optional peer of the
  # Vite+ test distribution); opted into per test file via the `@vitest-environment happy-dom`
  # pragma so everything else stays in the default node pool.
  happy-dom: 21.0.4
  # PAdES e-signature CMS (the platform seal). pkijs builds the detached CMS/PKCS#7 over WebCrypto —
  # the firm key stays a non-extractable CryptoKey in the Worker, never extractable, never client-side.
  # Pure JS (memory-safe, golden rule 14); the Rust pdf-core engine owns the PDF structure and takes
  # the CMS as an opaque blob. asn1js is pkijs's ASN.1 layer, used directly to build signed attributes.
  pkijs: 3.4.3
  asn1js: 3.1.0

overrides:
  # Every `vite` in the tree (Storybook, Tailwind, the Svelte plugin, Vitest) resolves to the Vite+
  # core build, so one Vite runs the dev server, the build and the tests. Keep it equal to vite-plus.
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  # Security remediation: pin transitive carriers to the versions that fix a known advisory. The
  # original entries were the ones the CI audit fails on (CVSS >= 7); the later ones also clear
  # moderate and low findings, because a carrier that has to be pinned anyway costs nothing extra to
  # pin at a version with no open advisory at all — the fail threshold decides what BLOCKS a merge,
  # not what is worth fixing. Range-scoped where a line must not be dragged across a boundary
  # (js-yaml, brace-expansion, esbuild). Direct/catalog carriers (better-auth, fast-xml-parser,
  # nanoid, @sveltejs/kit) are bumped at their source in the catalog above, not here.
  "brace-expansion@1": 1.1.21
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  undici: 7.30.2
  # fast-uri floor is 3.1.6: below it four host-confusion / SSRF defects in URI normalization (IPv6
  # handling, repeated percent-decoding of the host, percent-encoded scheme, skipped IDN
  # canonicalization on scheme-relative references) each score CVSS 7.5, over the gate's fail
  # threshold. It reaches the tree only through ajv, whose ^3 range already admits this line.
  fast-uri: 3.1.9
  # sharp floor is 0.35.4: the libheif it bundles below that decodes a crafted HEIF out of bounds.
  # Reached only through miniflare, the local Workers simulator the test pool runs on.
  sharp: 0.35.5
  # postcss floor is 8.5.23, which stops an attacker-controlled `sourceMappingURL` reading arbitrary
  # .map files when `from` is unset. 8.5.26 is taken rather than the bare floor because it is the
  # first release to require nanoid ^3.3.17 — the postcss dependency was the ONLY thing holding a
  # nanoid 3.3.12 in the tree, and that line's infinite-loop advisories score CVSS 4.0 8.2, over the
  # gate's fail threshold. One bump therefore clears three advisories, and no nanoid@3 pin is needed.
  postcss: 8.5.32
  # tsx asks for esbuild ~0.28.0 and the lockfile had settled on 0.28.0, which reads arbitrary files
  # through the dev server on Windows. Scoped to the 0.28 line on purpose: the other esbuild in the
  # tree is a 0.18 that @esbuild-kit/core-utils hard-pins, and dragging that ten minor versions
  # forward would break drizzle-kit's config loader for no security gain (see the note below).
  "esbuild@0.28": 0.28.2
  # lodash floor. Every consumer in the tree resolves 4.18.1 on its own now that postman-collection
  # (which hard-pinned 4.17.21) left with the Prism mock server; the override stays as a floor so a
  # future carrier cannot reintroduce the 4.17 line. 4.18.x is the line that fixes all three lodash
  # advisories: prototype pollution in `_.unset`/`_.omit` (two records) and code injection through
  # `_.template` import key names.
  lodash: 4.18.1
  # devalue floor is 5.9.2, which stops a malformed payload exhausting the parser. It reaches the web
  # app through svelte, @sveltejs/kit and sveltekit-superforms, all of whose ^5 ranges admit it.
  devalue: 5.9.4
  # joi arrives only as sveltekit-superforms' optional validator adapter. 17.13.8 closes prototype
  # pollution through a `__proto__` language key and `rename()` targets reaching the validated
  # object's prototype. Scoped to 17 so a future carrier on the 18 line is not dragged back.
  "joi@17": 17.13.9
  # Removed rather than pinned: @puppeteer/browsers 2.2.4 is what brings extract-zip, and no
  # extract-zip release fixes its two symlink-traversal advisories (2.0.1 is the last, and affected).
  # @cloudflare/puppeteer hard-pins that 2.2.4 for its Node launcher, which downloads and starts a
  # local Chrome. A Worker never runs it: the package's entry point drives the Browser Rendering
  # binding instead, and a dry-run bundle of the API worker contains none of @puppeteer/browsers.
  # Removing the carrier takes the advisories out of the tree rather than baselining them; if the
  # Node launcher is ever reached, the missing module fails the import loudly.
  "@cloudflare/puppeteer>@puppeteer/browsers": "-"
peerDependencyRules:
  allowedVersions:
    vite: "1"
    "storybook>vite-plus": "1"
patchedDependencies:
  # Vitest 5 asks the pool for a "warm modules" snapshot when each test file after the first starts, so
  # a fresh worker can skip one fetch per module. workerd cannot read the host disk, so the plugin
  # inlines every cached module's source into that one reply, and for the API worker that is about
  # 65 MB across 4,254 modules in a single WebSocket message. workerd closes the socket with 1009
  # "Message is too large", the runtime restarts, and the retries leak a Vite server each until the
  # run reaches about 14 GB. The patch answers the snapshot request with an empty map, so the worker
  # fetches modules one at a time exactly as it did under Vitest 4. Drop it when a plugin release
  # bounds or chunks that reply (1.6.1 still has the same code).
  "@cloudflare/vitest-plugin@1.6.0": patches/@cloudflare__vitest-plugin@1.6.0.patch
  bits-ui@2.20.6: patches/bits-ui@2.20.6.patch
