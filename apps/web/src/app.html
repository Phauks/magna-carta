<!doctype html>
<html lang="en" data-theme="chancery">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // No-FOUC appearance boot. MIRRORS packages/design-system/src/lib/internal/
      // theme-preference.ts (readThemePreference + applyThemePreference) — it must run inline
      // before first paint, so it cannot import that module; keep keys, defaults, the dark +
      // motion resolution rules, and the color-scheme write in sync. The static
      // data-theme="chancery" above is the no-JavaScript fallback, for whom the scheme and the
      // document's paint come from the stylesheet
      // (@magna-carta/design-system/styles/base.css) instead.
      (function () {
        var theme = localStorage.getItem("magna-carta.theme") || "chancery";
        var mode = localStorage.getItem("magna-carta.mode");
        if (mode !== "light" && mode !== "dark") mode = "system";
        var root = document.documentElement;
        root.dataset.theme = theme;
        var dark =
          mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        // The same fact base.css declares, written where a stylesheet cannot reach. Until that
        // stylesheet arrives the browser paints its canvas, scrollbars and form controls in the
        // scheme it last knew — and this document has an empty body until the application mounts,
        // so that window is the whole boot and the longest of the flashes worth ending.
        root.style.colorScheme = dark ? "dark" : "light";
        var motion = localStorage.getItem("magna-carta.motion");
        if (motion !== "full" && motion !== "reduced" && motion !== "off") motion = "system";
        if (motion === "system") {
          motion = matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
        }
        if (motion === "full") delete root.dataset.motion;
        else root.dataset.motion = motion;
        var density = localStorage.getItem("magna-carta.density");
        if (density !== "compact") density = "comfortable";
        if (density === "comfortable") delete root.dataset.density;
        else root.dataset.density = density;
        var contrast = localStorage.getItem("magna-carta.contrast");
        if (contrast !== "high" && contrast !== "standard") contrast = "system";
        if (contrast === "system") {
          contrast = matchMedia("(prefers-contrast: more)").matches ? "high" : "standard";
        }
        if (contrast === "standard") delete root.dataset.contrast;
        else root.dataset.contrast = contrast;
        // The reading face: without it a person who chose OpenDyslexic sees the whole boot in
        // Atkinson and then watches every line reflow when the application mounts.
        var typeface = localStorage.getItem("magna-carta.typeface");
        if (
          typeface !== "lexend" &&
          typeface !== "opendyslexic" &&
          typeface !== "serif" &&
          typeface !== "system"
        ) {
          typeface = "atkinson";
        }
        if (typeface === "atkinson") delete root.dataset.typeface;
        else root.dataset.typeface = typeface;
        // The text size, a whole percentage from 50 to 200: without it a person who chose 150%
        // watches the whole boot at the browser's base size and then every line grow when the
        // application mounts.
        var textSize = localStorage.getItem("magna-carta.textSize");
        var textPercent = /^\d{1,3}$/.test(textSize || "") ? Number(textSize) : 100;
        if (textPercent < 50 || textPercent > 200) textPercent = 100;
        root.style.fontSize = textPercent === 100 ? "" : textPercent + "%";
      })();
    </script>
    %sveltekit.head%
  </head>
  <!-- Preload on hover: a link's code and load-function data start fetching the moment the pointer
       settles on it (touch: on touchstart), so by the time the click lands the navigation has a
       head start on its API read — the matter chrome blocks on one, and the ~200-400ms between
       hover and click is exactly the round trip it was paying after the click instead. Loads are
       reads by design (mutations ride explicit requests, never a load), so preloading one early is
       the same read a beat sooner, never a repeated side effect. Opt any exception out per-link
       with data-sveltekit-preload-data="off". -->
  <body data-sveltekit-preload-data="hover">
    %sveltekit.body%
  </body>
</html>
