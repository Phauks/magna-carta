# Spectral hygiene ruleset for the emitted OpenAPI document (docs/conventions/api.md).
# The logic-bearing conformance checks are Vitest fitness functions over the document
# (test/conformance.test.ts), NOT Spectral custom functions — Spectral carries only the hygiene
# ruleset. CI runs `spectral lint openapi/openapi.json --fail-severity warn`, so the warn-level
# base rules are enforced: the base ruleset flags missing servers/contact/description,
# which the emission config (app.ts openAPIDocumentConfig) now populates — keep them failing-on-regress.
extends: ["spectral:oas"]
rules:
  # Workaround: Spectral 6.16 / nimma crashes traversing this 3.1
  # document — "Cannot read properties of null (reading 'enum')" — because the conformance contract
  # emits null-valued extensions (x-mc-permission: null on public/no-capability routes) and this rule's
  # JSONPath dereferences them. Our enums are trivial single-value literals (Health.status, firm
  # status), so the rule carries near-zero value; disabling it unblocks the whole hygiene gate.
  duplicated-entry-in-enum: off
  # MOVED, not dropped. A WebSocket subscribe endpoint succeeds with 101 — neither 2xx nor 3xx — so
  # this rule fires on a document that is correct, and Spectral 6.16's per-operation `overrides` do not
  # take effect for it (tried by JSON pointer at both the operation and the responses node). Rather
  # than leave the rule on and let CI fail on a correct contract, the check moved to the fitness
  # function that can express the real rule — "every operation declares a success response, and a 101
  # is one" — in test/conformance.test.ts, which is where this repo's logic-bearing contract checks
  # live anyway. The Vitest version is strictly stronger: it also proves a subscribe operation does not
  # ALSO claim a 2xx.
  operation-success-response: off
