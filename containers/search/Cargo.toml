[package]
name = "magna-carta-search"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + handlers + the object client, unit-testable) plus a thin binary that serves it
# on :8080.
[lib]
name = "magna_carta_search"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-search"
path = "src/main.rs"

[dependencies]
# Path dep on the sibling crate — the pure-Rust Tantivy engine (schema, split format, ranged directory,
# searcher, merge). Everything domain here is that crate; this one only gives it a surface and storage.
search-core = { path = "../../crates/search-core" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The blocking HTTP client behind the RangeReader. Pure Rust, and deliberately built with NO TLS
# backend: the only host this process can reach is the non-routable object host the Workers runtime
# intercepts, so the request never leaves the sandbox and a TLS stack would be dead weight carrying a
# transitive C dependency for nothing. Blocking rather than async because the RangeReader trait is
# synchronous — a Tantivy read is a synchronous call deep inside the searcher — which is why every
# engine operation runs on a blocking task.
ureq = { version = "3", default-features = false }

[dev-dependencies]
# A minimal in-process HTTP server for the object-host fake the tests read and write through, so the
# range reader is exercised over a real socket rather than against a trait double.
tiny_http = "0.12"
