[package]
name = "magna-carta-search"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + handlers + the object client, unit-testable) plus a thin binary that serves it
# on :8080.
[lib]
name = "magna_carta_search"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-search"
path = "src/main.rs"

[dependencies]
# Path dep on the sibling crate — the pure-Rust Tantivy engine (schema, split format, ranged directory,
# searcher, merge). Everything domain here is that crate; this one only gives it a surface and storage.
search-core = { path = "../../crates/search-core" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The blocking HTTP client behind the RangeReader. Pure Rust, and deliberately built with NO TLS
# backend: the only host this process can reach is the non-routable object host the Workers runtime
# intercepts, so the request never leaves the sandbox and a TLS stack would be dead weight carrying a
# transitive C dependency for nothing. Blocking rather than async because the RangeReader trait is
# synchronous — a Tantivy read is a synchronous call deep inside the searcher — which is why every
# engine operation runs on a blocking task.
ureq = { version = "3", default-features = false }

[dev-dependencies]
# A minimal in-process HTTP server for the object-host fake the tests read and write through, so the
# range reader is exercised over a real socket rather than against a trait double.
tiny_http = "0.12"

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
unwrap_used = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
# `clippy::panic` is absent over exactly one site: tests/object_reads.rs:46 panics in the match arm that
# rejects an unexpected listen address while standing the object-host fake up. That is a helper, not a
# `#[test]` function, so the test exemption in containers/clippy.toml does not reach it, and it is the
# only panic in this workspace. Denying it needs a file-level allow in that test, which belongs to a
# change that is touching the test.
