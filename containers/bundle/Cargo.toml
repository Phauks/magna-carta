[package]
name = "magna-carta-bundle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "magna_carta_bundle"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-bundle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ZIP: Deflate + ZIP64 + AES write. Lean features — no bzip2/zstd/xz C deps (Windows-clean dev host).
zip = { version = "9.4", default-features = false, features = [
  "deflate-flate2",
  "aes-crypto",
  "time",
] }
# Deflate backend for zip's `deflate-flate2`. Declared directly so flate2's default `rust_backend`
# (pure-Rust miniz_oxide) is selected — otherwise zip pulls flate2 with no backend and its ffi is empty.
flate2 = "1"
# 7z: LZMA2 (the default `compress` feature) + AES-256/header encryption (`aes256`), pure Rust.
sevenz-rust2 = { version = "0.7", features = ["aes256"] }
# R2 transport: GET inputs / PUT output volumes against R2_BASE_URL (the outbound-Workers virtual host
# in prod, a local stub in tests). rustls so the image needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# ReaderStream adapter: turn the spooled output file into a streaming PUT body (no full-file buffering).
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
base64 = "0.23"
# Epoch → ZIP DateTime conversion (zip's `time` feature re-exports it; an explicit dep keeps the helper
# readable).
time = "0.3"

[dev-dependencies]
# Local R2 stub + client for the handler/encoder tests.
axum = "0.8"

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
# `clippy::unwrap_used` is absent over 15 measured sites, 13 of them plain helper functions in
# tests/build_e2e.rs and tests/health.rs that the test exemption in containers/clippy.toml cannot reach.
# The two in library code are the same shape as each other and both provably cannot fire: build.rs:105
# and split.rs:38 unwrap an `Option<File>` on the line after the branch that filled it. Both want the
# same small rewrite — hold the file in a local rather than re-reaching for the option — and the lint
# goes on in the change that makes it.
# `clippy::panic_in_result_fn` is absent over one site: split.rs:9 asserts `max_part_bytes > 0` at the
# top of a function returning `io::Result`. The value is validated upstream, so the assertion documents a
# caller contract rather than handling input; turning it into an error variant is a deliberate API change.
