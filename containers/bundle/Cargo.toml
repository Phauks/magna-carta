[package]
name = "magna-carta-bundle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "magna_carta_bundle"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-bundle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ZIP: Deflate + ZIP64 + AES write. Lean features — no bzip2/zstd/xz C deps (Windows-clean dev host).
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "aes-crypto", "time"] }
# Deflate backend for zip's `deflate-flate2`. Declared directly so flate2's default `rust_backend`
# (pure-Rust miniz_oxide) is selected — otherwise zip pulls flate2 with no backend and its ffi is empty.
flate2 = "1"
# 7z: LZMA2 (the default `compress` feature) + AES-256/header encryption (`aes256`), pure Rust.
sevenz-rust2 = { version = "0.7", features = ["aes256"] }
# R2 transport: GET inputs / PUT output volumes against R2_BASE_URL (the outbound-Workers virtual host
# in prod, a local stub in tests). rustls so the image needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# ReaderStream adapter: turn the spooled output file into a streaming PUT body (no full-file buffering).
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
base64 = "0.22"
# Epoch → ZIP DateTime conversion (zip's `time` feature re-exports it; an explicit dep keeps the helper
# readable).
time = "0.3"

[dev-dependencies]
# Local R2 stub + client for the handler/encoder tests.
axum = "0.8"
