[package]
name = "magna-carta-libreoffice"
version = "0.0.0"
edition = "2021"
publish = false

# The supervisor library: format dispatch, the job package, the worker pipe protocol, the process
# pool, and the axum surface. Everything here is host-testable — nothing in the library links or
# loads LibreOffice.
[lib]
name = "magna_carta_libreoffice"
path = "src/lib.rs"

# The supervisor: the axum host plus the worker pool. It holds no LibreOfficeKit state of its own,
# which is what keeps a segfaulting conversion confined to one child process.
[[bin]]
name = "magna-carta-libreoffice"
path = "src/main.rs"

# The worker child: initialises LibreOfficeKit exactly once and then converts one document at a
# time, by path, for the rest of its life. This is the only binary that touches the suite.
[[bin]]
name = "magna-carta-libreoffice-worker"
path = "src/bin/worker.rs"

# A test double speaking the same pipe protocol, instructable to hang, crash, abort on a signal,
# report a runaway resident set, or emit a malformed frame. The pool state machine is proved
# against THIS, so the supervisor is covered on any machine with no LibreOffice installed. The
# image never copies it.
[[bin]]
name = "magna-carta-libreoffice-fake-worker"
path = "src/bin/fake-worker.rs"

[dependencies]
# The shared container host skeleton. Only `with_panic_net` and `serve` are taken: this container
# defines its own `/ready`, because a static 200 would be a lie while the pool is still warming.
# The `r2` feature stays off — no R2 egress here, so no reqwest/rustls/ring enters the image.
engine_host = { path = "../../crates/engine-host", package = "magna-carta-engine-host" }
# The LibreOfficeKit binding. Pinned exactly: an upgrade is a deliberate change with a golden-file
# review, never a range resolution. No build.rs, no cc, no bindgen, no -sys crate — the suite is
# reached through dlopen2 at run time, so nothing memory-unsafe is compiled into our binary.
libreofficekit = "=0.5.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The acceptance suite's structural inspector (examples/inspect-conversion.rs) reads the converted
# PDF's page count, extracted text, and embedded font names. lopdf is the same reader crates/pdf-core
# extracts text with, at the same pinned version, so this reuses the repository's PDF reader rather
# than introducing a second one — and taking it directly instead of through pdf-core keeps hayro and
# the image codecs out of this workspace's test build.
lopdf = "0.46"
# Loopback HTTP client for the full-app tests, matching containers/file-repair. default-features off
# + rustls keeps the TLS backend pure Rust; a test binary never ships.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
[lints.rust]
# `unsafe_code` is the one rule in the floor this workspace cannot take, and the exception is real rather
# than incidental: worker.rs:125 builds a `CStr` from the raw pointer LibreOfficeKit hands its error
# callback, which is the whole reason that binary exists. It is the only unsafe block here. Forbidding it
# workspace-wide would fail the build; denying it would need a `#[allow]` plus a safety comment on that
# block, which belongs to a change that is touching the worker. Everything else below is identical to
# crates/Cargo.toml, so a SECOND unsafe block arriving anywhere in this workspace is still invisible to
# the gate — that is the gap this note is recording, not excusing.
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
# `clippy::unwrap_used` is absent over 8 measured sites, every one of them a plain helper function in
# tests/pool.rs or tests/service.rs — test scaffolding the exemption in containers/clippy.toml cannot
# reach because none of them carries `#[test]`. No library or binary code in this workspace unwraps, so
# this is a file-level allow in two test files away from being denied.
