[package]
name = "magna-carta-file-repair"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "magna_carta_file_repair"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-file-repair"
path = "src/main.rs"

[dependencies]
# The shared container host skeleton (/ready, body cap, panic net, :8080 serve). file-repair is the first
# container to build on the harness; raster/scan predate it and hand-rolled axum.
engine_host = { path = "../../crates/engine-host", package = "magna-carta-engine-host" }
# The repair/salvage engine — diagnose/repair/carve. Pure, I/O-free; this host owns all HTTP/JSON.
recovery-core = { path = "../../crates/recovery-core" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
# Loopback HTTP client for the full-app tests. default-features off + rustls keeps the TLS backend
# pure-Rust (no native-tls/OpenSSL C dependency); the tests speak plain HTTP over an ephemeral port.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
