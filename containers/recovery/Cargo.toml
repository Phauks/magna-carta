[package]
name = "magna-carta-recovery"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + handler logic, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_recovery"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-recovery"
path = "src/main.rs"

[dependencies]
# Path dep on the sibling crate — the pure-Rust password-recovery engine.
decryption-core = { path = "../../crates/decryption-core" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
