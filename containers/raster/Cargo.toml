[package]
name = "magna-carta-raster"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + codec modules, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_raster"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-raster"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# Pure-Rust image codec library. Default features are disabled to exclude the AVIF encoder, which
# pulls in `ravif`/`rav1e`/`libfuzzer-sys`/`cc` (a C-compiler wrapper) — violating the no-C rule.
# Only the six pure-Rust codecs we actually convert are enabled; no C/-sys crate is in the tree.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "tiff",
  "bmp",
] }
# Pure-Rust PDF writer. Only the raster-images feature is enabled; simple-text and rayon are
# excluded (no font shaping, no thread-pool required for image-to-PDF). No C/-sys dependency is
# introduced — the pure-Rust codec chain (png/zune-jpeg/image-webp/gif) handles all image decoding
# inside krilla, and the image crate above supplies the decoded pixel data via from_rgba8.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
