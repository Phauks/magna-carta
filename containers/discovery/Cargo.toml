[package]
name = "magna-carta-discovery"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "magna_carta_discovery"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-discovery"
path = "src/main.rs"

[dependencies]
# The shared container host skeleton (/ready, body cap, panic net, :8080 serve).
engine_host = { path = "../../crates/engine-host", package = "magna-carta-engine-host" }
# The discovery engine — identify, extract, normalize, chunk, digest, fingerprint, expand. Pure and
# I/O-free; this host owns all HTTP and JSON. The `r2` feature above stays off: this container
# RECEIVES bytes and returns facts, so it links no HTTP client and no TLS stack.
discovery-core = { path = "../../crates/discovery-core" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[dev-dependencies]
# Loopback HTTP client for the full-app tests. default-features off + rustls keeps the TLS backend
# pure-Rust (no native-tls/OpenSSL C dependency); the tests speak plain HTTP over an ephemeral port.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Builds the archive fixtures the expansion routes are exercised against. Same pure-Rust backend the
# engine reads with, so the fixture and the reader agree about what a deflated entry is.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
