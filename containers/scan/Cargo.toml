[package]
name = "magna-carta-scan"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + engine modules, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_scan"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-scan"
path = "src/main.rs"

# Heavy engine dependencies (yara-x, lopdf, cfb, zip) are added in the tasks that introduce them, so the
# early skeleton builds fast.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The container transport: stream the request body straight to clamd's scratch file (futures-util drives
# the body's data-frame stream) and map it read-only (memmap2) so the in-process engines (yara, the
# structural heuristics) read the same bytes with no heap copy while clamd scans the file by path.
memmap2 = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pure-Rust YARA engine (the heuristic-rule scanner); no libyara C dependency.
yara-x = "1.18"
# Structural-heuristic parsers (all pure Rust). zip uses the lean deflate-flate2 feature set so it
# pulls no bzip2/zstd/lzma C deps (Windows-clean); encrypted-entry detection still works without AES.
lopdf = "0.41"
cfb = "0.14"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
