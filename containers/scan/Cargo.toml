[package]
name = "magna-carta-scan"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + engine modules, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_scan"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-scan"
path = "src/main.rs"

# Heavy engine dependencies (clamav-client, yara-x, lopdf, cfb, zip, quick-xml) are added in the tasks
# that introduce them, so the early skeleton builds fast.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
