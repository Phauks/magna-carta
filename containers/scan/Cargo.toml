[package]
name = "magna-carta-scan"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + engine modules, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_scan"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-scan"
path = "src/main.rs"

# Heavy engine dependencies (clamav-client, yara-x, lopdf, cfb, zip, quick-xml) are added in the tasks
# that introduce them, so the early skeleton builds fast.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust clamd socket client (no libclamav linkage); the `tokio` feature exposes the async module.
clamav-client = { version = "2.2.0", default-features = false, features = ["tokio"] }
# Pure-Rust YARA engine (the heuristic-rule scanner); no libyara C dependency.
yara-x = "1.18"
# Structural-heuristic parsers (all pure Rust). zip uses the lean deflate-flate2 feature set so it
# pulls no bzip2/zstd/lzma C deps (Windows-clean); encrypted-entry detection still works without AES.
lopdf = "0.41"
cfb = "0.14"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
