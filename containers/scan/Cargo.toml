[package]
name = "magna-carta-scan"
version = "0.1.0"
edition = "2021"
publish = false

# A lib (the router + engine modules, unit-testable) plus a thin binary that serves it on :8080.
[lib]
name = "magna_carta_scan"
path = "src/lib.rs"

[[bin]]
name = "magna-carta-scan"
path = "src/main.rs"

# The build-time signature-database extractor. Runs in the image build (never at runtime): reads the
# unpacked CVD/CLD signature files and writes the prefilter's atoms.db. Fail-closed + fail-loud — see
# src/bin/build-atoms.rs. Depends only on the lib's atoms.rs parsers + serde_json (already direct deps).
[[bin]]
name = "build-atoms"
path = "src/bin/build-atoms.rs"

# The build-time YARA Forge bundler. Runs in the image build (never at runtime): reads the downloaded
# YARA Forge package, drops the FP-prone heuristic pocket, compiles the kept rules with yara-x, and
# serializes them to the blob the runtime deserializes. Fail-closed + fail-loud — see
# src/bin/build-yara-rules.rs. Depends on the lib's forge.rs + yara.rs.
[[bin]]
name = "build-yara-rules"
path = "src/bin/build-yara-rules.rs"

# A throwaway RSS benchmark comparing the SCAN (mmap, file-backed) vs INSTREAM (heap buffer, anonymous)
# transports' service-side memory. Measurement only — not shipped in the runtime image.
[[bin]]
name = "rss-bench"
path = "src/bin/rss-bench.rs"

# Heavy engine dependencies (yara-x, lopdf, cfb, zip) are added in the tasks that introduce them, so the
# early skeleton builds fast.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The container transport: stream the request body straight to clamd's scratch file (futures-util drives
# the body's data-frame stream) and map it read-only (memmap2) so the in-process engines (yara, the
# structural heuristics) read the same bytes with no heap copy while clamd scans the file by path.
memmap2 = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pure-Rust YARA engine (the heuristic-rule scanner); no libyara C dependency.
yara-x = "1.22"
# Structural-heuristic parsers (all pure Rust). zip uses the lean deflate-flate2 feature set so it
# pulls no bzip2/zstd/lzma C deps (Windows-clean); encrypted-entry detection still works without AES.
lopdf = "0.46"
cfb = "0.16"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
# Inflate `/Type /ObjStm` object-stream bodies in the PDF abort guard so the structural depth pre-check
# also covers the recursion lopdf drives over decompressed object streams (same engine `zip` uses).
flate2 = "1"
# The prefilter's file-hash leg: MD5 + SHA1 + SHA256 over each buffer, looked up in the baked hash sets.
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
# The PORTABLE prefilter matcher backend (default): aho-corasick multi-literal scanning for the escaped
# atoms and the `regex` engine for the residual PCREs. It builds with no C toolchain, so the crate (and
# its full test suite) compiles on every dev host. The production container swaps in the `vectorscan`
# feature for the SIMD engine; the prefilter's verdict logic and soundness are identical across both.
aho-corasick = "1"
regex = "1"
# The PRODUCTION matcher backend: Vectorscan/Hyperscan SIMD literal+regex scanning. Optional because its
# `-sys` crate vendors C++ (cmake/g++/libboost/ragel) that only builds in the Linux scan image — the
# `vectorscan` feature turns it on there. The default (portable) build needs none of that toolchain.
vectorscan-rs = { version = "0.0.6", optional = true }
# Google Magika: ML content-type identification for the `/identify` route. The standard model is EMBEDDED
# in the crate (a const byte array), so no model file is fetched AT RUNTIME — the container keeps its
# no-egress posture. NOTE: magika 1.1 is NOT pure Rust — it runs inference through `ort` (ONNX Runtime, a
# C++ library); there is no pure-Rust backend. This is a C/C++ dependency (golden rule 14 — flagged for
# consent in containers/scan/CLAUDE.md).
magika = "1.1"
# ONNX Runtime backend for magika. `download-binaries` fetches a prebuilt onnxruntime AT BUILD TIME and
# statically links it (no system lib to install, no runtime egress, no runtime external file) — the same
# build-time-fetch / runtime-sealed pattern as the baked clamd DB and YARA Forge corpus. Pinned to the
# exact version magika resolves so the added feature unifies onto magika's own `ort`. Build-time download
# only; the running container never reaches the network.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }

[features]
# Off by default so the crate compiles on any dev host; the scan image's build stage enables it to bake
# the SIMD matcher (the Dockerfile already installs cmake/g++/libboost-dev/ragel for it).
vectorscan = ["dep:vectorscan-rs"]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }

# The lint floor. Same rules as crates/Cargo.toml, stated here because every container is its own Cargo
# workspace and a workspace lint table reaches nothing outside its own tree. This workspace holds one
# package, so the tables sit on the package directly and there is no `workspace = true` opt-in to forget.
# Levels were measured against this workspace with `cargo clippy --all-targets` before being set; what is
# absent is absent on evidence and says so. The print/exit restrictions that crates/Cargo.toml denies are
# deliberately not here: a container's binary IS the process, so writing a startup diagnostic to stderr
# and exiting non-zero on a fatal boot failure is the correct behaviour rather than a smell.
# This is also the workspace where the memory-safety rule has the least room, which is worth stating
# plainly next to the C/C++ exception this container already carries (clamd, ONNX Runtime behind magika —
# both documented and consented in containers/scan/CLAUDE.md).
[lints.rust]
# `unsafe_code` cannot go on here, over exactly two sites, both memory maps: spool.rs:134 maps the
# scratch file so the in-process engines read the same bytes clamd scans without a second heap copy, and
# rss-bench.rs:52 does the same in the throwaway memory benchmark. The spool site already carries the
# SAFETY note that justifies it. Forbidding this workspace-wide would fail the build; denying it would
# need an `#[allow]` on each block, which belongs to a change that is touching them. Until then a THIRD
# unsafe block arriving here is invisible to the gate, which is the gap this records rather than excuses.
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# `clippy::unwrap_used` is absent over two sites, both in a plain helper in tests/scan_fault.rs that the
# test exemption in containers/clippy.toml cannot reach because the helper carries no `#[test]`. No
# library, binary or example code in this workspace unwraps, so one file-level allow turns this on.
# `clippy::mem_forget` is absent over one site: spool.rs:138 forgets the partial-file guard once the
# write has succeeded, which is how ownership of the cleanup transfers to `Spooled`'s `Drop`. That is
# the deliberate use of the call, not the accident the lint hunts; `ManuallyDrop` would express it
# without the lint and is a small refactor rather than a lint decision.
#
# Measured with the default feature set, which is what the gate builds. The `vectorscan` feature is off
# here and on in the scan image's build stage, so the SIMD matcher behind it is linted by neither — that
# gap predates this table and belongs to whatever puts a `--features vectorscan` pass in the gate.
