[workspace]
resolver = "2"
members = [
  "engine-host",
  "ocr-core",
  "pdf-core",
  "pdf-eval",
  "recovery-core",
  "decryption-core",
  "email-core",
  "search-core",
  "search-eval",
  "discovery-core",
  "seven-zip-listing-core",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
hayro = "0.7"
image = "0.25"
lopdf = "0.44"

[profile.release]
opt-level = "z"
lto = true
strip = true

# Benchmarking profile. The release profile above optimizes for SIZE (`opt-level = "z"`), which is right
# for a wasm artifact or a container image and wrong for a measurement: it produces code several tens of
# percent slower than a speed-optimized build, so a latency taken under it understates the engine and a
# baseline taken under one profile cannot be compared with a run under the other. `search-eval` therefore
# documents `--profile benchmark` as its command, and records in every baseline which profile produced it.
# Additive: nothing that builds with `--release` today changes.
[profile.benchmark]
inherits = "release"
opt-level = 3
debug-assertions = false
