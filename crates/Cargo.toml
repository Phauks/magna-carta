[workspace]
resolver = "2"
members = [
  "engine-host",
  "ocr-core",
  "pdf-core",
  "pdf-eval",
  "recovery-core",
  "decryption-core",
  "email-core",
  "search-core",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
hayro = "0.7"
image = "0.25"
lopdf = "0.44"

[profile.release]
opt-level = "z"
lto = true
strip = true
