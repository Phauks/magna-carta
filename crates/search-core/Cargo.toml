[package]
name = "search-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Tantivy is the keyword/BM25 engine. Pure Rust, no C dependency (golden rule 14 in the repo
# CLAUDE.md) — the index it builds is the discovery keyword index, packaged here as a self-contained
# `Split` (see `split.rs`) so it can live in per-firm R2 rather than on a Container's local disk.
tantivy = "0.27"
# Composes a letter and its accent into one character before the body is cut into words (see
# `schema.rs`). Pure Rust, and already in the workspace through discovery-core.
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Build scratch: an index is built in a temporary on-disk directory (the Container's local scratch in
# production) and then bundled into a split. Nothing here reads or writes a persistent path.
tempfile = "3"

# The workspace lint floor (see crates/Cargo.toml): unsafe Rust forbidden, and the abort lints denied so a
# malformed input returns an error instead of taking the process down. A member that omits this table is
# not covered by any of it.
[lints]
workspace = true
