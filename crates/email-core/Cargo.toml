[package]
name = "email-core"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Empty default features upstream; full_encoding buys the 41-charset decoder set
# (including the legacy encodings real correspondence still arrives in).
mail-parser = { version = "0.11.5", default-features = false, features = ["full_encoding"] }
# The CFB/OLE2 container layer behind .msg. Pure Rust, and defensive against
# untrusted input: open()/walk()/stream reads propagate every structural fault as
# an io::Error rather than panicking, bounds-check every persisted index against
# the real input, detect FAT/directory cycles, and cap the stream read buffer — so
# no crafted .msg can abort the isolate (which has no unwinding). The MAPI property
# streams inside the container are decoded above this crate, bounded ourselves.
cfb = "0.16"
engine_host = { path = "../engine-host", package = "magna-carta-engine-host" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# Drives the wasm-edge marshalling tests under `wasm-pack test`; wasm-only and
# dev-only, so it is never part of the shipped artifact.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The workspace lint floor (see crates/Cargo.toml): unsafe Rust forbidden, and the abort lints denied so a
# malformed input returns an error instead of taking the process down. A member that omits this table is
# not covered by any of it.
[lints]
workspace = true
