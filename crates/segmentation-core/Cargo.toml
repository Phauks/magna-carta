[package]
name = "segmentation-core"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The inference runtime. Pure Rust with no native build step anywhere in its tree, which is why it was
# chosen over tract (whose linear-algebra crate assembles hand-written kernels with `cc` when built for a
# native target). `onnx_format` reads the committed model directly; the default `contrib` operators and
# the `.rten` format are not needed.
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.28"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# The workspace lint floor (see crates/Cargo.toml): unsafe Rust forbidden, and the abort lints denied so a
# malformed input returns an error instead of taking the process down. A member that omits this table is
# not covered by any of it.
[lints]
workspace = true
