[package]
name = "decryption-core"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = { workspace = true }
zip = { version = "9.4", default-features = false, features = ["aes-crypto", "deflate"] }
cfb = "0.16"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
cfb-mode = "0.9"
rc4 = "0.2"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# lopdf pulls in getrandom transitively; wasm32-unknown-unknown requires the
# wasm_js feature to compile.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
hex = "0.4"
ms-offcrypto-writer = "1"
rand = "0.9"

# The workspace lint floor (see crates/Cargo.toml): unsafe Rust forbidden, and the abort lints denied so a
# malformed input returns an error instead of taking the process down. A member that omits this table is
# not covered by any of it.
[lints]
workspace = true
