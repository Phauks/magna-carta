[package]
name = "disarm-core"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine_host = { path = "../engine-host", package = "magna-carta-engine-host" }
# The PDF pass runs pdf-core's own guard and attachment/XFA scrub first, so a PDF that pdf-core would
# refuse as a bomb or a locked file is refused here for the same reason, in the same words.
pdf-core = { path = "../pdf-core" }
lopdf = { workspace = true }
# Office documents are zip packages. The same lean, pure-Rust feature set recovery-core uses: deflate
# through flate2's miniz_oxide backend and nothing that links C.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Streaming XML reader and writer for the parts of a package that are rewritten rather than copied:
# relationships, content types, and the body parts whose field codes and formulas are neutralized.
quick-xml = "0.41"
# An embedded object that is not itself a package is replaced with an empty compound file, which this
# crate writes. Pure Rust.
cfb = "0.16"
# Pictures are decoded to pixels and encoded afresh, which is what drops everything that is not the
# picture: metadata, trailing bytes, a second file hiding behind the first.
image = { workspace = true }

[dev-dependencies]
cfb = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# The workspace lint floor (see crates/Cargo.toml): unsafe Rust forbidden, and the abort lints denied so a
# malformed input returns an error instead of taking the process down. A member that omits this table is
# not covered by any of it.
[lints]
workspace = true
