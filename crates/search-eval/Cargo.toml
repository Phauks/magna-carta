[package]
name = "search-eval"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
# The crate under measurement. `search-eval` reaches it only through its PUBLIC surface — it never
# reimplements engine logic, so a number here is a number the engine actually produces. Where the
# public surface cannot reach a path (see `fanout.rs`), the report says so rather than substituting a
# lookalike and presenting the result as the engine's.
search-core = { path = "../search-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
