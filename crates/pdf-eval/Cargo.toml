[package]
name = "pdf-eval"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
pdfium = ["dep:pdfium-render", "dep:image-compare"]
corpus-fetch = ["dep:reqwest"]

[dependencies]
pdf-core = { path = "../pdf-core" }
ocr-core = { path = "../ocr-core" }
hayro = { workspace = true }
image = { workspace = true }
lopdf = "0.46"
pdf = "0.10"
pdfium-render = { version = "0.9", optional = true }
image-compare = { version = "0.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "blocking",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# This crate spells the floor out instead of inheriting it, because Cargo refuses to let a package carry
# both `workspace = true` and an override in the same `[lints]` table. The `rust` half below is a verbatim
# copy of crates/Cargo.toml's and must stay one; the `clippy` half is where this crate differs and why.
[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
ffi_unwind_calls = "deny"
missing_abi = "deny"
macro_use_extern_crate = "deny"
unused_extern_crates = "deny"
meta_variable_misuse = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unit_bindings = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
non_local_definitions = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
dbg_macro = "deny"
# pdf-eval is a developer command-line harness, not a shipped engine: it is run by hand against a corpus
# on somebody's machine, its whole output is what it prints, and an unusable corpus path should stop it
# where it stands rather than be threaded through a result type nobody reads. The engine it measures is
# pdf-core, which is held to the full floor. Measured here: 21 unwrap_used, 1 panic, 38 print_stdout,
# 19 print_stderr, 11 exit.
unwrap_used = "allow"
panic = "allow"
print_stdout = "allow"
print_stderr = "allow"
exit = "allow"
