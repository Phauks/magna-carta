    const b = $("rmMax");
    b.innerHTML = recordMaxOn ? I.minimize : I.maximize;
    b.title = recordMaxOn ? "Restore the window to its usual size" : "Expand the window to the full screen";
    b.setAttribute("aria-label", b.title);
  };
  $("rmMax").addEventListener("click", () => {
    recordMaxOn = !recordMaxOn;
    try { sessionStorage.setItem("tkRecordMax", recordMaxOn ? "1" : "0"); } catch { /* ignore */ }
    sync();
  });
  $("rmClose").addEventListener("click", () => (o.onClose ?? closeEntry)());
  const eb = $("rmEdit");
  if (eb !== null && !eb.disabled && o.edit?.run) eb.addEventListener("click", o.edit.run);
  const pb = $("rmPrint");
  if (pb !== null && o.print?.run) pb.addEventListener("click", o.print.run);
  sync();
}

/* The shell. One shape for every record: nothing here knows what a time entry is. */
function tkRecordModal(spec) {
  recordSpec = spec;
  spec.state = spec.state ?? { tab: spec.defaultTab ?? spec.tabs[0]?.key ?? null };
  const render = () => {
    const tabBtns = spec.tabs.map((t) =>
      '<button data-rtab="' + t.key + '"' + (spec.state.tab === t.key ? ' aria-current="true"' : "") + ' title="' + esc(t.title ?? t.label) + '">' + t.label +
      (t.badge ? '<span class="n">' + t.badge + "</span>" : "") + "</button>").join("");
    $("tkEntryWash").innerHTML =
      '<div class="dialog xl twopane" role="dialog" aria-modal="true" aria-label="' + esc(spec.heading) + '">' +
      tkModalHeaderActs(spec.headerActs) +
      "<header><h2>" + spec.heading + '</h2><span class="subtitle">' + spec.subtitleHtml + "</span></header>" +
      '<div class="tp">' +
      '<div class="tpleft scrollable">' + spec.leftHtml + "</div>" +
      '<div class="tpright"><div class="mtabs">' + tabBtns + '</div><div class="tpbody scrollable" id="rtBody"></div></div>' +
      "</div>" +
      '<div class="actbar">' + spec.footerHtml + "</div></div>";
    $("tkEntryWash").hidden = false;
    const renderTab = () => {
      const t = spec.tabs.find((x) => x.key === spec.state.tab) ?? spec.tabs[0];
      if (!t) return;
      $("rtBody").innerHTML = t.render();
      if (t.wire) t.wire();
    };
    document.querySelectorAll("[data-rtab]").forEach((b) => b.addEventListener("click", () => {
      spec.state.tab = b.dataset.rtab;
      document.querySelectorAll("[data-rtab]").forEach((x) => {
        if (x.dataset.rtab === spec.state.tab) x.setAttribute("aria-current", "true");
        else x.removeAttribute("aria-current");
      });
      renderTab();
    }));
    renderTab();
    /* The header controls are the SHELL's, not the surface's — so no record window can be missing
       one, or put them in a different order. */
    wireTkModalHeaderActs(spec.headerActs);
    spec.wire();
  };
  spec.rerender = render;
  render();
}

/* ---- The History tab: the record's own events, oldest first, absolute stamps ---- */
function tkHistoryTabHtml(evs) {
  if (!evs || evs.length === 0) return '<div class="notefact">' + I.info + "<span>No events yet. Saving records the first one.</span></div>";
  return '<ul class="hist">' + evs.map((ev, i) =>
    "<li" + (i === evs.length - 1 ? ' class="now"' : "") + '><span class="ev">' + esc(ev.what) + "</span>" +
    '<span class="evmeta num">' + esc(ev.at) + " &middot; " + esc(ev.who) + "</span>" +
    (ev.detail === undefined || ev.detail === null ? "" : '<span class="evdetail">&ldquo;' + esc(ev.detail) + "&rdquo;</span>") +
    "</li>").join("") + "</ul>";
}

/* ---- The Attachments tab: as many files as the work produced, each removable ----
 * TWO SOURCES, in the shared template's order: most of the time the file is already in the matter,
 * so associating the matter's own document is the first offer and uploading is the second.
 * Detaching is not deleting — the file stays in the matter's documents. */
function tkAttachmentsTabHtml(working, canEdit) {
  const list = working.files.map((a, i) =>
    '<div class="attrow">' + (a.docId === null ? I.paperclip : I.file) +
    '<span class="attname" title="' + esc(a.name + (a.docId === null ? " — uploaded to this entry" : " — the matter's own file, associated to this entry")) + '">' + esc(a.name) + "</span>" +
    '<button class="iconbtn" data-attopen="' + i + '" title="Open ' + esc(a.name) + ' in the matter&#39;s files" aria-label="Open">' + I.eye + "</button>" +
    (canEdit ? '<button class="iconbtn" data-attremove="' + i + '" title="Remove ' + esc(a.name) + ' from this entry. The file stays in the matter&#39;s files" aria-label="Remove">' + I.close + "</button>" : "") +
    "</div>").join("");
  const m = working.matter;
  const taken = new Set(working.files.map((a) => a.docId).filter((d) => d !== null));
  const picker = m === null
    ? '<div class="notefact warn">' + I.info + "<span>Choose a matter first — a file is associated from the matter's own documents.</span></div>"
    : '<div class="attsrc">' +
      '<button class="btn secondary" id="tkPickDoc" title="Associate a file already in this matter&#39;s documents — the same file, not a copy of it">' + I.file + "From the Matter&hellip;</button>" +
      '<button class="btn secondary" id="tkAttachBtn" title="Upload a file from this computer. It lands in the matter&#39;s files and attaches to this entry">' + I.upload + "Upload&hellip;</button>" +
      '<input type="file" id="tkAttachFile" multiple hidden></div>' +
      '<div class="docpick" id="tkDocList" hidden>' +
      (MATTER_FILES[m.num] ?? []).map((name) =>
        '<button class="dprow' + (taken.has(name) ? " used" : "") + '" data-docid="' + esc(name) + '"' + (taken.has(name) ? " disabled" : "") +
        ' title="' + (taken.has(name) ? "Already attached to this entry" : "Associate " + esc(name) + " with this entry") + '">' +
        I.file + '<span class="dpname">' + esc(name) + "</span></button>").join("") +
      "</div>";
  return (list || '<div class="notefact">' + I.info + "<span>No files attached to this entry.</span></div>") + (canEdit ? picker : "");
}
function wireTkAttachments(working, canEdit) {
  const rerenderTab = () => {
    const body = $("rtBody");
    if (body) { body.innerHTML = tkAttachmentsTabHtml(working, canEdit); wireTkAttachments(working, canEdit); }
    /* The tab strip is not re-rendered around the body, so its count is updated in place —
       otherwise the badge keeps saying what the record held when the window opened. */
    const tab = document.querySelector('[data-rtab="attachments"]');
    if (tab !== null) {
      const n = working.files.length;
      const badge = tab.querySelector(".n");
      if (n === 0) { if (badge) badge.remove(); }
      else if (badge) badge.textContent = String(n);
      else tab.insertAdjacentHTML("beforeend", '<span class="n">' + n + "</span>");
    }
  };
  document.querySelectorAll("[data-attopen]").forEach((b) => b.addEventListener("click", () =>
    toast("Opens " + working.files[Number(b.dataset.attopen)].name + " (the Documents surface)")));
  if (!canEdit) return;
  document.querySelectorAll("[data-attremove]").forEach((b) => b.addEventListener("click", () => {
    const i = Number(b.dataset.attremove);
    const name = working.files[i].name;
    working.files.splice(i, 1);
    toast("Removed " + name + " from this entry. The file stays in the matter's files.");
    rerenderTab();
  }));
  const pd = $("tkPickDoc");
  if (pd) pd.addEventListener("click", () => {
    const list = $("tkDocList");
    list.hidden = !list.hidden;
    pd.setAttribute("aria-pressed", String(!list.hidden));
  });
  document.querySelectorAll("[data-docid]").forEach((b) => b.addEventListener("click", () => {
    if (b.disabled) return;
    working.files.push({ name: b.dataset.docid, docId: b.dataset.docid });
    toast("Associated " + b.dataset.docid + " — the matter's own file, not a copy of it.");
    rerenderTab();
  }));
  const ab = $("tkAttachBtn");
  if (ab) ab.addEventListener("click", () => $("tkAttachFile").click());
  const fi = $("tkAttachFile");
  if (fi) fi.addEventListener("change", (ev) => {
    for (const f of ev.target.files ?? []) working.files.push({ name: f.name, docId: null });
    rerenderTab();
  });
}

/* ---- The Billing tab: where this entry stands toward a bill. No review language: this surface
 * never solicits submission (the round-five governing stance), so the tab carries the disposition
 * and the honest fact that nothing has claimed the entry yet. ---- */
function tkBillingTabHtml(r) {
  const missing = missingFacts(r);
  return '<dl class="insfacts">' +
    "<dt>Billing</dt><dd>Billable, next invoice</dd>" +
    "<dt>Rate</dt><dd>" + (r.rate === null ? '<span class="muted">Resolves when a matter is set</span>' : "$" + r.rate.toFixed(2) + " / h" + (r.card === "custom" ? " (custom override)" : "")) + "</dd>" +
    "<dt>Billed hours</dt><dd>" + (liveSec(r) > 0 ? hoursLabel(billedHours(liveSec(r))) + " h" : '<span class="muted">&mdash;</span>') + "</dd>" +
    "<dt>Amount</dt><dd>" + (liveSec(r) > 0 && r.rate !== null ? money(rowTotal(r)) : '<span class="muted">&mdash;</span>') + "</dd>" +
    "</dl>" +
    '<div class="notefact">' + I.info + "<span>Not on a bill yet. A draft invoice claims it from the Billing tab.</span></div>" +
    (missing.length > 0
      ? '<div class="notefact warn">' + I.alert + "<span>Incomplete: needs " + esc(missing.join(", ")) + ". It stays on the sheet until completed, and nothing downstream can bill it.</span></div>"
      : "");
}

/* ---- The print sheet. TA1: every unit is printable. The INTERNAL MEMO IS NOT ON IT — the sheet
 * is the client-facing rendering of the record, and the memo never appears on one. ---- */
function tkPrintRecord(r) {
  const rowsHtml = [
    ["Time code", r.code + (r.wasTmp ? " (was " + r.wasTmp + ")" : "")],
    ["Matter", r.matter ? r.matter.num + " · " + r.matter.title : "—"],
    ["Work date", usDate(r.date)],
    ["Date entered", usDate(r.entered)],
    ["Timekeeper", r.who],
    ["Entered by", r.via],
    ["Description", r.note || "—"],
    ["Worked", fmtDur(liveSec(r))],
    ["Billed hours", liveSec(r) > 0 ? hoursLabel(billedHours(liveSec(r))) + " h" : "—"],
    ["Rate", r.rate === null ? "—" : "$" + r.rate.toFixed(2) + " / h"],
    ["Amount", liveSec(r) > 0 && r.rate !== null ? money(rowTotal(r)) : "—"],
    ["Files", r.files.length === 0 ? "—" : r.files.map((f) => f.name).join("; ")],
  ].map(([k, v]) => "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>").join("");
  $("tkPrintWash").innerHTML =
    '<div class="dialog" role="dialog" aria-modal="true" aria-label="Print preview">' +
    '<header><div class="htext"><h2>Print &mdash; entry ' + esc(r.code) + "</h2>" +
    '<div class="fromrun">The sheet as it will print. The internal memo is not on it.</div></div>' +
    '<button class="iconbtn" id="tkPrintClose" title="Close" aria-label="Close">' + I.close + "</button></header>" +
    '<div class="body scrollable"><div class="printsheet" data-client-facing="true"><h3>Time Entry</h3><dl class="insfacts">' + rowsHtml + "</dl></div></div>" +
    '<footer><span class="foothint">Print lives on every record, and on the row menu.</span>' +
    '<button class="btn primary" id="tkPrintGo">Print</button></footer></div>';
  $("tkPrintWash").hidden = false;
  $("tkPrintClose").addEventListener("click", () => { $("tkPrintWash").hidden = true; });
  $("tkPrintGo").addEventListener("click", () => toast("Hands this sheet to the browser's print dialog"));
}

/* ---- The record's field list. The Matter field is the Time Sheet's one genuine difference from
 * the matter tab's copy of this window, and it lives HERE, in the fields — not in a different
 * modal. ---- */
function tkRecordLeftHtml(r, working) {
  return '<div class="field"><label for="eInfo">Description</label>' +
    '<textarea id="eInfo" class="grow" rows="1" placeholder="Description" title="The description — the entry\'s billed text" spellcheck="true">' + esc(r.note) + "</textarea></div>" +
    '<div class="grid3">' +
    '<div class="field"><label for="eDate">Work date</label><input type="date" id="eDate" value="' + r.date + '"></div>' +
    '<div class="field"><label for="eMatter">Matter</label>' + comboFieldHtml("eMatter") + "</div>" +
    '<div class="field"><label for="eWho">Staff</label>' + comboFieldHtml("eWho") + '<span class="hint" id="eWhoHint"></span></div>' +
    "</div>" +
    '<div class="grid3">' +
    '<div class="field"><label for="eCategory">Category</label>' + comboFieldHtml("eCategory") + "</div>" +
    '<div class="field"><label for="eActivity">Activity code</label>' + comboFieldHtml("eActivity") + "</div>" +
    '<div class="field"><label for="eWorked">Time worked</label><input type="text" id="eWorked" class="num" placeholder="Time worked" title="Typed either way: 1:30 or 1.5"></div>' +
    "</div>" +
    /* ONE arithmetic relationship on ONE line: worked, rounded to billed, times rate, equals
       amount — the operators carry the relationship. */
    '<div class="arithstrip">' +
    '<div class="ai"><span class="alab">Billed</span><span class="aval num" id="eBilled">&mdash;</span></div>' +
    '<span class="aop">&times;</span>' +
    '<div class="ai"><span class="alab">Rate</span><span class="aval num" id="eRate">&mdash;</span></div>' +
    '<span class="aop">=</span>' +
    '<div class="ai"><span class="alab">Amount</span><span class="aval num" id="eAmount">&mdash;</span></div>' +
    '</div><div class="arithnote" id="eRoundNote"></div>' +
    /* The internal memo is REAL (round seven, item 1): written here and on the row's third line,
       kept on the record, and shown nowhere a client can see it. */
    '<div class="field memoblock" data-internal-only="true"><label for="eMemo">Internal Memo <span class="memotag">Internal</span></label>' +
    '<textarea id="eMemo" class="grow" rows="1" placeholder="Internal Memo" title="For the firm only. It never appears on a bill or a printed sheet." spellcheck="true">' + esc(r.memo) + "</textarea></div>" +
    '<div class="hint num" id="eDates"></div>';
}
function comboFieldHtml(id) {
  return '<span class="combowrap"><input id="' + id + '" class="combo" placeholder="' + esc(DIALOG_COMBOS[id].placeholder) + '" autocomplete="off" spellcheck="false">' +
    '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>';
}

function openEntry(id, tab) {
  const r = rows.find((x) => x.id === id);
  if (!r) return;
  entryOpenId = id;
  /* The record edits in place, exactly as the sheet's cells do — this window is the same record at
     a larger altitude, not a staging copy. Attachments ride the record for the same reason. */
  const working = r;
  const tabs = [
    { key: "history", label: "History", title: "Everything that has happened to this entry", badge: (r.events ?? []).length || null,
      render: () => tkHistoryTabHtml(r.events) },
    { key: "attachments", label: "Attachments", title: "The files this time was spent on", badge: r.files.length || null,
      render: () => tkAttachmentsTabHtml(working, true), wire: () => wireTkAttachments(working, true) },
    { key: "billing", label: "Billing", title: "Where this entry stands toward a bill",
      render: () => tkBillingTabHtml(r) },
  ];
  tkRecordModal({
    heading: "Time Entry",
    subtitleHtml: 'Entry <span class="num">' + esc(r.code) + "</span>" + (isProvisional(r.code) ? " <span class=\"memotag\">provisional</span>" : "") +
      " &middot; " + (r.matter ? esc(r.matter.num + " · " + r.matter.title) : '<span class="muted">no matter yet</span>'),
    leftHtml: tkRecordLeftHtml(r, working),
    tabs,
    /* An entry WITH files opens on them — the attachment is in front, not one click away. */
    defaultTab: tab ?? (r.files.length > 0 ? "attachments" : "history"),
    headerActs: {
      edit: { can: false, why: "This entry is already editable — every field on the left is live" },
      print: { why: "Print this time entry by itself", run: () => tkPrintRecord(r) },
      onClose: closeEntry,
    },
    footerHtml:
      '<span class="foothint">Saves the entry; the sheet updates behind this window.</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn secondary" id="tkEntryCancel">Cancel</button>' +
      '<button class="btn secondary" id="tkEntrySaveNew">Save &amp; New</button>' +
      '<button class="btn primary" id="tkEntrySave">Save &amp; Close</button>',
    wire() { wireEntryFields(r); },
  });
}

function wireEntryFields(r) {
  setComboValue("eMatter", r.matter ? r.matter.num : "");
  setComboValue("eWho", r.who);
  setComboValue("eCategory", r.cat ?? ENTRY_CATEGORIES[0]);
  setComboValue("eActivity", r.act ?? "");
  $("eWorked").value = r.sec > 0 ? fmtDur(r.sec) : "";
  $("eWhoHint").textContent = isDelegated(r)
    ? "Entered by " + r.via + " — delegated; both people stay on the entry."
    : "Entered by " + r.via + " — the timekeeper entered it.";
  $("eDates").textContent = "Work date " + usDate(r.date) + " · recorded " + usDate(r.entered) + " (automatic) · entered by " + r.via;
  Object.keys(DIALOG_COMBOS).forEach(wireDialogCombo);
  autoSizeNote($("eInfo"));
  autoSizeNote($("eMemo"));
  $("eInfo").addEventListener("input", () => autoSizeNote($("eInfo")));
  $("eMemo").addEventListener("input", () => autoSizeNote($("eMemo")));
  $("eWorked").addEventListener("input", () => updateEntryArith(r));
  updateEntryArith(r);
  $("tkEntryCancel").addEventListener("click", closeEntry);
  $("tkEntrySave").addEventListener("click", () => { if (saveEntry(r)) closeEntry(); });
  /* SAVE & NEW keeps the window open on a fresh entry, carrying the context forward (work date,
     matter, staff, category, activity) and clearing what belongs to the entry just saved
     (description, memo, duration, files) — the settled Log Time behavior. */
  $("tkEntrySaveNew").addEventListener("click", () => {
    if (!saveEntry(r)) return;
    const next = createRow(r.date);
    next.matter = r.matter;
    next.who = r.who;
    next.cat = r.cat;
    next.act = r.act;
    if (next.matter) { next.rate = r.rate; next.card = r.card; }
    if (next.matter && isProvisional(next.code)) {
      next.wasTmp = next.code;
      next.code = mintPermanent(next.matter.num);
    }
    widenScopeFor(next.date, "entry you just created");
    autoSave(next);
    render();
    toast("Saved " + r.code + " — a new entry is open, carrying the matter and the date");
    openEntry(next.id, "history");
    $("eInfo").focus();
  });
}
function updateEntryArith(r) {
  const sec = parseDur($("eWorked").value) ?? r.sec;
  const bh = sec > 0 ? billedHours(sec) : 0;
  $("eBilled").textContent = bh > 0 ? hoursLabel(bh) + " h" : "—";
  $("eRate").textContent = r.rate === null ? "no rate yet" : "$" + r.rate.toFixed(2) + (r.card === "custom" ? " (custom)" : "");
  $("eAmount").textContent = r.rate !== null && bh > 0 ? money(bh * r.rate) : "—";
  $("eRoundNote").textContent = "Rounded to the firm's 6-minute increment, nearest. Amounts are pre-tax.";
}
function saveEntry(r) {
  pushHistory("edit in the record window on " + r.code);
  const m = MATTERS.find((x) => x.num === comboValue("eMatter")) ?? null;
  const hadNoMatter = r.matter === null;
  if ((m ? m.num : null) !== (r.matter ? r.matter.num : null)) recordEvent(r, m ? "Matter set to " + m.num : "Matter cleared");
  r.matter = m;
  if (m && hadNoMatter && isProvisional(r.code)) {
    r.wasTmp = r.code;
    r.code = mintPermanent(m.num);
    recordEvent(r, "Permanent time code " + r.code + " minted", "was " + r.wasTmp);
  }
  const newWho = comboValue("eWho");
  if (newWho !== r.who) {
    r.who = newWho;
    r.via = ME;
    if (r.card !== "custom") r.rate = RATE_CARDS[0].rateFor(newWho);
    recordEvent(r, "Timekeeper changed to " + newWho, newWho === ME ? undefined : "Delegated entry — " + ME + " recorded as the enterer");
  }
  r.cat = comboValue("eCategory");
  r.act = comboValue("eActivity");
  if ($("eDate").value && $("eDate").value !== r.date) {
    r.date = $("eDate").value;
    recordEvent(r, "Work date changed to " + usDate(r.date));
    widenScopeFor(r.date, "entry you just saved");
  }
  if ($("eInfo").value.trim() !== r.note) { r.note = $("eInfo").value.trim(); recordEvent(r, "Description edited"); }
  if ($("eMemo").value.trim() !== r.memo) {
    r.memo = $("eMemo").value.trim();
    recordEvent(r, r.memo === "" ? "Internal memo cleared" : "Internal memo edited");
  }
  const sec = parseDur($("eWorked").value);
  if (sec !== null && sec !== r.sec) {
    if (r.timer === "running") pauseTimerOn(r);
    r.sec = sec;
    recordEvent(r, "Duration set to " + fmtDur(sec));
  }
  if (r.rate === null && r.matter) { r.rate = RATE_CARDS[0].rateFor(r.who); r.card = "standard"; }
  autoSave(r);
  render();
  return true;
}
function closeEntry() {
  $("tkEntryWash").hidden = true;
  $("tkEntryWash").innerHTML = "";
  $("tkDialogMenu").hidden = true;
  entryOpenId = null;
  recordSpec = null;
  render();
}

$("tkChip").addEventListener("click", () => setModal(!modalOpen));
$("tkClose").addEventListener("click", () => setModal(false));
$("tkWash").addEventListener("click", (e) => { if (e.target === $("tkWash")) setModal(false); });
$("tkUndoBtn").addEventListener("click", () => undo(1));
$("tkRedoBtn").addEventListener("click", () => redo(1));
$("tkUndoMore").addEventListener("click", () => openHistMenu("undo"));
$("tkRedoMore").addEventListener("click", () => openHistMenu("redo"));

/* New entry (round six, item 7): the same act as adding a row, but it opens the DEDICATED
   single-entry screen — the full form — instead of putting the cursor in the grid. The row is a
   real entry from the moment the button is pressed, exactly as an inline one is. */
$("tkNewEntryBtn").addEventListener("click", () => {
  const r = createRow(TODAY);
  widenScopeFor(r.date, "entry you just created");
  render();
  openEntry(r.id);
});
$("tkColsBtn").addEventListener("click", openColsMenu);
$("tkScopeBtn").addEventListener("click", openScopeMenu);
$("tkSearchBtn").addEventListener("click", () => { searchOpen = true; renderBarStates(); $("tkSearch").focus(); });
$("tkSearch").addEventListener("input", () => { searchQ = $("tkSearch").value.trim(); renderRows(); $("tkSearchWrap").classList.toggle("on", searchQ !== ""); });
$("tkSearch").addEventListener("blur", () => { if (searchQ === "") setTimeout(() => { if (searchQ === "" && !$("tkSearch").matches(":focus")) { searchOpen = false; renderBarStates(); } }, 150); });
$("tkSearchClear").addEventListener("click", () => { searchQ = ""; $("tkSearch").value = ""; searchOpen = false; render(); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && modalOpen) { e.preventDefault(); undo(1); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z")) && modalOpen) { e.preventDefault(); redo(1); return; }
  if (e.key !== "Escape") return;
  if (!$("tkEntryWash").hidden) closeEntry();
  else if (comboFor !== null) closeCombos();
  else if (!$("tkFilterMenu").hidden) $("tkFilterMenu").hidden = true;
  else if (!$("tkColsMenu").hidden) $("tkColsMenu").hidden = true;
  else if (!$("tkScopeMenu").hidden) $("tkScopeMenu").hidden = true;
  else if (!$("tkHistMenu").hidden) $("tkHistMenu").hidden = true;
  else if (searchOpen) { searchQ = ""; $("tkSearch").value = ""; searchOpen = false; render(); }
  else if (modalOpen) setModal(false);
});

/* ---------- mockbar scenarios ---------- */
document.querySelectorAll(".mockbar [data-scene]").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".mockbar [data-scene]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    rows = freshRows(); runTick = Date.now();
    hist = { undo: [], redo: [] };
    sortKey = null; sortDir = 1; filters = {};
    scope = scopePreset("today");
    searchQ = ""; searchOpen = false; $("tkSearch").value = "";
    tmpSeq = 113;
    closeCombos();
    ["tkFilterMenu", "tkColsMenu", "tkScopeMenu", "tkEntryWash"].forEach((id) => { $(id).hidden = true; });
    entryOpenId = null;
    $("tkToast").classList.remove("on");
    const scene = b.dataset.scene;
    if (scene === "idle") { rows = []; setModal(false); }
    else if (scene === "running") { setModal(false); }
    else { setModal(true); }
    render();
  });
});

/* initial: the sheet open */
setModal(true);
</script>

</body></html>
