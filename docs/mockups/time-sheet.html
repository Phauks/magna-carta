  --mc-status-warning-subtle-border: var(--mc-color-amber-300);

/* Chancery light, committed single-theme for this mockup; the built screen inherits theme x mode. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--mc-surface-sunken); color: var(--mc-text-default); }
body { font-family: "Atkinson Hyperlegible", var(--mc-font-sans); font-size: var(--mc-font-size-sm); line-height: var(--mc-leading-normal); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: var(--mc-focus-ring-width) solid var(--mc-focus-ring); outline-offset: var(--mc-focus-ring-offset); }
.caps { text-transform: uppercase; letter-spacing: var(--mc-tracking-caps); font-size: var(--mc-font-size-xs); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mc-font-mono); font-size: var(--mc-font-size-xs); }
.muted { color: var(--mc-text-muted); }
svg { flex: none; }
[hidden] { display: none !important; }
.scrollable { scrollbar-color: var(--mc-color-neutral-300) var(--mc-surface-raised); scrollbar-width: thin; }
.scrollable::-webkit-scrollbar { width: 10px; height: 10px; }
.scrollable::-webkit-scrollbar-track { background: var(--mc-surface-raised); }
.scrollable::-webkit-scrollbar-thumb { background: var(--mc-color-neutral-300); border-radius: var(--mc-radius-full); border: 2px solid var(--mc-surface-raised); }

/* ============ App shell ============ */
.shell { flex: 1; display: grid; grid-template-columns: var(--mc-size-sidebar) 1fr; grid-template-rows: var(--mc-size-top-bar) 1fr; min-height: 0; background: var(--mc-chrome-surface); }
.brandcorner { grid-column: 1; grid-row: 1; background: var(--mc-chrome-surface); display: flex; align-items: center; gap: var(--mc-space-12); padding: 0 var(--mc-space-16); }
.brandcorner .m { font-family: var(--mc-font-blackletter); color: var(--mc-chrome-accent); font-size: var(--mc-font-size-2xl); }
.brandcorner .wordmark { color: var(--mc-chrome-text-strong); letter-spacing: var(--mc-tracking-wordmark); font-size: var(--mc-font-size-xs); text-transform: uppercase; }
.topbar { grid-column: 2; grid-row: 1; background: var(--mc-chrome-surface); display: flex; align-items: center; gap: var(--mc-space-12); padding: 0 var(--mc-space-16); }
.topbar .gsearch { flex: none; width: 320px; display: flex; align-items: center; gap: var(--mc-space-8); color: var(--mc-chrome-text-muted); border: 1px solid var(--mc-chrome-border); border-radius: var(--mc-radius-md); padding: 0 var(--mc-space-12); height: var(--mc-control-sm); }
.topbar .gsearch .kbd { margin-left: auto; font-family: var(--mc-font-mono); font-size: var(--mc-font-size-xs); }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: var(--mc-space-12); }
.topbar .bell { color: var(--mc-chrome-text-muted); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--mc-radius-md); }
.topbar .bell:hover { background: var(--mc-chrome-surface-hover); color: var(--mc-chrome-text-strong); }
.avatar { width: 30px; height: 30px; border-radius: var(--mc-radius-full); background: var(--mc-color-neutral-0); color: var(--mc-color-neutral-900); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--mc-font-size-xs); }
.sidebar { grid-column: 1; grid-row: 2; background: var(--mc-chrome-surface); display: flex; flex-direction: column; overflow-y: auto; padding: var(--mc-space-12) var(--mc-space-8) var(--mc-space-8); }
.sidebar .grouplabel { color: var(--mc-chrome-text-muted); padding: var(--mc-space-12) var(--mc-space-12) var(--mc-space-4); }
.sidebar .dest { display: flex; align-items: center; gap: var(--mc-space-8); color: var(--mc-chrome-text); padding: var(--mc-space-4) var(--mc-space-12); border-radius: var(--mc-radius-md); font-size: var(--mc-font-size-sm); width: 100%; }
.sidebar .dest:hover { background: var(--mc-chrome-surface-hover); color: var(--mc-chrome-text-strong); }
.sidebar .dest[aria-current="true"] { color: var(--mc-chrome-text-strong); background: var(--mc-chrome-surface-hover); font-weight: 700; }
.sidebar .dest[aria-current="true"] svg { color: var(--mc-chrome-accent); opacity: 1; }
.sidebar .dest svg { width: 15px; height: 15px; opacity: 0.85; }
.mbadge { margin-left: var(--mc-space-4); font-size: var(--mc-font-size-xs); border-radius: var(--mc-radius-full); padding: 0 var(--mc-space-8); font-weight: 700; }
.mbadge.alpha { background: var(--mc-color-blue-100); color: var(--mc-color-blue-700); }
.mbadge.soon { background: var(--mc-color-neutral-100); color: var(--mc-color-neutral-700); }

/* ============ The Time Sheet chip ============ */
.timerchip { position: relative; display: flex; align-items: center; gap: var(--mc-space-8); color: var(--mc-chrome-text); border: 1px solid var(--mc-chrome-border); border-radius: var(--mc-radius-md); padding: var(--mc-space-4) var(--mc-space-8); font-size: var(--mc-font-size-xs); }
.timerchip:hover { background: var(--mc-chrome-surface-hover); color: var(--mc-chrome-text-strong); }
.timerchip svg { width: 13px; height: 13px; }
.timerchip.running { color: var(--mc-chrome-text-strong); border-color: var(--mc-chrome-accent); }
.timerchip.running svg { color: var(--mc-chrome-accent); }
.timerchip .livedot { width: 6px; height: 6px; border-radius: var(--mc-radius-full); background: var(--mc-chrome-accent); animation: tkpulse 2s ease-in-out infinite; }
@keyframes tkpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .timerchip .livedot { animation: none; } }
.timerchip .chipmatter { color: inherit; opacity: 0.85; }
.timerchip .pending { display: inline-flex; align-items: center; gap: 3px; background: var(--mc-status-warning-subtle); color: var(--mc-status-warning-subtle-foreground); border-radius: var(--mc-radius-full); padding: 0 var(--mc-space-4); font-weight: 700; font-size: 10px; line-height: 14px; }

/* ============ Canvas placeholder ============ */
.canvas { grid-column: 2; grid-row: 2; min-width: 0; display: flex; flex-direction: column; background: var(--mc-surface-default); overflow: hidden; border-top-left-radius: var(--mc-radius-lg); }
.mockbar { position: relative; z-index: 1395; pointer-events: none; flex: none; display: flex; flex-wrap: wrap; gap: var(--mc-space-8); align-items: center; padding: var(--mc-space-4) var(--mc-space-24); background: var(--mc-surface-sunken); border-bottom: 1px dashed var(--mc-border-strong); }
.mockbar button { pointer-events: auto; }
.mockbar span { color: var(--mc-text-subtle); font-size: var(--mc-font-size-xs); }
.mockbar button { font-size: var(--mc-font-size-xs); border: 1px solid var(--mc-border-default); border-radius: var(--mc-radius-full); padding: 1px var(--mc-space-8); color: var(--mc-text-muted); background: var(--mc-surface-default); }
.mockbar button[aria-pressed="true"] { border-color: var(--mc-border-strong); color: var(--mc-text-default); font-weight: 700; }
.canvasnote { flex: 1; display: flex; align-items: center; justify-content: center; }
.canvasnote .inner { text-align: center; color: var(--mc-text-subtle); max-width: var(--mc-size-prose); padding: var(--mc-space-24); }
.canvasnote .bigm { font-family: var(--mc-font-blackletter); font-size: 72px; color: var(--mc-accent-subtle); line-height: 1; }
.canvasnote h2 { font-family: var(--mc-font-display); font-weight: var(--mc-weight-display); font-size: var(--mc-font-size-lg); color: var(--mc-text-muted); margin-top: var(--mc-space-12); }
.canvasnote p { margin-top: var(--mc-space-8); }

/* ============ Shared control vocabulary ============ */
.btn { display: inline-flex; align-items: center; gap: var(--mc-space-4); height: var(--mc-control-xs); padding: 0 var(--mc-space-8); border-radius: var(--mc-radius-md); font-weight: 700; font-size: var(--mc-font-size-xs); white-space: nowrap; }
.btn.primary { background: var(--mc-action-primary); color: var(--mc-action-primary-foreground); }
.btn.primary:hover { background: var(--mc-action-primary-hover); }
.btn.secondary { background: var(--mc-action-secondary); color: var(--mc-action-secondary-foreground); border: 1px solid var(--mc-border-default); }
.btn.secondary:hover { background: var(--mc-action-secondary-hover); }
.btn:disabled { background: var(--mc-action-disabled); color: var(--mc-action-disabled-foreground); cursor: not-allowed; border: none; }
.btn svg { width: 13px; height: 13px; }
.iconbtn { width: 26px; height: 26px; border-radius: var(--mc-radius-md); color: var(--mc-text-muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn:hover:not(:disabled) { background: var(--mc-surface-selected); color: var(--mc-text-default); }
.iconbtn:disabled { color: var(--mc-action-disabled-foreground); cursor: default; }
.iconbtn svg { width: 14px; height: 14px; }
.iconbtn.filterclear.on { color: var(--mc-accent-default); outline: 1px solid var(--mc-accent-strong); outline-offset: -1px; }
/* Undo/redo are split controls: the button steps, the caret opens the stack. */
.histsplit { display: inline-flex; align-items: center; }
.histsplit .iconbtn { border-radius: var(--mc-radius-md) 0 0 var(--mc-radius-md); }
.histsplit .caret { width: 16px; border-radius: 0 var(--mc-radius-md) var(--mc-radius-md) 0; }
.histsplit .caret svg { width: 11px; height: 11px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--mc-radius-full); padding: 0 var(--mc-space-8); font-size: var(--mc-font-size-xs); border: 1px solid; white-space: nowrap; }
.chip.quiet { background: var(--mc-surface-raised); color: var(--mc-text-muted); border-color: var(--mc-border-default); }
.chip.accent { background: var(--mc-accent-subtle); color: var(--mc-accent-subtle-foreground); border-color: var(--mc-accent-strong); }
.chip .cdot { width: 6px; height: 6px; border-radius: var(--mc-radius-full); background: currentColor; }
.chip.accent .cdot { animation: tkpulse 2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .chip.accent .cdot { animation: none; } }

/* ============ The Time Sheet modal ============ */
.tkwash { position: fixed; inset: 0; background: var(--mc-surface-scrim); z-index: var(--mc-z-modal); display: flex; align-items: flex-start; justify-content: center; padding: 90px var(--mc-space-16) var(--mc-space-16); }
.tkmodal { width: min(1560px, 97vw); height: calc(100vh - 106px); max-height: calc(100vh - 106px); display: flex; flex-direction: column; background: var(--mc-surface-default); border: 1px solid var(--mc-border-default); border-radius: var(--mc-radius-lg); box-shadow: var(--mc-elevation-3); }
/* Full-screen takeover (round five, item 12): "so it isn't so much a modal as it is the full
   screen." The table gets all the height; Escape still closes; the toggle restores. */
.tkwash.full { padding: 0; }
.tkwash.full .tkmodal { width: 100vw; height: 100vh; max-height: 100vh; border: none; border-radius: 0; box-shadow: none; }
body.tkfullscreen .mockbar { z-index: 100; }
.tkmodal > header { flex: none; display: flex; align-items: center; gap: var(--mc-space-8); padding: var(--mc-space-12) var(--mc-space-12) var(--mc-space-8) var(--mc-space-24); flex-wrap: wrap; }
.tkmodal > header h2 { font-family: var(--mc-font-display); font-weight: var(--mc-weight-display); font-size: var(--mc-font-size-xl); }
/* The date-scope control: which entries the sheet shows. Default today; ranges compose with
   filters and the totals caption. */
.tkscope { display: inline-flex; align-items: center; gap: var(--mc-space-4); border: 1px solid var(--mc-border-default); border-radius: var(--mc-radius-md); padding: 0 var(--mc-space-8); height: var(--mc-control-xs); color: var(--mc-text-muted); }
.tkscope:hover { background: var(--mc-surface-raised); color: var(--mc-text-default); }
.tkscope svg { width: 13px; height: 13px; }
.tkscope .lbl { font-weight: var(--mc-weight-semibold); }
.tkmodal > header .spacer { flex: 1; }
/* Search expands from its button (the file manager's S2 pattern); collapsed it is just "Search". */
.tksearch { display: flex; align-items: center; gap: var(--mc-space-4); border: 1px solid var(--mc-border-default); border-radius: var(--mc-radius-md); padding: 0 var(--mc-space-8); height: var(--mc-control-xs); color: var(--mc-text-subtle); }
.tksearch input { border: none; background: transparent; font: inherit; color: var(--mc-text-default); width: 170px; outline: none; }
.tksearch input::placeholder { color: var(--mc-text-subtle); }
.tksearch.on { border-color: var(--mc-accent-strong); color: var(--mc-accent-default); }
.tksearch svg { width: 13px; height: 13px; }
.tksearch .clr { width: 18px; height: 18px; border-radius: var(--mc-radius-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--mc-text-subtle); }
.tksearch .clr:hover { color: var(--mc-text-default); background: var(--mc-surface-selected); }
.tktablewrap { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; border-top: 1px solid var(--mc-border-default); }
table { width: 100%; min-width: 1310px; border-collapse: collapse; font-size: var(--mc-font-size-sm); }
thead th { position: relative; position: sticky; top: 0; background: var(--mc-surface-raised); z-index: 2; text-align: left; padding: 0; border-bottom: 1px solid var(--mc-border-default); white-space: nowrap; }
thead th .hcell { display: flex; align-items: center; min-height: 28px; }
thead th.right .hcell { justify-content: flex-end; }
thead th .sortbtn { flex: 0 1 auto; display: flex; align-items: center; gap: var(--mc-space-4); color: var(--mc-text-subtle); font-weight: 400; text-transform: uppercase; letter-spacing: var(--mc-tracking-caps); font-size: var(--mc-font-size-xs); padding: var(--mc-space-4) var(--mc-space-8); }
thead th .hcell:hover { background: var(--mc-surface-selected); }
thead th .hcell:hover .sortbtn { color: var(--mc-text-default); }
thead th.right .sortbtn { justify-content: flex-end; }
thead th .arrow { width: 10px; display: inline-flex; }
thead th .filterbtn { width: 20px; height: 20px; margin-left: auto; margin-right: var(--mc-space-4); border-radius: var(--mc-radius-sm); color: var(--mc-text-subtle); display: inline-flex; visibility: hidden; align-items: center; justify-content: center; flex: none; }
thead th.right .filterbtn { margin-left: 0; }
thead th:hover .filterbtn, thead th:focus-within .filterbtn, thead th .filterbtn.active { visibility: visible; }
thead th .filterbtn.active { background: var(--mc-accent-subtle); color: var(--mc-accent-subtle-foreground); }
thead th .hcell:hover .filterbtn:not(.active) { color: var(--mc-text-default); }
thead th .filterbtn svg { width: 11px; height: 11px; }
thead th[draggable] { cursor: grab; }
thead th.dragging { opacity: 0.4; }
thead th.drop-before { box-shadow: inset 2px 0 0 0 var(--mc-border-focus); }
thead th.drop-after { box-shadow: inset -2px 0 0 0 var(--mc-border-focus); }
thead th .thgrip { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 6; }
thead th .thgrip::after { content: ""; position: absolute; left: 3px; top: 0; height: 100%; width: 1px; background: transparent; }
thead th .thgrip:hover::after, thead th .thgrip.dragging::after { background: var(--mc-border-focus); width: 2px; }
body.resizing { cursor: col-resize; user-select: none; }
table.fixedcols { table-layout: fixed; }
table.fixedcols td { overflow: hidden; }
tbody td { padding: 1px var(--mc-space-8); vertical-align: middle; }
tbody.rowg tr.l1 td { height: 29px; border-bottom: none; padding-bottom: 0; }
tbody.rowg tr.l2 td { height: auto; min-height: 27px; border-bottom: 1px solid var(--mc-border-default); padding-top: 0; padding-bottom: 2px; }
tbody.rowg:hover td { background: var(--mc-surface-raised); }
tbody.rowg.tklive td { background: var(--mc-surface-raised); }
tbody.rowg.tklocked td { color: var(--mc-text-muted); }
/* The sheet ends in an add-a-row button — no blank row stands at rest. */
.tkaddwrap td { padding: 0; }
.tkaddrow { display: flex; align-items: center; gap: var(--mc-space-4); width: 100%; color: var(--mc-text-subtle); padding: var(--mc-space-8) var(--mc-space-12); font-size: var(--mc-font-size-xs); font-weight: var(--mc-weight-semibold); }
.tkaddrow:hover { background: var(--mc-surface-raised); color: var(--mc-text-default); }
.tkaddrow svg { width: 14px; height: 14px; }
/* The status stripe: state at a glance on the row's left edge, both lines, semantic tokens.
   Complete+saved = success · incomplete = warning · running = accent · chain-locked = info. */
tbody.rowg tr td:first-child { box-shadow: inset 3px 0 0 var(--mc-border-default); }
tbody.rowg.st-ok tr td:first-child { box-shadow: inset 3px 0 0 var(--mc-color-green-300); }
tbody.rowg.st-warn tr td:first-child { box-shadow: inset 3px 0 0 var(--mc-status-warning); }
tbody.rowg.st-live tr td:first-child { box-shadow: inset 3px 0 0 var(--mc-accent-strong); }
tbody.rowg.st-lock tr td:first-child { box-shadow: inset 3px 0 0 var(--mc-status-info-subtle-border); }
td.right, th.right { text-align: right; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
/* An editable cell's input FILLS ITS CELL: the column's (resizable) width is the input's width,
   so a long matter or description is never clipped by a field narrower than the space it has.
   min-width:0 lets it shrink inside flex cells too. */
.cellin { font: inherit; width: 100%; min-width: 0; border: 1px solid transparent; border-radius: var(--mc-radius-sm); background: transparent; color: inherit; padding: 2px var(--mc-space-4); height: 26px; }
.tkwho .cellin { flex: 1 1 auto; width: auto; }
.cellin:hover:not(:disabled) { border-color: var(--mc-border-default); }
.cellin:focus { border-color: var(--mc-border-focus); background: var(--mc-surface-field); outline: none; }
.cellin:disabled { color: var(--mc-text-subtle); cursor: default; }
.cellin::placeholder { color: var(--mc-text-subtle); font-style: italic; }
.cellin.num { font-variant-numeric: tabular-nums; }
.cellin.right { text-align: right; }
.cellin.ticking { color: var(--mc-accent-default); font-weight: 700; }
td .lockedcell { display: block; padding: 2px var(--mc-space-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }

  const parts = t.split(":");
  if (parts.length === 3) return (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2] || 0);
  if (parts.length === 2) return (+parts[0]) * 3600 + (+parts[1]) * 60;
  const dec = parseFloat(t.replace(",", "."));
  return Number.isFinite(dec) ? Math.round(dec * 3600) : null;

/* ---------- history ---------- */
let hist = { undo: [], redo: [] };
function snapRows() { return rows.map((r) => ({ ...r })); }
function pushHistory(label) {

  hist.redo = [];

}
function restore(entry) {
  rows = entry.rows.map((r) => ({ ...r }));
  runTick = Date.now();
}
function undoOne() {
  const top = hist.undo.pop();
  if (!top) return null;
  hist.redo.push({ label: top.label, rows: snapRows() });
  restore(top);
  return top.label;
}
function redoOne() {
  const top = hist.redo.pop();
  if (!top) return null;
  hist.undo.push({ label: top.label, rows: snapRows() });
  restore(top);
  return top.label;
}
/* One step from the button, or several from the dropdown — the same walk either way. */

  let label = null, done = 0;

  if (done === 0) return;

  render();
}

  let label = null, done = 0;
  for (let i = 0; i < (steps ?? 1); i += 1) { const l = redoOne(); if (l === null) break; label = l; done += 1; }
  if (done === 0) return;
  toast(done === 1 ? "Redid " + label : "Redid " + done + " steps, up through " + label);
  render();
}

  const u = $("tkUndoBtn"), r = $("tkRedoBtn"), um = $("tkUndoMore"), rm = $("tkRedoMore");
  u.disabled = hist.undo.length === 0;
  u.title = hist.undo.length === 0 ? "Nothing to undo" : "Undo one step (Ctrl+Z)";
  r.disabled = hist.redo.length === 0;
  r.title = hist.redo.length === 0 ? "Nothing to redo" : "Redo one step (Ctrl+Y)";
  um.disabled = hist.undo.length === 0;
  um.title = hist.undo.length === 0 ? "Nothing to undo yet" : "Show the last " + hist.undo.length + " change" + (hist.undo.length > 1 ? "s" : "") + " and jump back through them";
  rm.disabled = hist.redo.length === 0;
  rm.title = hist.redo.length === 0 ? "Nothing to redo yet" : "Show the " + hist.redo.length + " undone change" + (hist.redo.length > 1 ? "s" : "") + " and jump forward through them";

/* ---------- auto-save: EVERYTHING persists; completeness is a separate honest fact ---------- */
const saveTimers = {};
function autoSave(r) {
  r.db = "saving";

  clearTimeout(saveTimers[r.id]);
  saveTimers[r.id] = setTimeout(() => {

  }, 600);

  if (isIncomplete(r)) return '<span class="dbstate incomplete" title="Saved — incomplete: needs ' + esc(missingFacts(r).join(", ")) + '. It stays here until completed.">' + I.alert + "</span>";

/* ---------- the chip ---------- */
function renderChip() {
  const chip = $("tkChip");
  const live = runningRow();
  const held = rows.filter((r) => r.timer === "paused");
  const pend = incompleteCount();
  const pendBadge = pend > 0 ? '<span class="pending" title="' + pend + " saved row" + (pend > 1 ? "s" : "") + ' still incomplete — missing a matter, description, or duration">&middot;' + pend + "</span>" : "";
  chip.classList.toggle("running", live !== null);
  if (live) {
    chip.innerHTML = '<span class="livedot" aria-hidden="true"></span>' + I.timer + '<span class="num">' + fmtDur(liveSec(live), true) + '</span><span class="chipmatter num">' + esc(live.matter ? live.matter.num : "no matter") + "</span>" + pendBadge;
    chip.title = "Timing " + (live.matter ? live.matter.num + " — " + live.matter.title : "with no matter yet") + ". Click to open the Time Sheet.";
  } else if (held.length > 0) {
    chip.innerHTML = I.pause + '<span class="num">' + fmtDur(held[0].sec, true) + "</span>" + pendBadge;
    chip.title = "No timer is running. Click to open the Time Sheet.";
  } else {
    chip.innerHTML = I.timer + '<span class="num">0:00</span>' + pendBadge;
    chip.title = "Click to open the Time Sheet.";

}

function wireColumnReorder() {

      e.preventDefault();

  let to = columns.findIndex((c) => c.key === toKey) + (after ? 1 : 0);
  const first = columns.findIndex((c) => !c.always);
  const last = columns.findIndex((c) => c.key === "acts");

    const text = col.key === "total" ? money(rowTotal(r)) : col.key === "matter" ? matterDisplay(r) : String(col.get ? col.get(r) : "");

/* ---------- rows ---------- */
/* There is no standing blank row (round six, item 8). A row is created deliberately — by the
   add-a-row button at the end of the sheet, or by New entry at the top — and it is a REAL entry
   from that instant: provisional code minted, persisted, incomplete until it is filled in. */
function defaultNewDate() { return TODAY >= scope.from && TODAY <= scope.to ? TODAY : scope.to; }
function createRow(date) {
  seq += 1;
  const r = { id: "t" + seq, code: mintTmp(), date: date ?? defaultNewDate(), entered: TODAY, matter: null, note: "", memo: "", sec: 0, card: "standard", rate: null, who: ME, via: ME, db: "saving", timer: null, wasTmp: null, files: [], events: [], cat: ENTRY_CATEGORIES[0], act: "" };
  pushHistory("new entry");
  rows.push(r);
  recordEvent(r, "Entry created", "Saved with no matter — it keeps its provisional code until one is set");
  autoSave(r);
  return r;
}
/* The scope decides what shows — plus incomplete rows from ANY earlier date, which surface until
   completed (they are the data-loss risk the save-with-nothing rule exists for). */
function scopeRows() {
  return rows.filter((r) => (r.date >= scope.from && r.date <= scope.to) || (isIncomplete(r) && r.date < scope.from));
}
function searchMatch(r) {
  if (searchQ === "") return true;
  const q = searchQ.toLowerCase();
  /* The internal memo is searchable: this surface is the firm's own, and a memo you cannot find
     is a memo you will write twice. It stays out of every client-facing rendering all the same. */
  return r.note.toLowerCase().includes(q) || r.memo.toLowerCase().includes(q) ||
    (r.matter !== null && (r.matter.num.toLowerCase().includes(q) || r.matter.title.toLowerCase().includes(q))) ||
    r.code.toLowerCase().includes(q) ||
    r.who.toLowerCase().includes(q) || r.via.toLowerCase().includes(q);
}
function filteredRows(list) {
  return list.filter((r) => {
    if (!searchMatch(r)) return false;
    for (const [key, values] of Object.entries(filters)) {
      const c = colByKey(key);
      if (!values.has(String(c.get(r)))) return false;
    }
    return true;
  });
}
function sortedRows(list) {
  if (sortKey === null) return list;
  const c = colByKey(sortKey);
  return list.slice().sort((a, b) => {
    const va = c.get(a), vb = c.get(b);
    const cmp = typeof va === "number" && typeof vb === "number" ? va - vb : String(va).localeCompare(String(vb));
    return (cmp === 0 ? a.id.localeCompare(b.id) : cmp) * sortDir;
  });
}
/* Every editable cell's input FILLS ITS CELL (round six, item 2): no input carries a width of its
   own, so the resizable column's width IS the input's width and a long value is never clipped.
   The table is laid out fixed with per-column widths, and .cellin is width:100%. */
function cellHtml(c, r) {
  switch (c.key) {
    case "db": return '<td class="nowrap" style="width:36px; text-align:center" data-db="' + r.id + '">' + dbCellHtml(r) + "</td>";
    case "code": {
      const prov = isProvisional(r.code);
      const title = prov
        ? "Provisional code — minted at creation, immutable. The permanent matter-scoped code mints when the matter is set."
        : "Time code — minted at creation, immutable" + (r.wasTmp ? " (was " + r.wasTmp + ")" : "");
      return '<td class="nowrap"><span class="codecell' + (prov ? " provisional" : "") + '" title="' + esc(title) + '">' + esc(r.code) + "</span></td>";
    }
    case "date": return '<td class="nowrap"><input type="date" class="cellin num" data-cell="date" data-id="' + r.id + '" value="' + r.date + '" title="The day the work is FOR (the entry\'s work date)"></td>';
    case "entered": return '<td class="nowrap"><span class="lockedcell num muted" title="The day the entry was recorded — automatic, never edited">' + usDate(r.entered) + "</span></td>";
    case "matter": {
      return '<td class="nowrap"><input class="cellin" data-cell="matter" data-id="' + r.id + '" value="' + esc(matterDisplay(r)) + '" placeholder="Matter" title="Matter — type the number or the name; either finds it" autocomplete="off" spellcheck="false"></td>';
    }
    case "dur": {
      const running = r.timer === "running";
      const shown = r.sec > 0 || running ? fmtDur(liveSec(r), running) : "";
      return '<td class="right"><input class="cellin num right' + (running ? " ticking" : "") + '" data-cell="dur" data-id="' + r.id + '" value="' + shown + '" data-orig="' + shown + '" placeholder="Duration" title="' + (running ? "Ticking — editing pauses the timer" : "Type 1:30 or 1.5 — either form works; minutes as 45m") + '"></td>';
    }
    /* Hours is TYPABLE (round six, item 3) and reconciles with Duration BOTH WAYS: a duration
       drives the billed hours, and typed hours drive the duration back to their exact equivalent.
       Both forms parse — 1.5 and 1:30 are the same ninety minutes. */
    case "hours": {
      const running = r.timer === "running";
      const shown = liveSec(r) > 0 ? hoursLabel(billedHours(liveSec(r))) : "";
      return '<td class="right"><input class="cellin num right' + (running ? " ticking" : "") + '" data-cell="hours" data-id="' + r.id + '" data-hours="' + r.id + '" value="' + shown + '" data-orig="' + shown + '" placeholder="Hours" title="' +
        (running ? "Ticking — editing pauses the timer" : "Billed hours — the duration rounded to the firm&#39;s 6-minute increment. Type 1.5 or 1:30; either form works, and the duration reconciles to match") + '"></td>';
    }
    case "rate": return '<td class="right"><input class="cellin num right" data-cell="rate" data-id="' + r.id + '" value="' + rateLabel(r) + '" data-orig="' + rateLabel(r) + '" placeholder="Rate" title="' + esc(rateTitle(r)) + '" autocomplete="off"></td>';
    case "total": {
      const t = rowTotal(r);
      const arith = r.rate === null ? "Needs a matter to resolve a rate" : fmtDur(liveSec(r)) + " → " + hoursLabel(billedHours(liveSec(r))) + " h × $" + r.rate.toFixed(2) + " = " + money(t);
      return '<td class="right totalcell" data-total="' + r.id + '" title="' + esc(arith) + '">' + (liveSec(r) > 0 && r.rate !== null ? money(t) : "") + "</td>";
    }
    case "files": {
      const chips = (r.files ?? []).map((f) =>
        '<button class="filechip" data-act="openfile" data-id="' + r.id + '" data-file="' + esc(f.name) + '" title="' + esc(f.name) + ' — opens the document">' + I.file + "<span>" + esc(f.name) + "</span></button>").join("");
      return '<td class="nowrap"><span class="filecell">' + (chips || '<button class="lnk muted" data-act="attach" data-id="' + r.id + '" title="Attach a file on this entry&#39;s Attachments tab">&mdash;</button>') + "</span></td>";
    }
    /* The ENTERER is a fact of every entry, not only of a delegated one — so this column carries a
       name on every row. Delegation is the case where it differs from the timekeeper, and that is
       what the tooltip distinguishes and what auto-shows the column. */
    case "via": {
      const delegated = isDelegated(r);
      const title = delegated
        ? "Entered by " + r.via + " for " + r.who + " — delegated entry; both people stay on the entry"
        : "Entered by " + r.via + ", who is also the timekeeper — recorded automatically";
      return '<td class="nowrap"><span class="tkwho' + (delegated ? " delegated" : "") + '" title="' + esc(title) + '"><span class="av">' + initialsOf(r.via) + '</span><span class="lockedcell" style="padding:2px 0">' + esc(r.via) + "</span></span></td>";
    }
    case "who": {
      return '<td class="nowrap"><span class="tkwho" title="' + esc(r.who + (isDelegated(r) ? " — entered by " + r.via : "")) + '"><span class="av">' + initialsOf(r.who) + '</span><input class="cellin" data-cell="who" data-id="' + r.id + '" value="' + esc(r.who) + '" placeholder="Timekeeper" autocomplete="off" spellcheck="false" title="The timekeeper — whose work this is. Changing it re-resolves the rate; the enterer is recorded automatically"></span></td>';
    }
    /* Row actions render AT REST on every row (round six, item 4 — the file manager's I4): never
       hover-revealed, so the row never reflows under the pointer. */
    case "acts": {
      const running = r.timer === "running";
      const timerBtn = running
        ? '<button class="iconbtn" data-act="pause" data-id="' + r.id + '" title="Pause the timer" aria-label="Pause">' + I.pause + "</button>"
        : '<button class="iconbtn" data-act="start" data-id="' + r.id + '" title="Start the timer on this row' + (runningRow() ? " — pauses " + (runningRow().matter ? runningRow().matter.num : "the running row") : "") + '" aria-label="Start timer">' + I.play + "</button>";
      const openBtn = '<button class="iconbtn" data-act="open" data-id="' + r.id + '" title="Open the full entry (also: double-click the row)" aria-label="Open the full entry">' + I.open + "</button>";
      const del = '<button class="iconbtn" data-act="delete" data-id="' + r.id + '" title="Delete this row (undo available)" aria-label="Delete">' + I.trash + "</button>";
      return '<td class="right actscol"><span class="rowacts">' + timerBtn + openBtn + del + "</span></td>";
    }
  }
}
function rowGroupHtml(r) {
  const cols = visibleColumns();
  const cls = ["rowg", stripeClass(r), r.timer === "running" ? "tklive" : ""].filter(Boolean).join(" ");
  const line1 = '<tr class="l1">' + cols.map((c) => cellHtml(c, r)).join("") + "</tr>";
  /* The description WRAPS (round five, item 11): a self-sizing textarea, never horizontal
     overflow — the row grows to fit and the status stripe spans the full wrapped height.
     Native browser spellcheck is ON (item 14) — real squiggles, zero backend. */
  const noteField = '<textarea class="cellin noteta" data-cell="note" data-id="' + r.id + '" rows="1" placeholder="Description" title="The description — the entry\'s billed text" spellcheck="true">' + esc(r.note) + "</textarea>";
  /* The INTERNAL MEMO is the description's twin, on demand (round seven, item 1): a long line, so
     it gets the same full-width wrapping treatment on a third line — but most rows never have one,
     so it is not a column. The button at the far right of the description line adds or reveals it;
     a row that HAS a memo always shows it, a row without shows only the button. */
  const hasMemo = r.memo.trim() !== "";
  const memoShown = hasMemo || memoOpen.has(r.id);
  const memoBtn = '<button class="memobtn' + (hasMemo ? " on" : "") + '" data-act="memo" data-id="' + r.id + '" aria-pressed="' + memoShown + '" title="' +
    (hasMemo ? "This entry has an internal memo — the firm's own note, never on a bill. Click to go to it"
      : "Add an internal memo — the firm's own note on this entry, never on a bill or a printed sheet") + '">' + I.memo + "</button>";
  const line2 = '<tr class="l2"><td style="width:36px"></td><td colspan="' + (cols.length - 1) + '"><span class="l2wrap">' + noteField + memoBtn + "</span></td></tr>";
  /* data-internal-only marks every node that may render memo text — the machine-checkable form of
     "nothing client-facing renders this". */
  const line3 = memoShown
    ? '<tr class="l3"><td style="width:36px"></td><td colspan="' + (cols.length - 1) + '" data-internal-only="true"><span class="l2wrap memowrap">' +
      '<span class="memotag" title="Internal only — it never appears on a bill, an invoice, or a printed sheet">Internal</span>' +
      '<textarea class="cellin noteta memota" data-cell="memo" data-id="' + r.id + '" rows="1" placeholder="Internal Memo" title="The internal memo — for the firm only. It never appears on a bill or a printed sheet" spellcheck="true">' + esc(r.memo) + "</textarea></span></td></tr>"
    : "";
  return '<tbody class="' + cls + '" data-row="' + r.id + '">' + line1 + line2 + line3 + "</tbody>";
}
function renderRows() {
  const cols = visibleColumns().length;
  const list = sortedRows(filteredRows(scopeRows()));
  let html = "";
  const anyNarrow = Object.keys(filters).length > 0 || searchQ !== "";
  if (list.length === 0 && scopeRows().length > 0 && anyNarrow) {
    html += '<tbody><tr><td colspan="' + cols + '"><div class="emptyfiltered">No rows match ' + (searchQ !== "" ? "the search" + (Object.keys(filters).length ? " and filters" : "") : "the filters in play") + "." +
      '<button class="btn secondary" data-act="clearnarrow">' + I.funnelx + "Clear them</button></div></td></tr></tbody>";
  } else {
    html += list.map(rowGroupHtml).join("");
  }
  /* The sheet ENDS IN A BUTTON, not a standing blank row (round six, item 8): nothing empty sits
     at rest, and one click creates the row and puts the cursor in it. */
  html += '<tbody class="tkaddwrap"><tr><td colspan="' + cols + '">' +
    '<button class="tkaddrow" data-act="addrow" title="Create a row on ' + esc(usDate(defaultNewDate())) + ' and start typing in it">' +
    I.plus + "Add a row</button></td></tr></tbody>";
  const table = $("tkTable");
  [...table.querySelectorAll("tbody")].forEach((tb) => tb.remove());
  table.insertAdjacentHTML("beforeend", html);
}
function renderBarStates() {
  const filterCount = Object.keys(filters).length;
  const fc = $("tkClearFilters");
  fc.disabled = filterCount === 0;
  fc.classList.toggle("on", filterCount > 0);
  fc.title = filterCount === 0 ? "No filters are applied" : "Clear " + filterCount + " filter" + (filterCount > 1 ? "s" : "");
  $("tkScopeLabel").textContent = scope.label;
  $("tkSearchBtn").hidden = searchOpen;
  $("tkSearchWrap").hidden = !searchOpen;
  $("tkSearchWrap").classList.toggle("on", searchQ !== "");
  renderHistoryControls();
}
function renderHonesty() {
  const inScope = rows.filter((r) => r.date >= scope.from && r.date <= scope.to);
  const workedSec = inScope.reduce((a, r) => a + liveSec(r), 0);
  const billed = inScope.reduce((a, r) => a + (liveSec(r) > 0 ? billedHours(liveSec(r)) : 0), 0);
  const value = inScope.reduce((a, r) => a + rowTotal(r), 0);
  const pend = incompleteCount();
  $("tkHonesty").innerHTML = "Worked <strong>" + fmtDur(workedSec) + "</strong>" +
    '<span class="sep">&middot;</span>billed <strong>' + hoursLabel(billed) + " h</strong>" +
    '<span class="sep">&middot;</span>value <strong>' + money(value) + "</strong>" +
    '<span class="sep">&middot;</span><span class="muted">' + esc(scope.label) +
      (scope.note ? " &mdash; " + esc(scope.note) : "") + "</span>" +
    (pend > 0 ? '<span class="sep">&middot;</span><span class="unlogged">' + pend + " row" + (pend > 1 ? "s" : "") + " incomplete</span>" : "");

/* Self-sizing descriptions: each textarea grows to its wrapped content. The field is border-box,
   so the border has to be added back or the last line loses its descenders. */
function autoSizeNote(ta) {
  ta.style.height = "24px";
  const border = ta.offsetHeight - ta.clientHeight;
  ta.style.height = Math.max(24, ta.scrollHeight + border) + "px";
}
function sizeNotes() { document.querySelectorAll(".noteta").forEach(autoSizeNote); }
function render() { renderChip(); if (modalOpen) { renderHead(); renderRows(); sizeNotes(); renderBarStates(); renderHonesty(); } }
function setModal(open) {
  modalOpen = open;
  $("tkWash").hidden = !open;
  render();
}
/* Full-screen state: remembered for the session. */
let maximized = false;
try { maximized = sessionStorage.getItem("tkMaximized") === "1"; } catch { /* storage may be unavailable */ }
function applyMaximize() {
  $("tkWash").classList.toggle("full", maximized);
  document.body.classList.toggle("tkfullscreen", maximized);
  $("tkMaxBtn").innerHTML = maximized ? I.minimize : I.maximize;
  $("tkMaxBtn").title = maximized ? "Restore the modal size" : "Full screen";
  try { sessionStorage.setItem("tkMaximized", maximized ? "1" : "0"); } catch { /* ignore */ }
}
$("tkMaxBtn").addEventListener("click", () => { maximized = !maximized; applyMaximize(); });
applyMaximize();

/* Duration and Hours are two views of ONE quantity (round six, item 3): whenever it moves, both
   cells re-read it — never the one the person is typing in — and the Total follows. */
function syncQuantityCells(r, exceptEl) {
  const running = r.timer === "running";
  const dur = document.querySelector('[data-cell="dur"][data-id="' + r.id + '"]');
  if (dur && dur !== exceptEl && document.activeElement !== dur) {
    dur.value = r.sec > 0 || running ? fmtDur(liveSec(r), running) : "";
    dur.dataset.orig = dur.value;
    dur.classList.toggle("ticking", running);
  }
  const hrs = document.querySelector('[data-cell="hours"][data-id="' + r.id + '"]');
  if (hrs && hrs !== exceptEl && document.activeElement !== hrs) {
    hrs.value = liveSec(r) > 0 ? hoursLabel(billedHours(liveSec(r))) : "";
    hrs.dataset.orig = hrs.value;
    hrs.classList.toggle("ticking", running);
  }
  const total = document.querySelector('[data-total="' + r.id + '"]');
  if (total) total.textContent = liveSec(r) > 0 && r.rate !== null ? money(rowTotal(r)) : "";
}

/* ---------- live tick ---------- */
setInterval(() => {
  const live = runningRow();
  if (!live) return;
  renderChip();
  if (!modalOpen) return;
  syncQuantityCells(live, null);
  renderHonesty();
}, 1000);

/* ---------- timers ---------- */
function settle(r) { r.sec = liveSec(r); }
function pauseTimerOn(r) { if (r.timer === "running") { settle(r); r.timer = "paused"; recordEvent(r, "Timer paused at " + fmtDur(r.sec)); } }
function startTimerOn(r) {
  const cur = runningRow();
  if (cur && cur.id !== r.id) pauseTimerOn(cur);
  r.timer = "running";
  runTick = Date.now();
  recordEvent(r, "Timer started");
  autoSave(r);
  toast("Timer running on " + (r.matter ? r.matter.num : "this row") + (cur && cur.id !== r.id ? " — paused " + (cur.matter ? cur.matter.num : "the other row") : ""));
  render();
}

/* ---------- comboboxes ---------- */
let comboFor = null;
function comboMenu(kind) { return $(kind === "matter" ? "tkMatterMenu" : kind === "who" ? "tkWhoMenu" : "tkRateMenu"); }
function closeCombos() { ["tkMatterMenu", "tkWhoMenu", "tkRateMenu"].forEach((m) => { $(m).hidden = true; }); comboFor = null; }
function placeMenu(menu, input) {
  menu.hidden = false;
  const rect = input.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(window.innerWidth - 360, rect.left - 20)) + "px";
  menu.style.top = Math.min(window.innerHeight - 220, rect.bottom + 2) + "px";
}
function matterMatches(q) {
  const t = q.trim().toLowerCase();
  if (t === "") return MATTERS;
  return MATTERS.filter((m) => m.num.toLowerCase().includes(t) || m.title.toLowerCase().includes(t));
}
function openMatterCombo(input) {
  comboFor = { kind: "matter", id: input.dataset.id };
  const r = rows.find((x) => x.id === input.dataset.id);
  const query = input.value === matterDisplay(r) ? "" : input.value;
  const menu = $("tkMatterMenu");
  const list = matterMatches(query);
  menu.innerHTML = list.length === 0
    ? '<div class="mhead">No matter matches &ldquo;' + esc(input.value) + "&rdquo;</div>"
    : list.map((m, i) => '<button data-pick="' + m.num + '"' + (i === 0 ? ' class="hot"' : "") + '><span class="mnum">' + esc(m.num) + '</span><span class="mtitle">' + esc(m.title) + "</span></button>").join("");
  placeMenu(menu, input);
}
function whoMatches(q) {
  const t = q.trim().toLowerCase();
  if (t === "") return PEOPLE;
  return PEOPLE.filter((p) => p.name.toLowerCase().includes(t));
}
function openWhoCombo(input) {
  comboFor = { kind: "who", id: input.dataset.id };
  const r = rows.find((x) => x.id === input.dataset.id);
  const menu = $("tkWhoMenu");
  const list = whoMatches(input.value === (r?.who ?? "") ? "" : input.value);
  menu.innerHTML = '<div class="mhead">Timekeeper &mdash; whose work this is</div>' +
    list.map((p, i) => '<button data-pick="' + esc(p.name) + '"' + (i === 0 ? ' class="hot"' : "") + '><span class="mnum">' + esc(p.name) + '</span><span class="mtitle num">$' + p.rate.toFixed(2) + "/h standard</span></button>").join("") +
    '<div class="mnote">The enterer is recorded automatically; both people stay on the entry.</div>';
  placeMenu(menu, input);
}
function openRateCombo(input) {
  const r = rows.find((x) => x.id === input.dataset.id);
  comboFor = { kind: "rate", id: input.dataset.id };
  const menu = $("tkRateMenu");
  menu.innerHTML = '<div class="mhead">Rate for this entry</div>' +
    RATE_CARDS.map((c) => '<button data-pick="' + c.id + '"' + (r.card === c.id ? ' class="hot"' : "") + '><span class="mnum num">$' + c.rateFor(r.who).toFixed(2) + '</span><span class="mtitle">' + esc(c.name) + " card &mdash; " + esc(c.note) + "</span></button>").join("") +
    '<button data-pick="custom"' + (r.card === "custom" ? ' class="hot"' : "") + '><span class="mnum">Custom&hellip;</span><span class="mtitle">type an hourly rate &mdash; overrides for this entry, audited</span></button>';
  placeMenu(menu, input);
}
["tkMatterMenu", "tkWhoMenu", "tkRateMenu"].forEach((menuId) => {
  $(menuId).addEventListener("pointerdown", (e) => {
    const b = e.target.closest("button[data-pick]");
    if (!b || comboFor === null) return;
    e.preventDefault();
    applyComboPick(comboFor, b.dataset.pick);
    closeCombos();
  });
});
function applyComboPick(target, pick) {
  const r = rows.find((x) => x.id === target.id);
  if (!r) return;
  if (target.kind === "matter") {
    const m = MATTERS.find((x) => x.num === pick);
    if ((r.matter ? r.matter.num : null) === pick) { render(); return; }
    pushHistory("edit of matter on " + r.code);
    r.matter = m;
    if (r.rate === null && m) { r.rate = RATE_CARDS[0].rateFor(r.who); r.card = "standard"; }
    /* The permanent, matter-scoped code mints the moment the matter is set — and never changes
       again, even if the matter is later edited. The provisional code is recorded. */
    recordEvent(r, m ? "Matter set to " + m.num : "Matter cleared");
    if (m && isProvisional(r.code)) {
      r.wasTmp = r.code;
      r.code = mintPermanent(m.num);
      recordEvent(r, "Permanent time code " + r.code + " minted", "was " + r.wasTmp);
      toast("Permanent time code " + r.code + " minted (was " + r.wasTmp + ")");
    }
    autoSave(r); render();
  } else if (target.kind === "who") {
    if (r.who === pick) { render(); return; }
    pushHistory("change of timekeeper to " + pick);
    r.who = pick;
    r.via = ME; /* the actor is the enterer, always — delegation is via !== who */
    recordEvent(r, "Timekeeper changed to " + pick, pick === ME ? undefined : "Delegated entry — " + ME + " recorded as the enterer");
    if (r.card !== "custom" && r.matter !== null) {
      r.rate = (RATE_CARDS.find((c) => c.id === r.card) ?? RATE_CARDS[0]).rateFor(pick);
      toast("Timekeeper " + pick + " — rate re-resolved to $" + r.rate.toFixed(2) + "/h");
    }
    autoSave(r); render();
  } else if (target.kind === "rate") {
    if (pick === "custom") {
      const input = document.querySelector('[data-cell="rate"][data-id="' + r.id + '"]');
      if (input) { input.value = ""; input.placeholder = "$/h"; input.focus(); }
      return;
    }
    const card = RATE_CARDS.find((c) => c.id === pick);
    const newRate = card.rateFor(r.who);
    if (r.card === pick && r.rate === newRate) { render(); return; }
    pushHistory("edit of rate on " + r.code);
    r.card = pick;
    r.rate = newRate;
    autoSave(r); render();
  }
}

/* ---------- fresh row: SAVES THE MOMENT IT EXISTS (round five) ---------- */
/* Creating a row and putting the cursor in it: the add-a-row button at the end of the sheet, and
   the same act from anywhere else that needs a new row. */
function addRowInline(focusCell) {
  const r = createRow();
  widenScopeFor(r.date, "row you just added");
  render();
  const input = document.querySelector('[data-cell="' + (focusCell ?? "matter") + '"][data-id="' + r.id + '"]');
  if (input) { input.focus(); input.scrollIntoView({ block: "nearest" }); }
  return r;
}

/* ---------- cell events ---------- */
const rowsHost = () => $("tkTable");
rowsHost().addEventListener("input", (e) => {
  const input = e.target.closest(".cellin");
  if (!input || !input.dataset.cell) return;
  if (input.classList.contains("noteta")) autoSizeNote(input);
  if (input.dataset.cell === "matter") { openMatterCombo(input); return; }
  if (input.dataset.cell === "who") { openWhoCombo(input); return; }
});
rowsHost().addEventListener("focusin", (e) => {
  const input = e.target.closest(".cellin");
  if (!input || !input.dataset.cell) return;
  const r = rows.find((x) => x.id === input.dataset.id);
  /* Typing in a filled cell REPLACES its value rather than appending to it — a spreadsheet's
     type-over, and the only behavior under which a combobox's filter can match. */
  if (["matter", "who", "rate", "dur", "hours"].includes(input.dataset.cell)) input.select();
  if (input.dataset.cell === "matter") openMatterCombo(input);
  if (input.dataset.cell === "who") openWhoCombo(input);
  if (input.dataset.cell === "rate") openRateCombo(input);
  /* A cell cannot honestly hold a live feed and a hand edit at once — editing either quantity
     pauses the timer first. */
  if ((input.dataset.cell === "dur" || input.dataset.cell === "hours") && r.timer === "running") {
    pauseTimerOn(r);
    input.classList.remove("ticking");
    input.value = input.dataset.cell === "dur" ? fmtDur(r.sec, true) : hoursLabel(billedHours(r.sec));
    input.dataset.orig = input.value;
    syncQuantityCells(r, input);
    input.closest("tbody").classList.remove("tklive", "st-live");
    input.closest("tbody").classList.add(stripeClass(r));
    renderChip();
    toast("Paused to edit — resume with the row's play button");
  }
});
function commitCell(input) {
  const r = rows.find((x) => x.id === input.dataset.id);
  if (!r) return;
  switch (input.dataset.cell) {
    case "date": {
      if (input.value && input.value !== r.date) {
        pushHistory("edit of work date on " + r.code);
        recordEvent(r, "Work date changed to " + usDate(input.value));
        r.date = input.value;
        widenScopeFor(r.date, "row you just re-dated");
        autoSave(r); render();
      }
      break;
    }
    case "matter": {
      if (input.value === matterDisplay(r)) break;
      const q = input.value.trim();
      const exact = MATTERS.find((m) => m.num === q || (m.num + " · " + m.title) === q);
      const list = matterMatches(q);
      const pick = exact ?? (q !== "" && list.length === 1 ? list[0] : null);
      if (pick && (r.matter === null || r.matter.num !== pick.num)) applyComboPick({ kind: "matter", id: r.id }, pick.num);
      else if (q === "" && r.matter !== null) {
        pushHistory("edit of matter on " + r.code);
        r.matter = null; autoSave(r); render();
      } else input.value = matterDisplay(r);
      break;
    }
    case "who": {
      const list = whoMatches(input.value);
      const exact = PEOPLE.find((p) => p.name.toLowerCase() === input.value.trim().toLowerCase());
      const pick = exact ?? (input.value.trim() !== "" && list.length === 1 ? list[0] : null);
      if (pick && pick.name !== r.who) applyComboPick({ kind: "who", id: r.id }, pick.name);
      else input.value = r.who;
      break;
    }
    case "note": {
      if (input.value.trim() !== r.note) {
        pushHistory("edit of description on " + r.code);
        r.note = input.value.trim();
        recordEvent(r, "Description edited");
        autoSave(r); updateDbCell(r); updateStripe(r); renderHonesty(); renderChip(); renderHistoryControls();
      }
      break;
    }
    /* The internal memo commits exactly as the description does; emptying it collapses the line
       back to its button, so an abandoned memo leaves no blank line behind. */
    case "memo": {
      const v = input.value.trim();
      if (v !== r.memo) {
        pushHistory("edit of internal memo on " + r.code);
        r.memo = v;
        recordEvent(r, v === "" ? "Internal memo cleared" : "Internal memo edited");
        autoSave(r); updateDbCell(r); updateMemoBtn(r); renderHistoryControls();
      }
      if (r.memo === "") {
        memoOpen.delete(r.id);
        setTimeout(() => { if (!document.querySelector('[data-cell="memo"][data-id="' + r.id + '"]:focus')) render(); }, 150);
      }
      break;
    }
    case "dur": {
      if (input.value.trim() === (input.dataset.orig ?? "").trim()) break;
      const sec = parseDur(input.value);
      if (sec !== null && sec !== r.sec) {
        pushHistory("edit of duration on " + r.code);
        if (r.timer === "running") pauseTimerOn(r);
        r.sec = sec;
        recordEvent(r, "Duration set to " + fmtDur(sec));
        autoSave(r); render();
      } else if (sec !== null && sec === r.sec) { input.value = r.sec > 0 ? fmtDur(r.sec) : ""; input.dataset.orig = input.value; }
      else if (sec === null && input.value.trim() !== "") { input.value = r.sec > 0 ? fmtDur(r.sec) : ""; }
      break;
    }
    /* Typed hours reconcile the OTHER way: the figure is snapped to the firm's increment and the
       duration becomes its exact equivalent, so the two cells never disagree. */
    case "hours": {
      if (input.value.trim() === (input.dataset.orig ?? "").trim()) break;
      const typed = parseDur(input.value);
      if (typed === null) { input.value = liveSec(r) > 0 ? hoursLabel(billedHours(liveSec(r))) : ""; break; }
      const snapped = typed <= 0 ? 0 : Math.max(0.1, Math.round(typed / 3600 * 10) / 10);
      const sec = Math.round(snapped * 3600);
      if (sec !== r.sec) {
        pushHistory("edit of hours on " + r.code);
        if (r.timer === "running") pauseTimerOn(r);
        r.sec = sec;
        recordEvent(r, "Hours set to " + hoursLabel(snapped), "the duration reconciled to " + fmtDur(sec));
        autoSave(r); render();
      } else { input.value = hoursLabel(snapped); input.dataset.orig = input.value; }
      break;
    }
    case "rate": {
      if (input.value.trim() === (input.dataset.orig ?? "").trim()) break;
      const v = parseFloat(input.value.replace(/[$,]/g, ""));
      if (Number.isFinite(v) && v >= 0 && (v !== r.rate || r.card !== "custom")) {
        pushHistory("edit of rate on " + r.code);
        r.rate = v; r.card = "custom";
        recordEvent(r, "Rate overridden to $" + v.toFixed(2) + "/h", "resolved would be $" + RATE_CARDS[0].rateFor(r.who).toFixed(2) + "/h");
        autoSave(r); render();
        toast("Rate overridden for this entry — resolved would be $" + RATE_CARDS[0].rateFor(r.who).toFixed(2) + "/h");
      } else if (input.value.trim() === "" && r.matter !== null) { input.value = rateLabel(r); }
      break;
    }
  }
}
rowsHost().addEventListener("focusout", (e) => {
  const input = e.target.closest(".cellin");
  if (!input || !input.dataset.cell) return;
  if (["matter", "who", "rate"].includes(input.dataset.cell)) {
    setTimeout(() => { commitCell(input); closeCombos(); }, 140);

    commitCell(input);

});
rowsHost().addEventListener("keydown", (e) => {
  const input = e.target.closest(".cellin");
  if (!input || !input.dataset.cell) return;
  if (e.key === "Enter") {
    const kind = input.dataset.cell;
    if (kind === "note") { e.preventDefault(); input.blur(); return; } // one paragraph; Enter commits
    if ((kind === "matter" || kind === "who") && comboFor !== null) {
      const menu = comboMenu(kind);
      if (!menu.hidden) {
        const hot = menu.querySelector("button.hot") ?? menu.querySelector("button[data-pick]");
        if (hot) { applyComboPick(comboFor, hot.dataset.pick); closeCombos(); e.preventDefault(); return; }
      }
    }
    input.blur();
  } else if (e.key === "Escape") { closeCombos(); input.blur(); e.stopPropagation(); }
});
rowsHost().addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const r = rows.find((x) => x.id === a.dataset.id);
  switch (a.dataset.act) {
    case "start": startTimerOn(r); break;
    case "pause": pauseTimerOn(r); toast("Paused — nothing is lost"); render(); break;
    case "open": openEntry(r.id); break;
    case "openfile": toast("Opens " + a.dataset.file + " (the Documents surface)"); break;
    /* The file cell opens the record on its Attachments tab — a link that opened nothing would be
       an inert control. */
    case "attach": openEntry(r.id, "attachments"); break;
    case "delete": {
      pushHistory("delete of " + r.code + " · " + fmtDur(liveSec(r)));
      rows = rows.filter((x) => x.id !== r.id);
      toast("Deleted " + r.code + " — " + fmtDur(r.sec), "Undo", undo);
      render();
      break;
    }
    case "addrow": addRowInline("matter"); break;
    case "memo": {
      /* A row with a memo already shows it, so this goes to it; a row without reveals the line. */
      memoOpen.add(r.id);
      render();
      const ta = document.querySelector('[data-cell="memo"][data-id="' + r.id + '"]');
      if (ta) { ta.focus(); ta.scrollIntoView({ block: "nearest" }); }
      break;
    }
    case "clearnarrow": filters = {}; searchQ = ""; $("tkSearch").value = ""; render(); break;
  }
});

function openFilterMenu(key, x, y) {
  const c = colByKey(key);
  const menu = $("tkFilterMenu");
  const source = scopeRows();
  const values = [...new Set(source.map((r) => String(c.get(r))))];
  const counts = {};
  for (const r of source) counts[String(c.get(r))] = (counts[String(c.get(r))] ?? 0) + 1;
  const current = filters[key];
  menu.innerHTML = '<div class="mhead">Filter ' + c.label + "</div>" +
    values.map((v) => '<label><input type="checkbox" data-fv="' + esc(v) + '" ' + (current === undefined || current.has(v) ? "checked" : "") + ">" + esc(v) + '<span class="n">' + counts[v] + "</span></label>").join("") +
    '<div class="rule"></div><button data-fclear="' + key + '">' + I.funnelx + "Clear this filter</button>";
  menu.dataset.key = key;
  menu.hidden = false;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - 280, x)) + "px";
  menu.style.top = Math.min(window.innerHeight - 240, y) + "px";
}
$("tkFilterMenu").addEventListener("click", (e) => {
  const key = $("tkFilterMenu").dataset.key;
  const clear = e.target.closest("[data-fclear]");
  if (clear) { delete filters[key]; $("tkFilterMenu").hidden = true; render(); return; }
  const cb = e.target.closest("input[data-fv]");
  if (!cb) return;
  const c = colByKey(key);
  const all = [...new Set(scopeRows().map((r) => String(c.get(r))))];
  const checked = [...$("tkFilterMenu").querySelectorAll("input[data-fv]")].filter((i) => i.checked).map((i) => i.dataset.fv);
  if (checked.length === all.length) delete filters[key];
  else filters[key] = new Set(checked);
  render();
  openFilterMenu(key, parseFloat($("tkFilterMenu").style.left), parseFloat($("tkFilterMenu").style.top));
});

/* A row the person just created or re-dated is never hidden by the scope: if its work date falls
   outside the range in view, the RANGE WIDENS to include it and the caption says so. Widening is
   the only honest move — the alternative is a row that saved and then vanished. */
function widenScopeFor(iso, why) {
  if (!iso || (iso >= scope.from && iso <= scope.to)) return false;
  const from = iso < scope.from ? iso : scope.from;
  const to = iso > scope.to ? iso : scope.to;
  scope = { from, to, label: spanLabel(from, to), note: "widened to include the " + why + " on " + monthDay(iso) };
  toast("Scope widened to " + spanLabel(from, to) + " — the " + why + " stays in view");
  return true;
}
/* The date scope: today, yesterday, this week, or a custom range. Incomplete older rows always
   surface regardless — they are the reason save-with-nothing exists. */
function openScopeMenu() {
  const menu = $("tkScopeMenu");
  menu.innerHTML = '<div class="mhead">Show entries for</div>' +
    SCOPE_PRESETS.map((k) => {
      const p = scopePreset(k);
      return '<button data-scope="' + k + '"' + (scope.from === p.from && scope.to === p.to ? ' class="hot"' : "") +
        ' title="' + esc(usDate(p.from) + (p.from === p.to ? "" : " to " + usDate(p.to))) + '">' + esc(p.label) + "</button>";
    }).join("") +
    '<div class="rule"></div><div class="mhead">Custom range</div>' +
    '<div class="rangerow"><input type="date" id="tkScopeFrom" value="' + scope.from + '"><span class="muted">to</span><input type="date" id="tkScopeTo" value="' + scope.to + '"></div>' +
    '<div class="mnote" id="tkRangeNote">The range applies as you pick it &mdash; a preset above returns to a named scope.</div>' +
    '<div class="mnote">Incomplete rows from earlier days always show — they stay until completed.</div>';
  menu.hidden = false;
  const r = $("tkScopeBtn").getBoundingClientRect();
  menu.style.left = r.left + "px";
  menu.style.top = r.bottom + 4 + "px";
  wireCustomRange();
}
/* THE CUSTOM RANGE APPLIES AS IT IS PICKED (round seven, item 4) — no Apply button. The menu
   stays open while the range is adjusted, so the presets above it remain the visible way back. */
function wireCustomRange() {
  const apply = () => {
    const f = $("tkScopeFrom").value, t = $("tkScopeTo").value;
    const note = $("tkRangeNote");
    if (!f || !t) { note.textContent = "Pick both a start and an end; the range applies as you pick it."; return; }
    if (f > t) {
      note.textContent = "The start is after the end — the range is not applied until it reads forwards.";
      note.classList.add("warn");
      return;
    }
    note.classList.remove("warn");
    note.innerHTML = "Applied. A preset above returns to a named scope.";
    scope = { from: f, to: t, label: f === t ? usDate(f) : usDate(f) + "–" + usDate(t) };
    renderRows(); sizeNotes(); renderBarStates(); renderHonesty();
  };
  ["tkScopeFrom", "tkScopeTo"].forEach((id) => {
    $(id).addEventListener("change", apply);
    $(id).addEventListener("input", apply);
  });
}
$("tkScopeMenu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-scope]");
  if (!b) return;
  const preset = scopePreset(b.dataset.scope);
  if (!preset) return;
  scope = preset;
  $("tkScopeMenu").hidden = true;
  render();
});

/* ---------- the record window's typable comboboxes ----------
 * Every dropdown on this surface is a typable combobox (TC1/X4), the record window's included:
 * typing filters, the chevron shows everything, Enter commits, Escape restores. The committed key
 * lives in the field's data-value; the visible text is its label. The window re-renders, so these
 * are wired per render rather than once at load. */
const DIALOG_COMBOS = {
  eMatter: {
    placeholder: "Matter",
    head: "Matter — type the number or the name",
    options: () => [{ value: "", label: "No matter yet", note: "saved under its provisional code" }]
      .concat(MATTERS.map((m) => ({ value: m.num, label: m.num + " · " + m.title, note: "" }))),
    onPick: () => { const t = document.querySelector('[data-rtab="attachments"]'); if (t && t.getAttribute("aria-current") === "true") t.click(); },
  },
  eWho: {
    placeholder: "Staff",
    head: "Timekeeper — whose work this is",
    options: () => PEOPLE.map((p) => ({ value: p.name, label: p.name, note: "$" + p.rate.toFixed(2) + "/h standard" })),
  },
  eCategory: { placeholder: "Category", head: "Category", options: () => ENTRY_CATEGORIES.map((c) => ({ value: c, label: c, note: "" })) },
  eActivity: { placeholder: "Activity code", head: "Activity code", options: () => ENTRY_ACTIVITIES.map((a) => ({ value: a === "None" ? "" : a, label: a, note: "" })) },
};
let dialogComboFor = null;
function comboValue(id) { return $(id).dataset.value ?? ""; }
function setComboValue(id, value) {
  const spec = DIALOG_COMBOS[id];
  const opt = spec.options().find((o) => o.value === value) ?? spec.options()[0];
  $(id).dataset.value = opt.value;
  $(id).value = opt.label;
}
function openDialogCombo(input) {
  const spec = DIALOG_COMBOS[input.id];
  dialogComboFor = input.id;
  const typed = input.value.trim().toLowerCase();
  const current = spec.options().find((o) => o.value === comboValue(input.id));
  const q = current && input.value === current.label ? "" : typed;
  const list = spec.options().filter((o) => q === "" || o.label.toLowerCase().includes(q));
  const menu = $("tkDialogMenu");
  menu.innerHTML = '<div class="mhead">' + esc(spec.head) + "</div>" +
    (list.length === 0
      ? '<div class="mnote">Nothing matches &ldquo;' + esc(input.value) + "&rdquo;</div>"
      : list.map((o, i) => '<button data-dpick="' + esc(o.value) + '"' + (i === 0 ? ' class="hot"' : "") + '><span class="mnum">' + esc(o.label) + "</span>" +
        (o.note ? '<span class="mtitle">' + esc(o.note) + "</span>" : "") + "</button>").join(""));
  menu.hidden = false;
  const rect = input.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(window.innerWidth - 320, rect.left)) + "px";
  menu.style.top = Math.min(window.innerHeight - 200, rect.bottom + 2) + "px";
  menu.style.minWidth = Math.round(rect.width) + "px";
}
function closeDialogCombo(restore) {
  if (restore && dialogComboFor && $(dialogComboFor)) setComboValue(dialogComboFor, comboValue(dialogComboFor));
  $("tkDialogMenu").hidden = true;
  dialogComboFor = null;
}
$("tkDialogMenu").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button[data-dpick]");
  if (!b || dialogComboFor === null) return;
  e.preventDefault();
  const id = dialogComboFor;
  setComboValue(id, b.dataset.dpick);
  closeDialogCombo(false);
  if (DIALOG_COMBOS[id].onPick) DIALOG_COMBOS[id].onPick();
});
function wireDialogCombo(id) {
  const input = $(id);
  if (!input) return;
  /* Focusing selects the committed label, so typing REPLACES it and filters — typing into a
     filled combobox must never append to its own value and match nothing. */
  input.addEventListener("focus", () => { input.select(); openDialogCombo(input); });
  input.addEventListener("input", () => openDialogCombo(input));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const hot = $("tkDialogMenu").querySelector("button.hot") ?? $("tkDialogMenu").querySelector("button[data-dpick]");
      if (hot && !$("tkDialogMenu").hidden) {
        setComboValue(id, hot.dataset.dpick);
        closeDialogCombo(false);
        if (DIALOG_COMBOS[id].onPick) DIALOG_COMBOS[id].onPick();
      }
    } else if (e.key === "Escape" && !$("tkDialogMenu").hidden) {
      /* Escape closes the open list first; with no list open it belongs to the window. */
      closeDialogCombo(true); e.stopPropagation();
    }
  });
  input.addEventListener("blur", () => setTimeout(() => { if (dialogComboFor === id) closeDialogCombo(true); }, 150));
}

/* ============ THE RECORD WINDOW ============
 * Round seven, item 7 — the owner, binding and cross-surface: "the time entry screen we have here
 * really should match the other time history screen with history and attachments and the like."
 * This is the matter Time tab's record modal, not a second design: the two-pane shell, its tab
 * set, and its header actions are lifted from the shared WIP template (the unified artifact's
 * `recordModal`), so the app has ONE component to build. The Time Sheet's only genuine difference
 * is that it is cross-matter, and that difference lives in the record's FIELD LIST — the Matter
 * field — not in a different window.
 *
 * LEFT: the record — the changeable facts, dense and top-aligned.
 * RIGHT: context in tabs — History (its own scrollable tab), Attachments, Billing.
 * HEADER: edit, print, full screen, close. FOOTER: one action bar. */
let entryOpenId = null;
let recordSpec = null;
let recordMaxOn = false;
try { recordMaxOn = sessionStorage.getItem("tkRecordMax") === "1"; } catch { /* storage may be unavailable */ }

      '<button class="iconbtn" id="rmPrint" title="' + esc(o.print.why) + '" aria-label="Print">' + I.printer + "</button>") +
    '<button class="iconbtn" id="rmMax"></button>' +
    '<button class="iconbtn" id="rmClose" title="Close" aria-label="Close">' + I.close + "</button></span>";
}

  const sync = () => {
    dlg.classList.toggle("max", recordMaxOn);
