[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2026-10-14
reason = "uuid 8.3.2 (CVSS 7.5; GitHub labels it Moderate — flagged because this gate keys npm severity off CVSS). Transitive dev-tooling dependency of postman-collection 4.5.0 (API-contract test tooling), not on any production-runtime path; the advisory is a buffer-bounds issue in v3/v5/v6 with caller-supplied output buffers, which this tool does not exercise with untrusted input. A forced 8->11 major bump risks the tool. Re-check when postman-collection moves off uuid 8."
