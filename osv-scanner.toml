# Accepted advisories for the CI dependency-audit gate (osv-scanner, .github/workflows/gate.yml).
# Passed explicitly with `--config osv-scanner.toml` because auto-discovery does not reach child
# directories in a monorepo. Adding an entry is an explicit security decision, never a quick unblock;
# each carries a cause. The `ignoreUntil` on the tracked-remediation set is a forcing function — when it
# lapses the advisory re-surfaces and fails the gate, so acceptance cannot silently become permanent.

# --- Long-standing accepted dev/build-tooling advisories (npm) -------------------------------------
# This file is now the sole home for accepted advisories: the pre-push hook's `pnpm audit` step and the
# package.json `pnpm.auditConfig.ignoreGhsas` it read have been removed, so the CI osv-scanner gate is the
# one authoritative audit over both supply chains.

