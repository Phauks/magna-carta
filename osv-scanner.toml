# Accepted advisories for the CI dependency-audit gate (osv-scanner, .github/workflows/gate.yml).
# Passed explicitly with `--config osv-scanner.toml` because auto-discovery does not reach child
# directories in a monorepo. Adding an entry is an explicit security decision, never a quick unblock;
# each carries a cause. The `ignoreUntil` on the tracked-remediation set is a forcing function — when it
# lapses the advisory re-surfaces and fails the gate, so acceptance cannot silently become permanent.

# --- Long-standing accepted dev/build-tooling advisories (npm) -------------------------------------
# This file is now the sole home for accepted advisories: the pre-push hook's `pnpm audit` step and the
# package.json `pnpm.auditConfig.ignoreGhsas` it read have been removed, so the CI osv-scanner gate is the
# one authoritative audit over both supply chains.

[[IgnoredVulns]]
id = "GHSA-r5fr-rjxr-66jc"
reason = "Pre-existing transitive dev/build-tooling advisory (lodash), no production-runtime exploit path. Drops when the carrier upgrades; note this needs a deliberate bump, not an automated one, until the Renovate app is actually installed on the repository."

# --- Tracked advisories (surfaced when osv-scanner first audited the Rust supply chain 2026-07-16).
# Each was accepted with cause and a time-boxed ignoreUntil forcing function that re-surfaced it for
# review. Entries leave this file as soon as they are genuinely remediated, never by quietly extending
# the clock: lopdf (RUSTSEC-2026-0187) left when the carrier moved to 0.42.0; the esbuild advisory left
# when GitHub withdrew it; the uuid advisory (GHSA-w5hq-g745-h8pq) left on the 2026-08-04 review when the
# pnpm-workspace.yaml override forced uuid 11.1.1 onto postman-collection; and the two quick-xml entries
# (RUSTSEC-2026-0194 and -0195) left when the carrier itself was removed from the tree — the exit their
# own acceptance reason named. office-crypto was quick-xml's only consumer in every audited lockfile, and
# no office-crypto release resolves quick-xml >= 0.41, so replacing it was the only remediation that
# existed. crates/decryption-core now implements the MS-OFFCRYPTO package decryption loop itself, on the
# agile verifier and descriptor parser it already owned. The 64 KiB descriptor cap and the
# EncryptedPackage bounds stay — they are correct defense-in-depth for the in-house parser too.
#
# quick-xml is back in the tree, and this time at a FIXED version rather than an accepted one:
# crates/discovery-core takes it directly to pull character data out of OOXML and OpenDocument parts,
# and it resolves >= 0.41.0 in crates/Cargo.lock and containers/discovery/Cargo.lock. 0.41.0 is the
# release that carries both fixes — the attribute duplicate check is O(N) rather than O(N²), and
# NamespaceResolver::push caps namespace declarations per element instead of allocating unbounded — so
# neither advisory applies and neither needs an entry here. A future bump must not drop below 0.41.
#
# No Rust advisory is currently accepted. The npm entry above is the only remaining ignore.
