# Accepted advisories for the CI dependency-audit gate (osv-scanner, .github/workflows/gate.yml).
# Passed explicitly with `--config osv-scanner.toml` because auto-discovery does not reach child
# directories in a monorepo. Adding an entry is an explicit security decision, never a quick unblock;
# each carries a cause. The `ignoreUntil` on the tracked-remediation set is a forcing function — when it
# lapses the advisory re-surfaces and fails the gate, so acceptance cannot silently become permanent.
#
# ONE ENTRY IS ACCEPTED TODAY, AND THE EMPTY STATE IS STILL THE INTENDED ONE. An entry belongs here
# only when an advisory would otherwise FAIL the gate — that is, a remaining HIGH or CRITICAL
# (CVSS >= 7.0) with no remediation available. An advisory the gate already passes needs no entry, and
# adding one would be actively harmful: it would hide a finding that is currently visible in the scan
# output for the next person who reads it.
#
# --- History, so a future reader knows why the mechanism exists ------------------------------------
#
# Tracked advisories were first surfaced when osv-scanner audited the Rust supply chain (2026-07-16).
# Each was accepted with cause and a time-boxed ignoreUntil that re-surfaced it for review. Entries
# left this file as soon as they were genuinely remediated, never by quietly extending the clock:
# lopdf (RUSTSEC-2026-0187) left when the carrier moved to 0.42.0; the esbuild advisory left when
# GitHub withdrew it; the uuid advisory (GHSA-w5hq-g745-h8pq) left on the 2026-08-04 review when the
# pnpm-workspace.yaml override forced uuid 11.1.1 onto postman-collection; and the two quick-xml
# entries (RUSTSEC-2026-0194 and -0195) left when the carrier itself was removed from the tree — the
# exit their own acceptance reason named. office-crypto was quick-xml's only consumer in every audited
# lockfile, and no office-crypto release resolves quick-xml >= 0.41, so replacing it was the only
# remediation that existed. crates/decryption-core now implements the MS-OFFCRYPTO package decryption
# loop itself, on the agile verifier and descriptor parser it already owned. The 64 KiB descriptor cap
# and the EncryptedPackage bounds stay — they are correct defense-in-depth for the in-house parser too.
#
# quick-xml is back in the tree, and this time at a FIXED version rather than an accepted one:
# crates/discovery-core takes it directly to pull character data out of OOXML and OpenDocument parts,
# and it resolves >= 0.41.0 in crates/Cargo.lock and containers/discovery/Cargo.lock. 0.41.0 is the
# release that carries both fixes — the attribute duplicate check is O(N) rather than O(N²), and
# NamespaceResolver::push caps namespace declarations per element instead of allocating unbounded — so
# neither advisory applies and neither needs an entry here. A future bump must not drop below 0.41.
#
# The last entry to leave was the long-standing lodash one (GHSA-r5fr-rjxr-66jc, code injection via
# `_.template` import key names, CVSS 8.1 — the only advisory over the fail threshold this file has
# carried for months). Its acceptance reason said it would drop when the carrier upgraded, and no
# carrier ever did: postman-collection hard-pins lodash 4.17.21 through its newest release. What
# resolved it was the same move that resolved uuid on the same carrier — a pnpm-workspace.yaml
# override, onto lodash 4.18.1, which every other consumer in the tree already resolved. The 4.18 line
# fixes that advisory and the two prototype-pollution records alongside it.
#
# The same carrier was the wall for @faker-js/faker 5.5.3 (GHSA-qxc2-j82w-r537, helpers.fake code
# execution, CVSS 7.8, fixed only in 10.5.0). postman-collection hard-pins 5.5.3 through its newest
# release and reads the v5 API at module load, so the override that worked for lodash and uuid makes
# it throw on require here. It left the tree on 2026-09-02 the way quick-xml did: the carrier went.
# postman-collection reached the lockfile only through the Prism mock server's HTTP layer, and nothing
# in the repository ran Prism, so @stoplight/prism-cli was dropped from apps/api-worker and the mock
# server is run on demand with `pnpm dlx` instead (docs/conventions/api.md).
#
# --- What is NOT accepted, and is deliberately left visible ----------------------------------------
#
# Eight advisories remain in the audited lockfiles. All eight pass the gate on severity, and every one
# has either no fix published or no fix reachable without a carrier moving first, so there is nothing
# an entry here could usefully forgive:
#
#   cookie 0.6.0 (GHSA-pxg6-pf52-xh8x, low) — @sveltejs/kit still declares ^0.6.0 as of 2.70.2.
#   esbuild 0.18.20 (GHSA-67mh-4wv8-2f99, 5.3) — @esbuild-kit/core-utils hard-pins ~0.18.20 and is
#     deprecated; it reaches the tree only through drizzle-kit's config loader, which never starts the
#     esbuild dev server the advisory is about.
#   paste 1.0.15, proc-macro-error2 2.0.1, ttf-parser 0.25.1, bincode 2.0.1 — unmaintained-crate
#     notices with no fixed version published. The first two are build-time proc macros with no
#     runtime surface at all.
#   rsa 0.10.0-rc.21 (RUSTSEC-2023-0071, Marvin timing sidechannel, 5.9) — no fixed release exists
#     upstream. It arrives through yara-x's signature-parsing modules, which verify Authenticode signatures on
#     scanned samples and hold no private key; the attack recovers a private key through a
#     decryption/signing oracle, so there is no operation here for it to target.
#   wasmtime 43.0.2 (RUSTSEC-2026-0222, 3.8) — yara-x requires ^43.0.2 and the fix landed in 46.0.2,
#     so no yara-x release reaches it. The defect needs an application that moves a Store between two
#     Engines; yara-x uses one.

# --- Accepted, with cause ---------------------------------------------------------------------------

# The owner accepted this advisory on 2026-09-01, after the remediation search below came back empty.
# It is the same crate and the same wall as RUSTSEC-2026-0222 above, one advisory later and over the
# fail threshold rather than under it.
#
# Why no remediation exists: the fixed ranges are < 24.0.13, < 36.0.14, < 46.0.3 and < 47.0.4, and
# 43.0.2 sits in the 37.0.0 → < 46.0.3 band, so the fix for this line is 46.0.3. yara-x is wasmtime's
# only carrier in every audited lockfile, and no published release reaches that high — 1.18.0 (ours)
# and 1.19.0 require ^43.0.2, and even 1.20.0, the newest, requires ^45.0.3. Checked against crates.io
# rather than assumed.
#
# Why the exposure is judged nil rather than small: the defect is a filesystem sandbox escape through
# trailing slashes or symlinks in a WASI preopen. containers/scan uses yara_x::{Compiler, Rules,
# Scanner} only; wasmtime is internal to yara-x's rule JIT, and there is no WASI, no preopen and no
# guest filesystem anywhere in that container's source. There is no operation here for the advisory
# to target.
#
# The exit condition is a yara-x release requiring wasmtime >= 46.0.3. ignoreUntil re-surfaces it for
# review before then, so this cannot become permanent by inattention.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0269"
ignoreUntil = 2026-10-01
reason = "wasmtime 43.0.2 WASI filesystem sandbox escape. No remediation reachable: the fix for the 37-45 line is 46.0.3 and no yara-x release requires above ^45.0.3. yara-x is the only carrier, and containers/scan uses it for rule compilation and scanning only - no WASI, no preopens, no guest filesystem - so the advisory has no reachable surface. Revisit when a yara-x release requires wasmtime >= 46.0.3."
