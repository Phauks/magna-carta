# Shared setup for every gate job: install pnpm + Node (with the pnpm store cached) + workspace deps,
# and — only when a job needs it — the pinned Rust toolchain plus a cached cargo/target. Checkout is the
# caller's job (a composite action cannot check out for you); run this immediately after it. Factoring
# this out keeps the per-job steps to "what this job actually checks", not boilerplate repeated ten times.
#
# The gate fans out to a dozen jobs and every one of them installs the whole workspace, so the install
# is the one cost multiplied by the entire fan-out. Two caches, in series: the pnpm store cache makes the
# DOWNLOAD free, and the node_modules cache makes most of the LINKING free. The node_modules key is the
# exact lockfile hash plus the Node major, with NO restore-keys, because a partially-matching dependency
# tree is worse than no cache: change the lockfile and the entry simply misses and a clean install runs.
#
# The install still runs on a cache hit, and deliberately so. Two reasons: it re-verifies the restored
# tree against the lockfile, so a bad restore is repaired here rather than surfacing as an inexplicable
# failure three jobs later; and the workspace's `prepare` scripts (notably the web app's `svelte-kit
# sync`) generate files OUTSIDE node_modules that svelte-check needs, which no node_modules cache can
# supply. On a warm tree that install is a few seconds of verification instead of a full link pass.
#
# Worth knowing if this is ever revisited: pnpm links from the store by hardlink, which is already fast,
# so the margin here is thinner than it would be in an npm/yarn repo. If a run ever shows the restore
# costing more than the link pass it replaces, delete the node_modules cache and keep the store cache —
# the install path works unchanged either way.
name: Setup toolchain
description: Install pnpm, Node, and workspace dependencies (and optionally the pinned Rust toolchain).

inputs:
  rust:
    description: When 'true', install the toolchain pinned by rust-toolchain.toml and cache the crates workspace.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    - name: Restore the linked workspace (node_modules)
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        # pnpm's virtual store plus every workspace member's symlink tree. The members' node_modules are
        # symlink farms pointing into node_modules/.pnpm, so they only make sense restored together.
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          plugins/*/node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      # Run on a miss AND on a hit. On a hit the tree is already correct, so this is a few-second
      # integrity re-verify rather than a link pass — and it is what keeps the cache from being load
      # bearing: if a restored tree were ever wrong, --frozen-lockfile repairs it here instead of
      # failing obscurely three steps later. --prefer-offline keeps it off the network when the store
      # cache already has every tarball.
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Rust toolchain (pinned by rust-toolchain.toml)
      if: inputs.rust == 'true'
      shell: bash
      run: rustup show && rustc --version

    - name: Cache the cargo registry and crates target
      if: inputs.rust == 'true'
      # Swatinem/rust-cache instead of a hand-rolled actions/cache: it keys on the resolved dependency
      # set AND the exact rustc version (a toolchain bump invalidates a hand-rolled Cargo.lock key not
      # at all, which silently serves incompatible artifacts), prunes the registry sources and the
      # workspace's own crates out of the saved target dir so the entry stays small, and skips the save
      # entirely when nothing changed. `workspaces` points it at the crates workspace, whose target dir
      # is crates/target.
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: crates
