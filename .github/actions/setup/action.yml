# Shared setup for a workflow job: install pnpm + Node (with the pnpm store cached) + workspace deps.
# Checkout is the caller's job (a composite action cannot check out for you); run this immediately
# after it. Only assemble-docs.yml uses it today: the quality gate no longer runs on a hosted runner
# (it is `pnpm gate`, run on the machine that made the change — tooling/gate/index.mjs says why), so
# the WASM-artefact and Rust-toolchain halves this action once carried are gone with it.
#
# Two caches, in series: the pnpm store cache makes the DOWNLOAD free, and the node_modules cache
# makes most of the LINKING free. The node_modules key is the exact lockfile hash plus the Node major,
# with NO restore-keys, because a partially-matching dependency tree is worse than no cache: change
# the lockfile and the entry simply misses and a clean install runs.
#
# The install still runs on a cache hit, and deliberately so. Two reasons: it re-verifies the restored
# tree against the lockfile, so a bad restore is repaired here rather than surfacing as an inexplicable
# failure later; and the workspace's `prepare` scripts (notably the web app's `svelte-kit sync`)
# generate files OUTSIDE node_modules that no node_modules cache can supply. On a warm tree that
# install is a few seconds of verification instead of a full link pass.
name: Setup toolchain
description: Install pnpm, Node, and workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22
        cache: pnpm

    - name: Restore the linked workspace (node_modules)
      id: node-modules-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # pnpm's virtual store plus every workspace member's symlink tree. The members' node_modules are
        # symlink farms pointing into node_modules/.pnpm, so they only make sense restored together.
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          plugins/*/node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      # Run on a miss AND on a hit. On a hit the tree is already correct, so this is a few-second
      # integrity re-verify rather than a link pass — and it is what keeps the cache from being load
      # bearing: if a restored tree were ever wrong, --frozen-lockfile repairs it here instead of
      # failing obscurely later. --prefer-offline keeps it off the network when the store cache
      # already has every tarball.
      run: pnpm install --frozen-lockfile --prefer-offline
