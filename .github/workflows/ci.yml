name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # vp manages its own pnpm for vp-run steps, but does not put pnpm on the
      # runner's PATH; the `pnpm check` and wrangler dry-run steps need it.
      - uses: pnpm/action-setup@v6

      - uses: voidzero-dev/setup-vp@v1.12.0
        with:
          version: "0.1.24"
          node-version: "25"
          run-install: "false"

      - name: Install dependencies
        run: vp install

      - name: Quality gate (fmt + lint + TS type-check + svelte-check)
        run: pnpm check

      # The design-system Storybook story tests run in browser mode (Chromium via Playwright) with
      # per-story axe checks, registered as a Vitest project in the root config — so `vp test` needs
      # the Chromium binary (+ its OS deps on the Linux runner). Without this step those component
      # tests cannot launch.
      - name: Install Playwright Chromium (Storybook browser & axe tests)
        run: pnpm --filter @magna-carta/design-system exec playwright install --with-deps chromium

      - name: Tests (unit + Miniflare worker integration + Storybook browser & axe)
        run: vp test

      - name: Build web SPA then worker
        run: vp run build-all

      - name: Validate Worker + assets config (no publish)
        run: pnpm --filter @magna-carta/worker exec wrangler deploy --dry-run
        # To deploy for real: add a CLOUDFLARE_API_TOKEN secret and drop --dry-run
