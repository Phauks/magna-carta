name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # vp manages its own pnpm for vp-run steps, but does not put pnpm on the
      # runner's PATH; the `pnpm check` and wrangler dry-run steps need it.
      - uses: pnpm/action-setup@v6

      - uses: voidzero-dev/setup-vp@v1.12.0
        with:
          version: "0.1.24"
          node-version: "25"
          run-install: "false"

      - name: Install dependencies
        run: vp install

      # Dependency audit: fail on a KNOWN-vulnerable dependency at high+ severity; advisory/moderate
      # findings do not block. Registry advisories, zero extra tooling — the osv-scanner action is
      # the documented upgrade path if coverage disappoints.
      - name: Dependency audit (high severity)
        run: pnpm audit --audit-level high

      - name: Quality gate (fmt + lint + TS type-check + svelte-check)
        run: pnpm check

      - name: Governance — no process-artifact references in code (golden rule 13)
        run: pnpm run lint:process-refs

      - name: Governance — dependency license allowlist (deny AGPL/SSPL)
        run: pnpm run lint:licenses

      - name: Tests (Miniflare worker integration)
        run: vp test

      # --- API contract gates — the committed snapshot is the source of truth; CI
      # re-derives every downstream artifact and fails on drift (code-as-contract). ---

      - name: Contract — snapshot drift (code-as-contract)
        run: |
          pnpm --filter @magna-carta/worker run emit-openapi
          git diff --exit-code apps/worker/openapi/openapi.json

      - name: Contract — generated client drift
        run: |
          pnpm run generate-client
          git diff --exit-code packages/api-client/src

      - name: Contract — Spectral hygiene lint
        run: pnpm --filter @magna-carta/worker exec spectral lint openapi/openapi.json --fail-severity warn

      # oasdiff compares this PR's snapshot against the base branch's committed snapshot and fails on a
      # breaking change (ERR). review: false keeps the contract off oasdiff.com (the firm controls its
      # own data). Skipped on the first introduction, when the base branch has no snapshot yet.
      - name: Contract — locate base snapshot for oasdiff (PR only)
        if: github.event_name == 'pull_request'
        id: oasdiff_base
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git cat-file -e "origin/${{ github.base_ref }}:apps/worker/openapi/openapi.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base branch carries no committed snapshot yet — skipping oasdiff (first introduction)."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Contract — breaking changes (oasdiff)
        if: github.event_name == 'pull_request' && steps.oasdiff_base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.0.58
        with:
          base: "origin/${{ github.base_ref }}:apps/worker/openapi/openapi.json"
          revision: apps/worker/openapi/openapi.json
          fail-on: ERR
          review: false

      # Forward-obligation: /api/v1/me mocks 200 today because the document declares no security
      # schemes. When the auth surfaces emit OpenAPI security, Prism will
      # 401 this probe — switch it to GET /api/health (unauthenticated) or pass a credential then.
      - name: Contract — Prism mock smoke
        run: |
          pnpm --filter @magna-carta/worker exec prism mock openapi/openapi.json --port 4010 &
          PRISM_PID=$!
          ok=1
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4010/api/v1/me > /dev/null; then ok=0; break; fi
            sleep 1
          done
          kill "$PRISM_PID" 2>/dev/null || true
          exit $ok

      - name: Build web SPA then worker
        run: vp run build-all

      - name: Validate Worker + assets config (no publish)
        run: pnpm --filter @magna-carta/worker exec wrangler deploy --dry-run
        # To deploy for real: add a CLOUDFLARE_API_TOKEN secret and drop --dry-run

  # The malware-scan Container (slice 2·1 Plan 2): a Rust + clamd image. Separate job so its heavy
  # image build runs in parallel with the main gate and only when its sources change. The EICAR
  # end-to-end gate is the scan engine's acceptance test — it cannot run under the local worker test
  # pool (containers are not supported there), so this is where the wired container is proven.
  scan-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            scan:
              - 'containers/scan/**'

      - name: Rust format + lint + unit tests
        if: steps.changes.outputs.scan == 'true'
        working-directory: containers/scan
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: EICAR end-to-end acceptance gate (build image + detect EICAR)
        if: steps.changes.outputs.scan == 'true'
        run: bash containers/scan/tests/eicar_e2e.sh
