name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # vp manages its own pnpm for vp-run steps, but does not put pnpm on the
      # runner's PATH; the `pnpm check` and wrangler dry-run steps need it.
      - uses: pnpm/action-setup@v4

      - uses: voidzero-dev/setup-vp@v1.0.0
        with:
          version: "0.1.24"
          node-version: "25"
          run-install: "false"

      - name: Install dependencies
        run: vp install

      - name: Quality gate (fmt + lint + TS type-check + svelte-check)
        run: pnpm check

      - name: Tests (Miniflare worker integration)
        run: vp test

      - name: Build web SPA then worker
        run: vp run build-all

      - name: Validate Worker + assets config (no publish)
        run: pnpm --filter @magna-carta/worker exec wrangler deploy --dry-run
        # To deploy for real: add a CLOUDFLARE_API_TOKEN secret and drop --dry-run
