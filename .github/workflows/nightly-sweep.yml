# The whole-repo type-aware lint, on a daily schedule — the exhaustive counterpart to the PR gate's
# scoped lint. The gate's `lint` job runs affected-lint with `--defer-global`, so a whole-repo trigger
# (a lockfile bump, a root-config or `.github/` change, a source outside every package) does NOT pay the
# ~24-min whole-repo tsgolint pass on the critical path — it is deferred here. tsgolint has no cross-run
# cache upstream and is single-threaded, so it is CI's tall pole; running it once a day on `main` instead
# of on every PR (and every merge) is the bulk of the CI-minute saving, at the cost of catching a
# repo-wide type-aware regression within a day rather than at merge. The change's own package closure is
# always linted on its PR, so this only backstops findings that a dependency-graph scope cannot see (a
# global input flipping a rule in an untouched package). Rationale: docs/conventions/build-performance.md.
#
# Everything else the gate checks (type-check, tests, contracts, governance) already runs whole-repo on
# every PR, so the sweep does not repeat them; it covers only the one dimension the gate scopes.
#
# CHANGE DETECTION. The lint only runs when `main` has moved in a lint-relevant way since the last
# successful sweep — a night with no new commits, or only docs/asset commits, skips the whole ~24-min
# pass. The `decide` job diffs the current tip against the head commit of the previous successful
# nightly-sweep run and reuses affected-lint (WITHOUT `--defer-global`, so a global input still counts):
# an affected-lint result of `NONE` means nothing lintable changed → skip. The first run (no previous
# success) and any run whose previous commit is unresolvable lint to be safe.
name: nightly-sweep

on:
  schedule:
    # 08:00 UTC daily — off-peak, and after any overnight merges have landed.
    - cron: "0 8 * * *"
  # Run it on demand (e.g. right after a risky global-input merge) without waiting for the schedule.
  workflow_dispatch:

# One sweep at a time; a manual dispatch supersedes a running one.
concurrency:
  group: nightly-sweep
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # `decide` reads this workflow's run history to find the last swept commit.

jobs:
  # Decide whether anything lint-relevant changed since the last successful sweep. Pure node + git + gh
  # (no workspace deps), so it is a ~1-minute job; on a quiet night it is the ONLY job that runs.
  decide:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.decide.outputs.lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint-relevant change since the last successful sweep?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Head commit of the most recent SUCCESSFUL sweep = the last commit we actually swept clean
          # (a skipped-lint night still succeeds at main's then-current tip, so this is the right base;
          # a failed night is excluded, so we keep re-linting until green). This run is in_progress, so
          # it is not in the success list.
          prev="$(gh run list --workflow nightly-sweep.yml --branch main --status success \
            --json headSha --jq '.[0].headSha' --limit 1 2>/dev/null || true)"
          if [ -z "$prev" ] || ! git cat-file -e "$prev" 2>/dev/null; then
            echo "no usable previous-sweep commit ($prev) — linting to be safe"
            echo "lint=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Reuse the gate's scoping logic (no --defer-global, so a global input still forces coverage):
          # NONE means no lintable package and no global input moved since $prev — nothing to sweep.
          scope="$(node tooling/affected-lint/index.mjs --base "$prev")"
          echo "affected-lint since $prev: $scope"
          if [ "$scope" = "NONE" ]; then
            echo "no lint-relevant change since the last sweep — skipping the whole-repo lint"
            echo "lint=false" >> "$GITHUB_OUTPUT"
          else
            echo "lint=true" >> "$GITHUB_OUTPUT"
          fi

  lint-whole-repo:
    needs: decide
    if: needs.decide.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore the built WASM packages
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            packages/pdf/src/pkg
            packages/decryption/src/pkg
            packages/email/src/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'crates/**/wasm.Dockerfile') }}

      - name: Set up toolchain (pnpm + Node + deps)
        uses: ./.github/actions/setup

      - name: Build the WASM artefacts (pinned Docker images)
        # Type-aware lint resolves @magna-carta/{pdf,decryption,email} types from these packages, so they
        # must exist. On a cache miss (Rust sources changed since the last sweep) the canonical Docker
        # build produces them; the same cache key as the gate's `wasm` job means a hit is the common case.
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec vp run rust-wasm-build

      - name: Lint (type-aware, whole repo)
        run: pnpm exec vp check --no-fmt
