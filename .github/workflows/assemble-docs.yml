# Deterministic docs assembly — folds committed fragments into the rendered trackers on every push to
# `main`, so `CHANGELOG.md`, the Decision-Log register + numbered ADR files, `STATUS.md`/`STATUS.json`, and
# the build register rendered from the feature ledger (`docs/now.md`) are current
# the moment the merge that added their fragments lands. This owns the deterministic half of
# docs maintenance; the judgment-bearing half (coverage audit, drafting, roadmap rollup) is the weekly
# propose-only docs-sync routine — see docs/maintenance/README.md and
# docs/specs/2026-07-14-docs-sync-routine-design.md.
#
# Delivery is an AUTO-MERGING PULL REQUEST from the `docs-assembly` branch, not a direct push, so the
# `main` ruleset (a pull request before merging) is honored hands-free. A pull request opened with the
# workflow's own token fires no `pull_request` events, so the hosted gate (ci.yml) never starts on its
# own; this job dispatches it onto the branch, which reports the `gate` check the ruleset requires and
# lets auto-merge complete.
#
# Like ci.yml, this needs Actions minutes. While the account's budget is exhausted it does not run, and
# the fragments accumulate until the weekly docs-sync routine (docs/maintenance/README.md) or a session
# runs the same assemblers by hand; it resumes on its own when the budget does.
#
# TWO one-time repository settings are required, or the job fails LOUDLY (by design — a silent green
# run once hid exactly this):
#   1. Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and
#      approve pull requests"  (without it, `gh pr create` is refused).
#   2. Settings > General > Pull Requests > "Allow auto-merge"  (without it, `gh pr merge --auto` fails).
#
# Loop and race behavior: the auto-merged assembly commit contains no fragment files, so the run it
# triggers exits without a PR. If another merge lands while an assembly PR is still open, the next
# run re-assembles from the newer main and force-pushes `docs-assembly` — the open PR simply updates to
# the superset. Serialized by the concurrency group.
name: assemble-docs

on:
  push:
    branches: [main]

concurrency:
  group: assemble-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  assemble:
    # The 1-vCPU runner, at a third of the 2-core rate: the assemblers are dependency-free node scripts
    # over a few hundred markdown files, the formatter is seconds, and nothing here is parallel. This
    # runs TWICE per merge — once on the merge itself and once more when its own assembly PR lands (that
    # second run finds nothing and exits before installing anything) — so its cost is paid on every
    # change that reaches `main`, which is why the toolchain install below waits until it is known to
    # be needed.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 clone: build-decisions.mjs orders pending fragments by
          # the commit that first added each file (`git log --diff-filter=A`), and a shallow clone yields
          # no such commit for any of them — every fragment ties, and ADR numbers get assigned
          # alphabetically by slug instead of chronologically, silently.
          fetch-depth: 0

      - name: Fold fragments into the rendered trackers
        # Before any install: the assemblers import nothing outside node's own modules, so they run on
        # the runner's node as checked out.
        run: |
          node tooling/doc-fragments/build-decisions.mjs
          node tooling/doc-fragments/build-changelog.mjs
          node tooling/doc-fragments/build-status.mjs
          # --ref=origin/main names the trunk explicitly. The register's history reconstruction walks
          # the trunk and nothing else, and it decides what the trunk is from the ref's NAME — so a
          # checkout that left HEAD detached would make this decline, and decline quietly. Naming the
          # remote-tracking ref removes the assumption; it points at this very push.
          node tooling/doc-fragments/build-register.mjs --ref=origin/main

      - name: Decide whether there is anything to deliver
        # The auto-merged assembly commit contains no fragment files, so the run it triggers assembles
        # nothing — and must not pay for a toolchain to find that out. Everything below is conditional
        # on this answer.
        id: assembled
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to assemble"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Toolchain is needed only to format the assembled output (below), so it is installed only once
      # there is output to format.
      - name: Toolchain and workspace
        if: steps.assembled.outputs.changed == 'true'
        uses: ./.github/actions/setup

      # The assemblers can produce output the formatter rejects — e.g. build-decisions rewrites
      # `ADR-<slug>` references to `ADR-NNNN`, which changes text width inside Markdown tables and breaks
      # their column alignment. Format the output here so the assembly commit is format-clean, the way
      # `pnpm gate` would require of any other change. Pristine `main` is format-clean, so this only
      # ever fixes freshly-rendered files.
      - name: Format the rendered output
        if: steps.assembled.outputs.changed == 'true'
        run: pnpm exec vp check --no-lint --fix

      - name: Deliver as an auto-merging pull request
        if: steps.assembled.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The slim runner image ships the GitHub CLI; fail here, by name, rather than three commands
          # later if an image revision ever drops it.
          command -v gh > /dev/null || { echo "gh is not on this runner image — the delivery below needs it" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B docs-assembly
          git add -A
          git commit -m "docs: assemble fragments into the rendered trackers"
          # --no-verify: the setup action's `pnpm install` postinstall arms the repo's pre-push hook
          # (core.hooksPath -> tooling/git-hooks), whose scoped quality gate cannot run in this
          # assembly context (no WASM artefacts, etc.). The output is a deterministic re-render of
          # fragments that were reviewed on their own pull requests, formatted above.
          git push --no-verify -f origin docs-assembly

          # Ensure exactly one open assembly PR. Creating it fails hard rather than masking a green run:
          # if this fails with "GitHub Actions is not permitted to create or approve pull requests",
          # enable Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create
          # and approve pull requests". A pre-existing open PR (a re-run over an updated branch) is fine.
          existing="$(gh pr list --head docs-assembly --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head docs-assembly \
              --title "docs: assemble fragments into the rendered trackers" \
              --body "Automated per-merge fragment assembly (see docs/maintenance/README.md). Deterministic transform of already-reviewed fragments; auto-merges."
          else
            echo "assembly PR #$existing already open; branch force-updated to the current assembly"
          fi

          # Enable auto-merge (needs Settings > General > "Allow auto-merge"). It merges once the
          # `gate` check below reports green and the ruleset's other conditions hold; it fails hard so
          # breakage is visible.
          gh pr merge docs-assembly --auto --rebase --delete-branch

          # Produce the `gate` check on the branch head (see the header for why it is not automatic).
          gh workflow run ci.yml --ref docs-assembly
