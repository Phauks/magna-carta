# Seed, on every push to `main`, the caches a pull request can restore.
#
# A pull request run restores Actions caches saved on its own branch or on `main`, and from nowhere
# else. So a cache that only pull requests ever save is a cache every NEW branch starts without — and
# with the gate's push-to-main tier suspended (TEMPORARY CI AUSTERITY 2026-08-05) nothing saved the
# WASM artefacts on `main` for a month: every branch's first gate run paid the ~7-minute cold Docker
# build on a 2-core runner, on the critical path of every consumer job behind it. This workflow is the
# cheapest thing that closes that: restore-or-build the artefacts under the gate's own key, which is
# checkout plus a restore on a hit and the full build only when a crate genuinely changed.
#
# Deliberately NOT the gate's push-to-main tier. That tier re-verifies the merged tree (type-check,
# scoped lint, contracts) at roughly ten runner-minutes a merge; this is one. The TypeScript
# incremental state is deliberately not seeded either: a warm `tsc -b` saves a pull request about as
# much as seeding it would cost each merge, so there is nothing to gain.
#
# The cache key below and the one in gate.yml's `build-wasm` job must stay byte-identical — a seed
# under a different key warms nothing. `pnpm run lint:cache-keys` (tooling/lint-cache-keys) holds
# them together and fails the gate when they drift.
name: seed-caches

on:
  push:
    branches: [main]
  # The manual handle: the first seed, or after an eviction (Actions evicts an entry unused for seven
  # days; a pull request's restore counts as use, so a repository with any traffic never evicts it).
  workflow_dispatch:

# Never cancel a seed in progress. A merge to `main` is followed within minutes by the docs-assembly
# auto-merge, and cancelling the first run's seven-minute build for the second — which then restores
# nothing and starts the same build over — is how the cache stayed cold for two pushes running. Let
# the build finish and save; the queued run then restores in seconds.
concurrency:
  group: seed-caches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wasm:
    # ubuntu-latest, not ubuntu-slim: on a miss this shells out to `docker build`, and the 1-vCPU runner
    # is an unprivileged container with the Docker client but no daemon. On a hit it is a checkout and
    # a restore, well under a minute.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the built WASM packages
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            packages/pdf/src/pkg
            packages/decryption/src/pkg
            packages/email/src/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'crates/**/wasm.Dockerfile') }}

      - name: Set up toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Build the WASM artefacts (pinned Docker images)
        # The same build the gate's build-wasm job runs; actions/cache saves the result when the job ends.
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec vp run rust-wasm-build
