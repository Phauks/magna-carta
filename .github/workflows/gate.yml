# The authoritative whole-repo quality gate — runs on every pull request into `main` and every push to
# `main`, and is the check branch protection requires (require the aggregate `gate` job below, nothing
# else). Green `main` is what makes the deliberate `git push main:release` — the only deploy, via
# Cloudflare Workers Builds — always ship known-good code. The pre-push hook runs only a fast, diff-scoped
# subset for local feedback; this workflow is the exhaustive sweep.
#
# Shape: one fan-out DAG, not a serial monolith. A `changes` job path-filters the diff, a `wasm` job
# builds the Rust→WASM artefacts once (cached across runs, shared to consumers as an artefact), and the
# check dimensions — format, lint, type-check, rust, tests, governance, contracts, containers — run as
# independent jobs in parallel. Each heavy job is skipped when the diff can't affect it (a docs-only push
# runs only format + governance), so cost tracks what changed. The `gate` job aggregates them into the
# single required status. Rationale: docs/conventions/build-performance.md (fast CI is a foundation).
# Every job carries a timeout-minutes cap set comfortably above its honest wall-clock (cold caches
# included), so a genuine hang fails fast and visibly instead of burning a runner toward GitHub's 6-hour
# default; when a job's honest time grows, raise its cap rather than letting it flirt with the limit.
#
# TIERS. The same change is verified up to three times — on its pull request, on the push that merges it,
# and again by the scheduled sweep — and running an identical full battery each time buys nothing. So
# each trigger runs the pass that only IT can run:
#   • pull_request — the full battery, with the type-aware lint scoped to the changed packages and
#     their full transitive dependent closure MINUS the fan-out sinks (the packages whose type program
#     is effectively the whole repo, and which any foundational change would otherwise drag in). This
#     is the tier a human waits on, so it optimizes for latency.
#   • push to main — the merged tree gets the whole-repo type-check and the lint closure INCLUDING the
#     fan-out sinks (the two things the pull request deliberately did not do), and skips the test
#     battery the pull request already ran on the same content. Sound only with up-to-date-before-merge:
#     a branch that must be current with `main` to merge has already been tested against exactly this
#     tree, so re-running seven test runners re-proves a proof. What it does NOT cover is two branches
#     that merge in quick succession and interact semantically without touching the same files — which
#     is what the scheduled sweep below and the merge_group trigger are for.
#   • schedule — the full battery with an unscoped lint, from a cold start, every night. This is the
#     backstop for the interleaving window above, and it lands long before any deliberate
#     `git push main:release` turns `main` into a deploy.
#   • merge_group — the full battery. If a merge queue is ever enabled (a repository setting), the queue
#     builds the exact post-merge tree, which closes the interleaving window at its source rather than
#     catching it after the fact. Wired now so enabling the setting needs no workflow change.
#
# RUNNERS. Two sizes, chosen per job. `ubuntu-slim` is GitHub's 1-vCPU / 5 GB Linux runner and bills at
# $0.002 a minute against the 2-core `ubuntu-latest`'s $0.006 — a third of the rate for the same work —
# so every job whose honest wall-clock is a couple of minutes and whose work is not meaningfully
# parallel runs there. Three of its properties decide which jobs can, and all three are hard:
#   • a 15-minute job cap enforced by the platform, BELOW any timeout-minutes set here;
#   • 5 GB of memory, against 8 GB on ubuntu-latest;
#   • an unprivileged container carrying the Docker CLI but no daemon — Docker-in-Docker, service
#     containers and privileged kernel features are all unavailable.
# So the WASM build, the container gate, the type-aware lint, the type-check, the Miniflare worker
# shards, the Playwright story suite and the Rust gate stay on `ubuntu-latest`. Every job below records
# the measurement behind its own choice; re-measure and move a job back if its honest time grows toward
# the cap, the same way the timeout caps above are maintained.
#
# TEMPORARY CI AUSTERITY 2026-08-05 — revert when Actions minutes reset. Two of the three tiers above
# are suspended while the Actions budget is exhausted: the push-to-main run and the nightly schedule.
# What remains is the pull-request tier (the full battery at sink-deferred lint scope) and
# `workflow_dispatch` (both still run on every change and on the docs-assembly PR). While the
# post-merge tier is suspended the deferred sinks are covered by the window's merge bar instead — an
# agent's full local `pnpm check`, which lints the whole repository. The merge bar during the window and the
# revert checklist live in docs/conventions/build-performance.md. Every suspension in this file carries
# the marker above, so reverting is one grep.
name: gate

on:
  pull_request:
    branches: [main]
  # TEMPORARY CI AUSTERITY 2026-08-05 — revert when Actions minutes reset. The push-to-main tier is
  # suspended: it re-verifies a tree the pull request already proved, so it is the cheapest tier to give
  # up. Uncomment to restore.
  # push:
  #   branches: [main]
  # Full-battery proof of a queued merge's real post-merge tree. Inert until a merge queue is enabled
  # on the repository; harmless to carry until then.
  merge_group:
  # The nightly unscoped sweep. Its diff base resolves to nothing (there is no event base and HEAD is
  # already `main`), which the `changes` job's empty-diff branch turns into "run everything, lint ALL" —
  # exactly the cold, unscoped pass this tier is for.
  # TEMPORARY CI AUSTERITY 2026-08-05 — revert when Actions minutes reset. The nightly sweep is the
  # single most expensive recurring spend here (a cold whole-repo pass every night, whether or not
  # anything changed), so it is suspended first. Uncomment to restore.
  # schedule:
  #   - cron: "0 8 * * *"
  # The assemble-docs workflow dispatches the gate onto its `docs-assembly` branch: a PR created with
  # the workflow's own token fires no pull_request events, so the required `gate` status must be
  # produced explicitly for auto-merge to complete. Kept during the austerity window — it is what lets
  # the per-merge docs assembly land, and it is also the manual handle for running the sweep on demand.
  workflow_dispatch:

# One in-flight run per ref PER TRIGGER; a newer push cancels the older run. The event name is part of
# the group so the nightly sweep and a push to `main` — which share a ref — cannot cancel each other and
# leave a spurious red `cancelled` status on a commit.
concurrency:
  group: gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path-filter the diff so downstream jobs run only when they can be affected. Hand-rolled `git diff`
  # (no third-party action) against the PR base or the push's previous tip.
  changes:
    # 8 s measured: a `git diff` plus a dependency-free node classifier, no install and no build. The
    # slim runner's preinstalled git and node are the whole toolchain this needs.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
      containers: ${{ steps.filter.outputs.containers }}
      lint_scope: ${{ steps.filter.outputs.lint_scope }}
      # The test battery's tier switch and the test-worker shard split — see the emitting step.
      test_battery: ${{ steps.filter.outputs.test_battery }}
      worker_shards: ${{ steps.filter.outputs.worker_shards }}
      worker_shard_list: ${{ steps.filter.outputs.worker_shard_list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          # A push to `main` is the one trigger that re-verifies a tree a pull request already proved.
          # `github.ref` is checked as well as the event so a push to any other branch (there are none
          # today, but the trigger list can grow) still gets the full battery.
          IS_PUSH_TO_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            # No usable event base (workflow_dispatch, or a push whose `before` is unreachable): diff
            # against the merge-base with origin/main — sound for a branch of any commit count, where
            # HEAD~1 would under-classify a multi-commit branch and wrongly skip the heavy jobs.
            base="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "diff base: $base"
          echo "changed files:"; echo "$files"
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "filter: $1=$2"; }
          # The test battery is skipped only on a push to `main`, where the pull request that produced
          # the tree already ran it (see the tier note at the top of this file). Every other trigger —
          # including the nightly sweep and a merge-queue build — runs it.
          if [ "$IS_PUSH_TO_MAIN" = "true" ]; then
            emit test_battery false
          else
            emit test_battery true
          fi
          if [ -z "$files" ]; then
            # An empty diff means base resolution found nothing to compare (e.g. the nightly schedule,
            # or a dispatch on main itself). Fail safe: run everything rather than skip anything, at the
            # widest lint scope and the widest shard split.
            emit code true; emit rust true; emit containers true; emit lint_scope ALL
            emit worker_shards 4; emit worker_shard_list '[1,2,3,4]'
            exit 0
          fi
          # Documentation and the rendered trackers cannot affect any build or test output, so they are
          # excluded before classification: a docs-only push runs only format + governance (which cover
          # markdown and the fragment model between them), and a README edit inside crates/ or
          # containers/ no longer triggers that area's heavy job. The fragment directories and their
          # rendered outputs belong here for the same reason and for one more: the per-merge assembly
          # commit that folds changelog.d/status.d into CHANGELOG.md, STATUS.md and STATUS.json moves no
          # build input, yet STATUS.json is not markdown, so a markdown-only exclusion booted the entire
          # code battery on every single merge. Nothing in the repo reads any of these at build or test
          # time — they are formatter-ignored generated text — so excluding them is a classification
          # fix, not a narrowing of coverage.
          non_code='\.md$|^STATUS\.json$|^(docs|changelog\.d|status\.d|roadmap\.d)/'
          # …with one exception put straight back: a file with a source extension is a real input
          # wherever it lives, so a script landing under one of those trees is still a code change (and
          # affected-lint would independently force a whole-repo lint for it).
          source_extension='\.(ts|tsx|mts|cts|js|mjs|cjs|svelte|rs)$'
          code_files="$(printf '%s\n' "$files" | grep -vE "$non_code" || true)"
          source_under_docs="$(printf '%s\n' "$files" | grep -E "$non_code" | grep -E "$source_extension" || true)"
          if [ -n "$source_under_docs" ]; then
            echo "source file under a documentation path — kept in scope:"; echo "$source_under_docs"
            code_files="$(printf '%s\n%s\n' "$code_files" "$source_under_docs" | grep -v '^$' || true)"
          fi
          if [ -n "$code_files" ]; then emit code true; else emit code false; fi
          # crates/ holds every manifest, source file, and wasm.Dockerfile the rust job covers (the
          # container Cargo workspaces are the containers job's concern); a toolchain bump re-verifies
          # the crates workspace too.
          if echo "$code_files" | grep -qE '^crates/|^rust-toolchain\.toml$'; then emit rust true; else emit rust false; fi
          if echo "$code_files" | grep -qE '^containers/'; then emit containers true; else emit containers false; fi
          # The minimal package set the type-aware lint must cover (ALL | NONE | space-separated dirs) —
          # pure node, no deps, runs on the runner's system node. See tooling/affected-lint. A classifier
          # crash fails this job: its contract has no empty value, and downstream must never guess.
          #
          # SCOPE. Every trigger walks the FULL transitive dependent closure; the pull-request tier
          # additionally defers the fan-out sinks — packages whose type program is so large that linting
          # them is effectively a whole-repo lint — when they are in scope only as a dependent. A sink
          # the pull request itself changed is still linted, so an author's own code is never deferred.
          # This replaces the earlier one-hop cap on the pull-request tier: hop distance turned out to
          # be a poor proxy for cost, because the one expensive package sits one hop from nearly every
          # change (it depends directly on 39 of 61 workspace packages), so capping depth saved almost
          # nothing while narrowing coverage everywhere it was cheap. Deferring by measured weight is
          # a MOVE, not a hole — the unscoped pass below runs before the change can ship, and
          # tooling/affected-lint/scope-fitness.mjs asserts the two tiers' union covers the whole closure.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "affected-lint: full dependent closure, fan-out sinks deferred to the post-merge pass"
            scope="$(node tooling/affected-lint/index.mjs --base "$base" --max-hops all --defer-fanout-sinks)" || {
              echo "affected-lint: classifier failed — no sound lint scope" >&2
              exit 1
            }
          else
            echo "affected-lint: full dependent closure, nothing deferred"
            scope="$(node tooling/affected-lint/index.mjs --base "$base" --max-hops all)" || {
              echo "affected-lint: classifier failed — no sound lint scope" >&2
              exit 1
            }
          fi
          emit lint_scope "$scope"

          # test-worker's shard count. Sharding changes only how the SAME set of test files is divided
          # across runners — `--shard=i/N` partitions the whole suite for any N — so this is a pure
          # cost dial with no coverage consequence. It matters because each shard pays a fixed ~3 min of
          # checkout, install and artefact download before it runs a test: on a small change, four
          # shards bill four times that overhead to split a few minutes of work. Two shards keep the
          # parallelism that matters and halve the overhead. "Small" is mechanical: a modest file count
          # AND a lint scope that is neither whole-repo nor a broad dependent fan-out — the same signal
          # affected-lint already computes for whether a foundational package moved.
          #
          # Measured from the UNDEFERRED closure, not from the lint scope emitted above. Deferring a
          # fan-out sink narrows what gets linted; it says nothing about how broad the change is, and
          # reading the narrowed width here would call a foundational change "small" and quietly halve
          # the test parallelism. The classifier is pure node over the package manifests, so asking it
          # twice costs milliseconds and keeps the two signals honest about different things.
          breadth="$(node tooling/affected-lint/index.mjs --base "$base" --max-hops all)" || {
            echo "affected-lint: classifier failed — no sound change-breadth signal" >&2
            exit 1
          }
          file_count="$(printf '%s\n' "$code_files" | grep -c . || true)"
          scope_width="$(printf '%s\n' "$breadth" | wc -w | tr -d ' ')"
          echo "changed code files: $file_count; undeferred closure width: $scope_width"
          if [ "$breadth" != "ALL" ] && [ "$file_count" -le 20 ] && [ "$scope_width" -le 6 ]; then
            emit worker_shards 2; emit worker_shard_list '[1,2]'
          else
            emit worker_shards 4; emit worker_shard_list '[1,2,3,4]'
          fi

  # Build the Rust→WASM artefacts once. Cache them across runs keyed on the Rust sources, so a push that
  # touches no crate restores in seconds instead of paying the ~7-minute cold Docker build; share them to
  # the consumer jobs (lint/type-check/tests/contracts) as an artefact so each doesn't rebuild.
  # The key covers the Rust inputs only — the build command itself (the rust-wasm-build task in
  # vite.config.ts) is not keyed, a deliberate trade so config-only edits don't cold-build; if you change
  # that task in a way that alters its output, also touch a keyed input so the cache busts.
  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Stays on the 2-core runner even though a cache hit is 14 s: on a MISS this shells out to
    # `docker build`, and the 1-vCPU runner is an unprivileged container with the Docker client but no
    # daemon. The cold build is ~7 min besides, which is most of that runner's 15-minute ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the built WASM packages
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            packages/pdf/src/pkg
            packages/decryption/src/pkg
            packages/email/src/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'crates/**/wasm.Dockerfile') }}

      - name: Set up toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Build the WASM artefacts (pinned Docker images)
        # rust-wasm-build-dev refuses under CI on purpose; the canonical build is the Docker one and the
        # runner has Docker. Builds pdf-core, decryption-core, and email-core into packages/*/src/pkg.
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec vp run rust-wasm-build

      - name: Bundle the WASM packages for the consumer jobs
        run: tar -czf wasm-pkg.tgz packages/pdf/src/pkg packages/decryption/src/pkg packages/email/src/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm-pkg.tgz
          retention-days: 1

  # Formatting covers markdown too, so it runs on every change (including docs-only) and needs no WASM.
  format:
    # 76 s measured, and the formatter is the only part that uses more than one core: pinned to a
    # single core the whole pass took 62 s against 34 s on four, so the slim runner costs under half a
    # minute and saves two thirds of the job's rate. Far from its 15-minute ceiling either way.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Format check (fmt only)
        run: pnpm exec vp check --no-lint

  # The type-aware lint pass (oxlint + tsgolint). It is the tall pole (whole-program, single-threaded, no
  # incremental cache upstream), so it runs as its own job in parallel with the others rather than ahead
  # of them. Type-aware ⇒ needs the WASM packages to resolve @magna-carta/{pdf,decryption,email} types.
  lint:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    # Disqualified from the 1-vCPU runner twice over: 26 min measured on a broad pull request before the
    # fan-out sink was deferred, against its 15-minute cap, and the GOMEMLIMIT below is 10 GiB against
    # its 5 GB of memory. The post-merge pass, which still lints the sink, is the binding case.
    runs-on: ubuntu-latest
    # tsgolint building the app worker's whole-program type graph is the tall pole. The whole-repo pass
    # measured ~45 min on a 4-core/16 GB box (1851 files) — it was ~24 min when this cap was first set,
    # and it grew with the package count, so the cap has to lead that growth rather than track it. Cap
    # well above the honest time so a genuine tsgolint deadlock or runaway fails fast and visibly instead
    # of burning the runner to GitHub's 6-hour default; re-measure and raise this when the repo grows.
    # Only the merge and scheduled tiers pay the whole-repo pass — a pull request lints the affected
    # packages with the fan-out sinks deferred, which is seconds to minutes and nowhere near this cap.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Lint (type-aware, affected packages only)
        # The `changes` job computed the affected set — the changed packages plus their full transitive
        # dependent closure (a type-aware finding in an unchanged file can flip when a dependency
        # changes), or ALL when a global input moved. Scoping the paths scopes tsgolint's cost; the
        # whole repo is the ~45-min tall pole, one package is seconds. A pull request additionally
        # defers the fan-out sinks — the packages whose type program is effectively the whole repo —
        # when they are in scope only as dependents; every other trigger lints them, so the full
        # closure is always proved before a change can ship. Only lint is scoped — type-check, tests
        # and contracts still run whole-repo. Mechanism + soundness: tooling/affected-lint,
        # tooling/affected-lint/scope-fitness.mjs, docs/conventions/build-performance.md.
        env:
          SCOPE: ${{ needs.changes.outputs.lint_scope }}
          # tsgolint is a Go program: on the whole-repo pass its live type graph is only a few GB, but the
          # Go runtime lets the heap balloon to ~2x the live set before collecting, and that transient
          # overshoot crosses the 16 GB runner ceiling and OOM-aborts (SIGABRT) at whatever diagnostic it
          # is formatting when memory runs out — a moving crash point, not a lint error. A soft heap limit
          # forces the collector to run before the overshoot instead of after, keeping peak RSS under the
          # runner. Sized well above the observed ~6 GB live set (no GC thrash) and well under 16 GB
          # (headroom for the node/oxc driver + OS). Raise it if the honest live graph grows.
          GOMEMLIMIT: 10GiB
        run: |
          # vp's stdout must be a FILE here, not the runner's pipe. Node flips a pipe stdout to
          # non-blocking, and Vite+'s native lint printer panics on the resulting EAGAIN ("failed
          # printing to stdout: Resource temporarily unavailable") when a large warning flood outruns
          # the log reader — a whole-repo run with the advisory warn catalogs dies with SIGABRT after
          # ~25 minutes, timing-dependent. A regular file cannot return EAGAIN, so the redirect makes
          # the run deterministic; the output is replayed into the log afterward either way.
          run_lint() {
            local out="$RUNNER_TEMP/lint-output.txt" code=0
            pnpm exec vp check --no-fmt "$@" > "$out" 2>&1 || code=$?
            cat "$out"
            return "$code"
          }
          if [ "$SCOPE" = "ALL" ]; then
            # TEMPORARY CI AUSTERITY 2026-08-05 — revert when Actions minutes reset. The whole-repo
            # tier is the single most expensive thing this workflow runs (~45 min of runner time on
            # one job), so it is suspended outright while the Actions budget is exhausted; restore by
            # deleting this branch's echo and un-commenting `run_lint` below. ONLY this tier is
            # suspended — a scope of specific package directories (what a pull request computes, the
            # changed packages plus one hop) still lints exactly as before, so every change is still
            # type-aware linted over the packages it can affect. What is given up is the fallback that
            # a global input (the lint ruleset, the lockfile, the shared compiler options) or a
            # lintable file outside every package triggers. The merge bar covering that gap, and the
            # checklist for restoring it, are in docs/conventions/build-performance.md.
            echo "affected-lint: whole-repo lint SUSPENDED (temporary CI austerity) — not linting"
            # run_lint
          elif [ "$SCOPE" = "NONE" ]; then
            echo "affected-lint: no lintable package affected — nothing to lint"
          elif [ -z "$SCOPE" ]; then
            # The classifier's contract is ALL | NONE | dirs; empty means the changes job handed over
            # something unexpected. Fail rather than guess a scope.
            echo "affected-lint: empty scope — refusing to guess" >&2
            exit 1
          else
            echo "affected-lint: linting affected packages — $SCOPE"
            # Intentional word-splitting: each dir is a separate path argument to vp check.
            run_lint $SCOPE
          fi

  # The authoritative type-check: tsc -b across the project-reference graph, the tsconfig-refs guard, the
  # api-client type-check, and svelte-check for the SPA and the design system. Each surface is its own
  # named step so a red run says WHICH one failed without reading logs. Lint is deliberately not here:
  # the type-aware lint is the separate `lint` job above, so the tall pole never serializes behind these.
  typecheck:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    # Stays: 126 s measured is the WARM number the incremental cache below buys. A cold whole-program
    # `tsc -b` plus two svelte-check passes is a multi-gigabyte, several-minute job that uses every
    # core it is given — the wrong shape for 1 vCPU / 5 GB under a 15-minute cap.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz

      - name: Restore the TypeScript incremental state
        # `tsc -b` is incremental by design — every project is composite and writes a .tsbuildinfo
        # recording each input's content hash — but CI threw that state away after every run, so the
        # authoritative type-check paid a cold whole-program build every time. Persisting the .tsbuild
        # directories lets it re-check only the projects whose inputs actually moved, which is the
        # remaining affected-graph work docs/conventions/build-performance.md calls out.
        #
        # Keyed on the commit, restoring the newest entry the branch can see: an incremental cache wants
        # the CLOSEST previous state, not an exact match, and correctness does not depend on getting it.
        # tsc compares the recorded content hashes against the files on disk, so a stale or partial
        # restore costs re-checking, never a wrong answer — the failure mode of a bad guess here is a
        # slow build, not a missed type error.
        uses: actions/cache@v6
        with:
          path: |
            apps/*/.tsbuild
            packages/*/.tsbuild
            plugins/*/.tsbuild
          key: tsbuild-${{ runner.os }}-node22-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-node22-

      - name: Type-check the project-reference graph (tsc -b)
        run: pnpm exec vp run typecheck
      - name: Guard the tsconfig project references
        run: node tooling/tsconfig-refs/index.mjs --check
      - name: Type-check the generated api-client
        run: pnpm --filter @magna-carta/api-client run typecheck
      - name: svelte-check — web app
        run: pnpm --filter @magna-carta/web check
      - name: svelte-check — design system
        run: pnpm --filter @magna-carta/design-system check

  # The Rust workspace gate (cargo fmt --check + clippy -D warnings + tests). Runs on the host toolchain
  # with a cached cargo/target — independent of the Docker WASM build — and only when a crate changed.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Stays: cargo scales with cores, and a cold clippy build of the crates workspace runs well past
    # the 1-vCPU runner's 15-minute cap.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Rust gate (fmt + clippy + test)
        run: pnpm exec vp run rust-check

  # The Vitest suites, split along their NATURAL project boundaries rather than one blind shard over
  # everything. The suite has three substrates with very different per-file cost and setup: plain node
  # units (milliseconds), the Miniflare worker pool (a Workers runtime per file), and the design-system
  # Storybook stories (Chromium via Playwright). Splitting by substrate lets each scale independently and,
  # crucially, keeps the Playwright install in the ONE job that needs a browser instead of on every shard.
  #
  # Completeness is by construction — the three jobs partition every REGISTERED test file exactly once:
  #   • test-stories runs the `storybook` project (the only browser suite);
  #   • test-worker runs the files under apps/worker + apps/status-worker (the only Miniflare suites);
  #   • test-node runs everything else — packages, apps/web, the standalone sibling workers
  #     (default-pool unit tests with faked bindings), and tooling — with the `storybook` project
  #     excluded, so no browser boots here.
  # storybook is the only project that spans a path root (it lives under packages/design-system), so it
  # is the only one that must be included-by-name in one job and excluded-by-name from another; every
  # other file belongs to exactly one path root. Adding a new test area is TWO registrations: its vitest
  # config into the root vite.config.ts `test.projects` list (a closed list — an unregistered project's
  # tests run nowhere, and nothing can fail on their absence), and its path into test-node (or a new
  # job). The `test-collection` job below proves both registrations landed.
  # The heavy substrates (node, worker) shard within their job; bump the SHARD_TOTAL + matrix pair to
  # change a count. fail-fast off so one shard's failure still lets its siblings report.
  #
  # PASS THE PATHS ABSOLUTE — "$PWD/packages", never "packages". The runner matches a positional path
  # filter PER PROJECT, against the candidate file's path relative to THAT PROJECT'S OWN root, not
  # against the repository-relative path. A relative filter naming a directory that is an ANCESTOR of a
  # project root reduces to `..` under that project and matches none of its files, so the job runs
  # nothing and exits 0 — a mis-scoped path does NOT fail loud, it reports a fast green. An absolute
  # filter takes the runner's other branch, a prefix test against the file's absolute path, and narrows
  # the way a reader expects. Mechanism: docs/conventions/build-performance.md.

  # Plain node/unit suites — packages + the web app's node tests + the standalone sibling workers +
  # tooling. No Miniflare, no browser; the storybook project is excluded so no Chromium is needed here.
  # The bulk of the tests, cheapest per file.
  test-node:
    needs: [changes, wasm]
    # `test_battery` is false only on a push to `main`, where the pull request that produced this exact
    # tree already ran these suites — see the tier note at the top of this file.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.test_battery == 'true'
    # 52 s and 47 s measured per shard. These are plain node units — milliseconds per file, no runtime
    # to boot — so the shard split is what buys the parallelism, not the core count: shard 1 of 2 ran
    # in 19 s pinned to a single core. Two shards at a third of the rate cost less than one at full.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD_TOTAL: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Tests — node (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        # Absolute paths, for the reason in the block comment above this job. Kept byte-identical to the
        # copy in tooling/lint-test-collection.mjs, which fails if the two drift.
        run: >-
          pnpm exec vp test run --project='!storybook' --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          "$PWD/packages" "$PWD/tooling" "$PWD/apps/web" "$PWD/apps/bundle-worker"
          "$PWD/apps/convert-worker" "$PWD/apps/discovery-worker" "$PWD/apps/email-worker"
          "$PWD/apps/file-repair-worker" "$PWD/apps/magna-carta-edit" "$PWD/apps/ocr-worker"
          "$PWD/apps/recovery-worker" "$PWD/apps/scan-worker" "$PWD/apps/sign-worker"

  # The Miniflare worker suites (@cloudflare/vitest-pool-workers) — the heaviest substrate, since each file
  # stands up its own Workers runtime with the wrangler bindings. Its own sharded job; no browser.
  test-worker:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.test_battery == 'true'
    # Stays: 246-267 s per shard measured, and every file stands up its own Workers runtime, so the
    # cost scales with cores rather than with the shard split. On 1 vCPU that lands close enough to the
    # 15-minute cap to make a slow run a failure instead of a slow run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Shard count comes from the `changes` job: 2 on a small diff, 4 otherwise. `--shard=i/N`
        # partitions the whole suite for either N, so this trades wall-clock for the fixed per-shard
        # setup cost and never changes which files run.
        shard: ${{ fromJSON(needs.changes.outputs.worker_shard_list) }}
    env:
      SHARD_TOTAL: ${{ needs.changes.outputs.worker_shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Tests — worker (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        # --project='!storybook' is belt-and-suspenders: the paths already exclude the browser project,
        # this guarantees it can never lazily boot in a job that installs no browser. Absolute paths for
        # the reason in the block comment above test-node — these two happen to resolve to project roots
        # exactly, which is the one relative spelling that does collect, but the gate does not rely on
        # that coincidence. Kept byte-identical to tooling/lint-test-collection.mjs.
        run: >-
          pnpm exec vp test run --project='!storybook' --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          "$PWD/apps/worker" "$PWD/apps/status-worker"

  # The design-system Storybook story tests — the ONLY browser-mode suite (Chromium via Playwright), so
  # this is the ONLY job that installs the browser. One runner: bounded by story count + a single browser
  # boot, so it shards poorly and needs none.
  test-stories:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.test_battery == 'true'
    # Stays: 136 s measured, and it boots Chromium with `--with-deps` — a browser plus its system
    # libraries is the wrong load for 5 GB in an unprivileged container.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz

      - name: Point Playwright's browser cache outside the checkout
        # $RUNNER_TEMP is a sibling of the workspace so a whole-repo pass never walks the browser's own
        # bundled files. `runner` context is step-scoped, hence GITHUB_ENV.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"

      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browser the test runner needs
        # The vitest browser provider resolves playwright-core 1.60 (headless-shell build 1223); install
        # through that CLI so an older top-level `playwright` doesn't resolve a different build.
        run: |
          cli="$(find node_modules/.pnpm -maxdepth 4 -path '*playwright@1.60*/node_modules/playwright/cli.js' | head -1)"
          if [ -z "$cli" ]; then echo "could not locate the playwright 1.60 CLI"; exit 1; fi
          node "$cli" install --with-deps chromium chromium-headless-shell

      - name: Tests — stories (Storybook browser)
        run: pnpm exec vp test run --project=storybook

  # Prove the three test jobs above actually cover the suite. Nothing in the runner does: a filter that
  # matches no file exits 0 having run nothing, so an under-scoped test job reports a FAST GREEN rather
  # than a failure — which is precisely how a relative `packages` filter silently dropped every package's
  # tests out of test-node while the gate stayed green. This job re-runs each job's own invocation in
  # list-only mode (no test executes) and asserts three things: the unfiltered whole-suite collection
  # meets a committed floor, the union of the three jobs equals it, and they do not overlap. It reads the
  # invocations out of this file, so a filter edited here without the same edit in the lint fails loudly.
  test-collection:
    needs: [changes, wasm]
    # Deliberately NOT gated on test_battery: this verifies the SHAPE of the split, not the tests, and
    # the tier that skips the battery is exactly the tier that would otherwise never notice a bad split.
    if: needs.changes.outputs.code == 'true'
    # 66 s measured on a 4-core dev box: four list-only collections, run serially. The work is Vite
    # config resolution and file globbing over ~70 projects — single-threaded and I/O-shaped, not
    # CPU-bound — so the slim runner suits it even allowing for several times that wall-clock. Re-measure
    # and move it to ubuntu-latest if its honest time creeps toward that runner's 15-minute platform cap.
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Test-collection floor and shard-union coverage
        run: pnpm run lint:test-collection

  # Cheap whole-repo guards with no WASM dependency — run on every change so a governance regression can't
  # slip through a docs-only push.
  governance:
    # 40 s measured, and none of it is CPU-bound: the five node lints plus the migration-integrity test
    # ran in 10 s pinned to a single core, and the osv-scanner pass is a download and a network scan.
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Dependency audit (high+)
        # osv-scanner audits BOTH supply chains — the npm lockfile and every Rust Cargo.lock — against the
        # OSV database (GHSA for npm, RUSTSEC for crates), replacing npm-only `pnpm audit` (which also
        # relied on npm's browning-out legacy audit endpoint). Scope is the eight first-party lockfiles via
        # explicit `-L` flags — never `-r .`, which would pull in spikes/. Accepted advisories live in the
        # repo-root osv-scanner.toml, passed explicitly with --config (auto-discovery does not reach child
        # directories in a monorepo). Severity classification prefers each finding group's max_severity (a
        # CVSS base score), falling back to the advisory's severity text when a group has no CVSS score;
        # the gate fails ONLY on a remaining HIGH or CRITICAL (CVSS >= 7.0), matching the prior
        # --audit-level high strictness — moderate/low and the accepted advisories pass. A scan or config
        # error (osv exit >= 127, e.g. 128 = no packages found) fails the gate: a broken scan never
        # silently passes.
        env:
          OSV_SCANNER_VERSION: "2.4.0"
          # SHA256 of osv-scanner_linux_amd64, taken from the release's osv-scanner_SHA256SUMS. Pinned so a
          # swapped or compromised release asset fails the gate instead of running. Update this in lockstep
          # with OSV_SCANNER_VERSION (the hash for the new version is in that version's osv-scanner_SHA256SUMS).
          OSV_SCANNER_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
        run: |
          # GitHub's default bash shell runs with -e (errexit); osv-scanner exits 1 on the normal
          # "advisories present" case, which would abort the step before the severity classifier runs.
          # Disable errexit — every meaningful exit code (osv's, jq's) is checked explicitly below.
          set +e -uo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          # Verify the download against the pinned hash before making it executable — fail closed on any
          # mismatch so a tampered binary never runs.
          if ! echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -; then
            echo "osv-scanner binary failed SHA256 verification (expected ${OSV_SCANNER_SHA256}) — refusing to run" >&2
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          osv-scanner --version

          # Write the JSON report to a file (never capture stdout — the report is large and a stray
          # non-JSON line on stdout would corrupt the capture and break the classifier). osv-scanner's
          # exit code still signals findings: 0 = none, 1 = advisories present, >=127 = scan/config error.
          osv_json="$RUNNER_TEMP/osv-report.json"
          osv-scanner scan source \
            --config osv-scanner.toml \
            --format json \
            --output-file "$osv_json" \
            -L pnpm-lock.yaml \
            -L crates/Cargo.lock \
            -L containers/bundle/Cargo.lock \
            -L containers/file-repair/Cargo.lock \
            -L containers/libreoffice/Cargo.lock \
            -L containers/ocr/Cargo.lock \
            -L containers/raster/Cargo.lock \
            -L containers/recovery/Cargo.lock \
            -L containers/scan/Cargo.lock
          code=$?
          echo "osv-scanner exit code: $code"

          case "$code" in
            0) echo "osv-scanner: no advisories in any audited lockfile — pass."; exit 0 ;;
            1) : ;;  # advisories present after ignores — classify by severity below
            *)
              echo "osv-scanner: exit $code (scan/config error, e.g. 128 = no packages found) — failing the gate; a broken scan never passes." >&2
              exit 1
              ;;
          esac

          # osv-scanner groups findings per package. Prefer the group's max_severity (max CVSS base score
          # across the group); when it is empty (advisory carries no CVSS vector) fall back to the member
          # advisories' database_specific.severity text. HIGH is CVSS >= 7.0 / a HIGH|CRITICAL text label.
          # A jq failure is treated as a hard error (fail closed), never as "no offenders".
          if ! offenders="$(jq -c '
            [ .results[].packages[]
              | . as $p
              | $p.groups[]
              | . as $g
              | ($g.ids) as $ids
              | [ $p.vulnerabilities[] | select(.id as $v | $ids | index($v)) ] as $members
              | (($g.max_severity // "") | (try tonumber catch null)) as $ms
              | ($ms != null and $ms >= 7.0) as $by_score
              | ([ $members[] | (.database_specific.severity // "" | ascii_upcase)
                   | select(. == "HIGH" or . == "CRITICAL") ] | length > 0) as $by_text
              | select($by_score or ($ms == null and $by_text))
              | { package: $p.package.name, ecosystem: $p.package.ecosystem, ids: $ids,
                  max_severity: ($g.max_severity // ""),
                  classified_by: (if $by_score then "cvss>=7.0" else "severity-text" end) }
            ] | unique' "$osv_json")"; then
            echo "osv-scanner: failed to classify the JSON report — failing the gate." >&2
            exit 1
          fi

          count="$(printf '%s' "$offenders" | jq 'length')"
          echo "osv-scanner: HIGH/CRITICAL offenders after ignores: $count"
          if [ "$count" -eq 0 ]; then
            echo "osv-scanner: advisories present but none HIGH or CRITICAL after ignores — pass."
            exit 0
          fi

          echo "osv-scanner: HIGH/CRITICAL advisories remain after ignores — failing the gate:" >&2
          printf '%s' "$offenders" | jq -r '.[] | "  [\(.ecosystem)] \(.package): \(.ids | join(", ")) (max_severity=\(.max_severity), \(.classified_by))"' >&2
          exit 1
      - name: Governance (process-refs + custodian vocabulary + licenses + status fragments + decision files + test registration + lint scope)
        run: |
          pnpm run lint:process-refs
          pnpm run lint:custodian-vocabulary
          pnpm run lint:licenses
          pnpm run lint:status
          pnpm run lint:decisions
          pnpm run lint:test-registration
          pnpm run lint:affected-scope
      - name: Migration integrity (journal/chain/rebuild guards)
        run: pnpm --filter @magna-carta/database exec vp test run test/migration-integrity.test.ts

  # The API contract is code-as-contract: the committed OpenAPI snapshot, the generated client, the
  # Spectral hygiene lint, and the generated design tokens must all match what the source produces.
  contracts:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    # 54 s measured. It CONSUMES the WASM artefact the wasm job built — downloads and untars it — and
    # never builds one, so it needs no Docker daemon. All four checks ran in 21 s pinned to a single
    # core, each peaking around 200 MB of resident memory against the slim runner's 5 GB.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz

      - name: OpenAPI snapshot drift
        run: |
          pnpm --filter @magna-carta/worker run emit-openapi
          git diff --exit-code apps/worker/openapi/openapi.json

      - name: Generated client drift
        run: |
          pnpm run generate-client
          git diff --exit-code packages/api-client/src

      - name: Spectral hygiene lint
        run: pnpm --filter @magna-carta/worker exec spectral lint openapi/openapi.json --fail-severity warn

      - name: Design-token drift
        run: |
          pnpm --filter @magna-carta/design-tokens run build
          git diff --exit-code packages/design-tokens/generated

  # The container gate — two layers per CHANGED container: the workspace's own Rust gate (fmt --check
  # + clippy -D warnings + cargo test — each container is its own Cargo workspace, so the crates/-scoped
  # rust job never touches them), then the build-and-drive Docker acceptance suite where one exists
  # (Docker is on the runner here, unlike a local machine). A changed container that is neither mapped
  # to an acceptance suite nor explicitly listed as not-yet-covered FAILS the job — a new container must
  # opt in loudly, never silently join the untested set.
  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    # Stays, and could not move: multi-gigabyte `docker build`s need a daemon the 1-vCPU runner does
    # not have, and the 90-minute cap below is six times its ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free runner disk for the container builds
        # This job stacks per-workspace cargo target dirs, the cargo cache, and full Docker image
        # builds (the scan image compiles Rust and bakes a clamd DB in-image); the stock runner image
        # leaves too little headroom — a scan+ocr change died registering Docker layers with "no space
        # left on device". Drop the preinstalled bundles this repo never uses and prune Docker's
        # preloaded images (every image the acceptance suites need is pulled by their builds anyway).
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/powershell
          docker system prune -af --volumes > /dev/null 2>&1 || true
          echo "after:  $(df -h / | tail -1)"

      - name: Resolve the diff base
        # Same resolution as the `changes` job: the event's base, else the merge-base with origin/main.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"
          echo "diff base: $base"

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show && rustc --version

      - name: Cache the cargo registry and container targets
        # Replaces a hand-rolled actions/cache whose key was the container lockfiles alone. rust-cache
        # additionally keys on the exact rustc version — a toolchain bump must not silently reuse
        # artifacts built by the previous compiler, which the old key permitted — prunes the saved
        # target dirs down to dependency artifacts (the workspace's own crates recompile anyway, and
        # leaving them in is what made these entries enormous), and skips the save entirely when
        # nothing changed. Each container is its own Cargo workspace, so all seven are listed.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            containers/bundle
            containers/file-repair
            containers/libreoffice
            containers/ocr
            containers/raster
            containers/recovery
            containers/scan

      - name: Set up buildx for the image builds
        # The acceptance suites' images rebuild the same base layers and the same Rust dependency graph
        # every run, and a fresh runner starts with an empty layer store, so the local layer cache
        # `docker build` relies on is always cold here. buildx with an external cache backend is what
        # makes the layer cache outlive the runner.
        uses: docker/setup-buildx-action@v3

      - name: Expose the Actions cache credentials to the build scripts
        # buildx's `type=gha` backend talks to the Actions cache service, whose token the runner injects
        # into JavaScript action steps but strips from plain `run:` steps. The acceptance suites are
        # shell scripts that call buildx directly, so the token has to be published into the job
        # environment for them to reach it.
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Changed-container Rust gate (fmt + clippy + test per workspace)
        # Safe without a live stack: the daemon-dependent tests in these suites (e.g. the clamd INSTREAM
        # check, the live-DB differential gate) are #[ignore]d by their authors, so a plain `cargo test`
        # runs only the self-contained unit/integration tests; live wiring is the acceptance step's job.
        env:
          # Debuginfo dominates debug-build target size (the scan and ocr workspaces link ONNX Runtime
          # and gigabytes of it). CI never debugs these binaries interactively, and the disk saved is
          # what lets the Docker acceptance builds below fit on the same runner; the cache shrinks too.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          changed_files="$(git diff --name-only "$DIFF_BASE" HEAD)"
          for manifest in containers/*/Cargo.toml; do
            dir="$(dirname "$manifest")"
            if echo "$changed_files" | grep -q "^$dir/"; then
              echo "rust gate: $dir"
              cargo fmt --manifest-path "$manifest" --all --check
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
              cargo test --manifest-path "$manifest"
            fi
          done

      - name: Changed-container acceptance
        run: |
          changed_files="$(git diff --name-only "$DIFF_BASE" HEAD)"
          for dir in containers/*/; do
            name="$(basename "$dir")"
            echo "$changed_files" | grep -q "^containers/$name/" || continue
            # Layer cache for this container's image build, read and written through the Actions cache
            # service (containers/docker-build.sh turns this into the buildx invocation; unset locally
            # it stays a plain `docker build`). Scoped per container so one image's layers can never
            # evict or be confused with another's, and mode=max so the multi-stage builds' dependency
            # compile stages are cached too — those, not the thin runtime layer, are the slow part.
            export CONTAINER_BUILD_CACHE="--cache-from type=gha,scope=container-$name --cache-to type=gha,scope=container-$name,mode=max"
            case "$name" in
              # bash, never sh: the scripts use `set -o pipefail` and other bash-isms, and Ubuntu's sh
              # is dash — under sh they die on line 2 before testing anything.
              scan) bash containers/scan/tests/eicar_e2e.sh ;;
              recovery) bash containers/recovery/tests/recover_e2e.sh ;;
              bundle) bash containers/bundle/tests/acceptance.sh ;;
              # The heaviest gate in this job by a wide margin: the image is roughly a gigabyte
              # because it carries an office suite, so the layer cache above is what keeps it
              # tolerable, and the path filter is what keeps it off everyone else's builds.
              libreoffice) bash containers/libreoffice/tests/acceptance.sh ;;
              # Known not-yet-covered: unit-tested above where a Cargo workspace exists, but no
              # acceptance suite yet. Listed by name so the gap stays visible on every run that touches
              # them — and so anything NOT listed fails below instead of passing green untested.
              collabora | file-repair | ocr | raster)
                echo "::warning::containers/$name changed but has no acceptance suite yet"
                ;;
              *)
                echo "containers/$name changed but is neither mapped to an acceptance suite nor listed as not-yet-covered — add it to one of the two." >&2
                exit 1
                ;;
            esac
            # Drop buildx's LOCAL layer cache between containers. The image itself is already in the
            # docker store (--load) and the reusable layers have already been exported to the Actions
            # cache, so this costs nothing on the next run — but keeping it would stack a second full
            # copy of every layer alongside the docker store, on the one job that has already run this
            # runner out of disk once.
            docker buildx prune -af > /dev/null 2>&1 || true
          done

  # The single required status. It succeeds only if no required job failed or was cancelled; a job the
  # path-filter skipped counts as success. Require THIS in branch protection, not the individual jobs, so
  # the required set is stable as jobs are added or skipped.
  gate:
    needs:
      [
        changes,
        wasm,
        format,
        lint,
        typecheck,
        rust,
        test-node,
        test-worker,
        test-stories,
        test-collection,
        governance,
        contracts,
        containers,
      ]
    if: always()
    # 3 s measured: a case statement over the needs results, no checkout and no install. The required
    # status is the one job that must always report, and it is also the cheapest to run.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify every required check passed or was not needed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure* | *cancelled*)
              echo "gate: a required check failed"
              exit 1
              ;;
            *)
              echo "gate: all required checks passed or were skipped as not-needed"
              ;;
          esac
