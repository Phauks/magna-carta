# The authoritative whole-repo quality gate. It runs on every pull request into `main` and every
# push to `main`, and is the check branch protection should require — so `main` stays green and the
# deliberate `git push main:release` (the only deploy, via Cloudflare Workers Builds) always ships
# known-good code. The pre-push hook now runs only a fast, diff-scoped subset for local feedback;
# this workflow is where the full gate lives (it mirrors what the hook used to run end to end).
#
# NOTE (first-run shakeout): this reproduces a non-trivial environment and has not been executed on
# a runner yet. Watch the wasm build (pinned Docker images), the Playwright browser install, and the
# ort-sys ONNX download on the first run; expect a round or two of iteration.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # The vitest browser runner needs a specific Chromium build; keep browsers in one place.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the contract-drift and changed-container steps diff against a base commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        # rustup reads rust-toolchain.toml and installs the pinned toolchain + rustfmt/clippy + the
        # wasm32 target on first use.
        run: rustup show && rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm artefacts (pinned Docker images)
        # rust-wasm-build-dev refuses under CI on purpose; the canonical build is the Docker one, and
        # the runner has Docker. This produces the pkg/ dirs that tsc -b and the worker build import.
        run: pnpm exec vp run rust-wasm-build

      - name: Install the Playwright browser the test runner needs
        # The vitest browser provider resolves playwright-core 1.60.0 (headless-shell build 1223); the
        # top-level `playwright` CLI can resolve an older build, so install through the 1.60 CLI.
        run: |
          cli="$(find node_modules/.pnpm -maxdepth 4 -path '*playwright@1.60*/node_modules/playwright/cli.js' | head -1)"
          if [ -z "$cli" ]; then echo "could not locate the playwright 1.60 CLI"; exit 1; fi
          node "$cli" install --with-deps chromium chromium-headless-shell

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high

      - name: Quality gate (fmt + lint + type-check + svelte-check + rust)
        run: pnpm check

      - name: Governance (process-refs + licenses)
        run: |
          pnpm run lint:process-refs
          pnpm run lint:licenses

      - name: Migration integrity
        run: pnpm --filter @magna-carta/database exec vp test run test/migration-integrity.test.ts

      - name: Tests (Miniflare worker integration)
        run: pnpm exec vp test

      - name: Contract — OpenAPI snapshot drift
        run: |
          pnpm --filter @magna-carta/worker run emit-openapi
          git diff --exit-code apps/worker/openapi/openapi.json

      - name: Contract — generated client drift
        run: |
          pnpm run generate-client
          git diff --exit-code packages/api-client/src

      - name: Contract — Spectral hygiene lint
        run: pnpm --filter @magna-carta/worker exec spectral lint openapi/openapi.json --fail-severity warn

      - name: Contract — design-token drift
        run: |
          pnpm --filter @magna-carta/design-tokens run build
          git diff --exit-code packages/design-tokens/generated

      - name: Container acceptance (only for changed containers)
        # Docker is available on the runner, so these run here instead of being skipped as they are on
        # a local machine without Docker. Diff against the PR base, or the previous tip on a push.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="HEAD~1"; fi
          changed() { git diff --name-only "$base"...HEAD | grep -q "^$1"; }
          if changed containers/scan/; then sh containers/scan/tests/eicar_e2e.sh; fi
          if changed containers/recovery/; then sh containers/recovery/tests/recover_e2e.sh; fi
          if changed containers/bundle/; then bash containers/bundle/tests/acceptance.sh; fi
