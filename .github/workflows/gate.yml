# The authoritative whole-repo quality gate — runs on every pull request into `main` and every push to
# `main`, and is the check branch protection requires (require the aggregate `gate` job below, nothing
# else). Green `main` is what makes the deliberate `git push main:release` — the only deploy, via
# Cloudflare Workers Builds — always ship known-good code. The pre-push hook runs only a fast, diff-scoped
# subset for local feedback; this workflow is the exhaustive sweep.
#
# Shape: one fan-out DAG, not a serial monolith. A `changes` job path-filters the diff, a `wasm` job
# builds the Rust→WASM artefacts once (cached across runs, shared to consumers as an artefact), and the
# check dimensions — format, lint, type-check, rust, tests, governance, contracts, containers — run as
# independent jobs in parallel. Each heavy job is skipped when the diff can't affect it (a docs-only push
# runs only format + governance), so cost tracks what changed. The `gate` job aggregates them into the
# single required status. Rationale: docs/conventions/build-performance.md (fast CI is a foundation).
# Every job carries a timeout-minutes cap set comfortably above its honest wall-clock (cold caches
# included), so a genuine hang fails fast and visibly instead of burning a runner toward GitHub's 6-hour
# default; when a job's honest time grows, raise its cap rather than letting it flirt with the limit.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The assemble-docs workflow dispatches the gate onto its `docs-assembly` branch: a PR created with
  # the workflow's own token fires no pull_request events, so the required `gate` status must be
  # produced explicitly for auto-merge to complete.
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path-filter the diff so downstream jobs run only when they can be affected. Hand-rolled `git diff`
  # (no third-party action) against the PR base or the push's previous tip.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
      containers: ${{ steps.filter.outputs.containers }}
      lint_scope: ${{ steps.filter.outputs.lint_scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            # No usable event base (workflow_dispatch, or a push whose `before` is unreachable): diff
            # against the merge-base with origin/main — sound for a branch of any commit count, where
            # HEAD~1 would under-classify a multi-commit branch and wrongly skip the heavy jobs.
            base="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "diff base: $base"
          echo "changed files:"; echo "$files"
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "filter: $1=$2"; }
          if [ -z "$files" ]; then
            # An empty diff means base resolution found nothing to compare (e.g. a dispatch on main
            # itself). Fail safe: run everything rather than skip anything.
            emit code true; emit rust true; emit containers true; emit lint_scope ALL
            exit 0
          fi
          # Markdown can't affect any build or test output, so it is excluded before classification: a
          # docs-only push runs only format + governance, and a README edit inside crates/ or
          # containers/ no longer triggers that area's heavy job.
          code_files="$(echo "$files" | grep -vE '\.md$' || true)"
          if [ -n "$code_files" ]; then emit code true; else emit code false; fi
          # crates/ holds every manifest, source file, and wasm.Dockerfile the rust job covers (the
          # container Cargo workspaces are the containers job's concern); a toolchain bump re-verifies
          # the crates workspace too.
          if echo "$code_files" | grep -qE '^crates/|^rust-toolchain\.toml$'; then emit rust true; else emit rust false; fi
          if echo "$code_files" | grep -qE '^containers/'; then emit containers true; else emit containers false; fi
          # The minimal package set the type-aware lint must cover (ALL | NONE | space-separated dirs) —
          # pure node, no deps, runs on the runner's system node. See tooling/affected-lint. A classifier
          # crash fails this job: its contract has no empty value, and downstream must never guess.
          scope="$(node tooling/affected-lint/index.mjs --base "$base")" || {
            echo "affected-lint: classifier failed — no sound lint scope" >&2
            exit 1
          }
          emit lint_scope "$scope"

  # Build the Rust→WASM artefacts once. Cache them across runs keyed on the Rust sources, so a push that
  # touches no crate restores in seconds instead of paying the ~7-minute cold Docker build; share them to
  # the consumer jobs (lint/type-check/tests/contracts) as an artefact so each doesn't rebuild.
  # The key covers the Rust inputs only — the build command itself (the rust-wasm-build task in
  # vite.config.ts) is not keyed, a deliberate trade so config-only edits don't cold-build; if you change
  # that task in a way that alters its output, also touch a keyed input so the cache busts.
  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the built WASM packages
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            packages/pdf/src/pkg
            packages/decryption/src/pkg
            packages/email/src/pkg
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'crates/Cargo.lock', 'crates/**/wasm.Dockerfile') }}

      - name: Set up toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Build the WASM artefacts (pinned Docker images)
        # rust-wasm-build-dev refuses under CI on purpose; the canonical build is the Docker one and the
        # runner has Docker. Builds pdf-core, decryption-core, and email-core into packages/*/src/pkg.
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec vp run rust-wasm-build

      - name: Bundle the WASM packages for the consumer jobs
        run: tar -czf wasm-pkg.tgz packages/pdf/src/pkg packages/decryption/src/pkg packages/email/src/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm-pkg.tgz
          retention-days: 1

  # Formatting covers markdown too, so it runs on every change (including docs-only) and needs no WASM.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Format check (fmt only)
        run: pnpm exec vp check --no-lint

  # The type-aware lint pass (oxlint + tsgolint). It is the tall pole (whole-program, single-threaded, no
  # incremental cache upstream), so it runs as its own job in parallel with the others rather than ahead
  # of them. Type-aware ⇒ needs the WASM packages to resolve @magna-carta/{pdf,decryption,email} types.
  lint:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # tsgolint building the app worker's whole-program type graph is the tall pole (~24 min for the whole
    # repo). Cap well above that so a genuine tsgolint deadlock or runaway fails fast and visibly instead
    # of burning the runner to GitHub's 6-hour default; raise this if the honest whole-repo time grows.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Lint (type-aware, affected packages only)
        # The `changes` job computed the affected set — the changed packages plus their transitive
        # dependents (a type-aware finding in an unchanged file can flip when a dependency changes), or
        # ALL when a global input moved. Scoping the paths scopes tsgolint's cost; the whole repo is the
        # ~24-min tall pole, one package is seconds. Only lint is scoped — type-check/tests/contracts
        # still run whole-repo. Mechanism + soundness: tooling/affected-lint, docs build-performance.md.
        env:
          SCOPE: ${{ needs.changes.outputs.lint_scope }}
        run: |
          # vp's stdout must be a FILE here, not the runner's pipe. Node flips a pipe stdout to
          # non-blocking, and Vite+'s native lint printer panics on the resulting EAGAIN ("failed
          # printing to stdout: Resource temporarily unavailable") when a large warning flood outruns
          # the log reader — a whole-repo run with the advisory warn catalogs dies with SIGABRT after
          # ~25 minutes, timing-dependent. A regular file cannot return EAGAIN, so the redirect makes
          # the run deterministic; the output is replayed into the log afterward either way.
          run_lint() {
            local out="$RUNNER_TEMP/lint-output.txt" code=0
            pnpm exec vp check --no-fmt "$@" > "$out" 2>&1 || code=$?
            cat "$out"
            return "$code"
          }
          if [ "$SCOPE" = "ALL" ]; then
            echo "affected-lint: linting the whole repo"
            run_lint
          elif [ "$SCOPE" = "NONE" ]; then
            echo "affected-lint: no lintable package affected — nothing to lint"
          elif [ -z "$SCOPE" ]; then
            # The classifier's contract is ALL | NONE | dirs; empty means the changes job handed over
            # something unexpected. Fail rather than guess a scope.
            echo "affected-lint: empty scope — refusing to guess" >&2
            exit 1
          else
            echo "affected-lint: linting affected packages — $SCOPE"
            # Intentional word-splitting: each dir is a separate path argument to vp check.
            run_lint $SCOPE
          fi

  # The authoritative type-check: tsc -b across the project-reference graph, the tsconfig-refs guard, the
  # api-client type-check, and svelte-check for the SPA and the design system. Each surface is its own
  # named step so a red run says WHICH one failed without reading logs. Lint is deliberately not here:
  # the type-aware lint is the separate `lint` job above, so the tall pole never serializes behind these.
  typecheck:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Type-check the project-reference graph (tsc -b)
        run: pnpm exec vp run typecheck
      - name: Guard the tsconfig project references
        run: node tooling/tsconfig-refs/index.mjs --check
      - name: Type-check the generated api-client
        run: pnpm --filter @magna-carta/api-client run typecheck
      - name: svelte-check — web app
        run: pnpm --filter @magna-carta/web check
      - name: svelte-check — design system
        run: pnpm --filter @magna-carta/design-system check

  # The Rust workspace gate (cargo fmt --check + clippy -D warnings + tests). Runs on the host toolchain
  # with a cached cargo/target — independent of the Docker WASM build — and only when a crate changed.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Rust gate (fmt + clippy + test)
        run: pnpm exec vp run rust-check

  # The Vitest suites, split along their NATURAL project boundaries rather than one blind shard over
  # everything. The suite has three substrates with very different per-file cost and setup: plain node
  # units (milliseconds), the Miniflare worker pool (a Workers runtime per file), and the design-system
  # Storybook stories (Chromium via Playwright). Splitting by substrate lets each scale independently and,
  # crucially, keeps the Playwright install in the ONE job that needs a browser instead of on every shard.
  #
  # Completeness is by construction — the three jobs partition every REGISTERED test file exactly once:
  #   • test-stories runs the `storybook` project (the only browser suite);
  #   • test-worker runs the files under apps/worker + apps/status-worker (the only Miniflare suites);
  #   • test-node runs everything else — packages, apps/web, the standalone sibling workers
  #     (default-pool unit tests with faked bindings), and tooling — with the `storybook` project
  #     excluded, so no browser boots here.
  # storybook is the only project that spans a path root (it lives under packages/design-system), so it
  # is the only one that must be included-by-name in one job and excluded-by-name from another; every
  # other file belongs to exactly one path root. Adding a new test area is TWO registrations: its vitest
  # config into the root vite.config.ts `test.projects` list (a closed list — an unregistered project's
  # tests run nowhere, and nothing can fail on their absence), and its path into test-node (or a new
  # job), where a mis-scoped path fails loud via --passWithNoTests being off, not silently.
  # The heavy substrates (node, worker) shard within their job; bump the SHARD_TOTAL + matrix pair to
  # change a count. fail-fast off so one shard's failure still lets its siblings report.

  # Plain node/unit suites — packages + the web app's node tests + the standalone sibling workers +
  # tooling. No Miniflare, no browser; the storybook project is excluded so no Chromium is needed here.
  # The bulk of the tests, cheapest per file.
  test-node:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD_TOTAL: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Tests — node (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        run: >-
          pnpm exec vp test run --project='!storybook' --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          packages apps/web apps/bundle-worker apps/convert-worker apps/file-repair-worker
          apps/magna-carta-edit apps/ocr-worker apps/recovery-worker apps/scan-worker tooling

  # The Miniflare worker suites (@cloudflare/vitest-pool-workers) — the heaviest substrate, since each file
  # stands up its own Workers runtime with the wrangler bindings. Its own sharded job; no browser.
  test-worker:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz
      - name: Tests — worker (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        # --project='!storybook' is belt-and-suspenders: the paths already exclude the browser project,
        # this guarantees it can never lazily boot in a job that installs no browser.
        run: pnpm exec vp test run --project='!storybook' --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} apps/worker apps/status-worker

  # The design-system Storybook story tests — the ONLY browser-mode suite (Chromium via Playwright), so
  # this is the ONLY job that installs the browser. One runner: bounded by story count + a single browser
  # boot, so it shards poorly and needs none.
  test-stories:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz

      - name: Point Playwright's browser cache outside the checkout
        # $RUNNER_TEMP is a sibling of the workspace so a whole-repo pass never walks the browser's own
        # bundled files. `runner` context is step-scoped, hence GITHUB_ENV.
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"

      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browser the test runner needs
        # The vitest browser provider resolves playwright-core 1.60 (headless-shell build 1223); install
        # through that CLI so an older top-level `playwright` doesn't resolve a different build.
        run: |
          cli="$(find node_modules/.pnpm -maxdepth 4 -path '*playwright@1.60*/node_modules/playwright/cli.js' | head -1)"
          if [ -z "$cli" ]; then echo "could not locate the playwright 1.60 CLI"; exit 1; fi
          node "$cli" install --with-deps chromium chromium-headless-shell

      - name: Tests — stories (Storybook browser)
        run: pnpm exec vp test run --project=storybook

  # Cheap whole-repo guards with no WASM dependency — run on every change so a governance regression can't
  # slip through a docs-only push.
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Dependency audit (high+)
        # osv-scanner audits BOTH supply chains — the npm lockfile and every Rust Cargo.lock — against the
        # OSV database (GHSA for npm, RUSTSEC for crates), replacing npm-only `pnpm audit` (which also
        # relied on npm's browning-out legacy audit endpoint). Scope is the eight first-party lockfiles via
        # explicit `-L` flags — never `-r .`, which would pull in spikes/. Accepted advisories live in the
        # repo-root osv-scanner.toml, passed explicitly with --config (auto-discovery does not reach child
        # directories in a monorepo). Severity classification prefers each finding group's max_severity (a
        # CVSS base score), falling back to the advisory's severity text when a group has no CVSS score;
        # the gate fails ONLY on a remaining HIGH or CRITICAL (CVSS >= 7.0), matching the prior
        # --audit-level high strictness — moderate/low and the accepted advisories pass. A scan or config
        # error (osv exit >= 127, e.g. 128 = no packages found) fails the gate: a broken scan never
        # silently passes.
        env:
          OSV_SCANNER_VERSION: "2.4.0"
        run: |
          # GitHub's default bash shell runs with -e (errexit); osv-scanner exits 1 on the normal
          # "advisories present" case, which would abort the step before the severity classifier runs.
          # Disable errexit — every meaningful exit code (osv's, jq's) is checked explicitly below.
          set +e -uo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          osv-scanner --version

          # Write the JSON report to a file (never capture stdout — the report is large and a stray
          # non-JSON line on stdout would corrupt the capture and break the classifier). osv-scanner's
          # exit code still signals findings: 0 = none, 1 = advisories present, >=127 = scan/config error.
          osv_json="$RUNNER_TEMP/osv-report.json"
          osv-scanner scan source \
            --config osv-scanner.toml \
            --format json \
            --output-file "$osv_json" \
            -L pnpm-lock.yaml \
            -L crates/Cargo.lock \
            -L containers/bundle/Cargo.lock \
            -L containers/file-repair/Cargo.lock \
            -L containers/ocr/Cargo.lock \
            -L containers/raster/Cargo.lock \
            -L containers/recovery/Cargo.lock \
            -L containers/scan/Cargo.lock
          code=$?
          echo "osv-scanner exit code: $code"

          case "$code" in
            0) echo "osv-scanner: no advisories in any audited lockfile — pass."; exit 0 ;;
            1) : ;;  # advisories present after ignores — classify by severity below
            *)
              echo "osv-scanner: exit $code (scan/config error, e.g. 128 = no packages found) — failing the gate; a broken scan never passes." >&2
              exit 1
              ;;
          esac

          # osv-scanner groups findings per package. Prefer the group's max_severity (max CVSS base score
          # across the group); when it is empty (advisory carries no CVSS vector) fall back to the member
          # advisories' database_specific.severity text. HIGH is CVSS >= 7.0 / a HIGH|CRITICAL text label.
          # A jq failure is treated as a hard error (fail closed), never as "no offenders".
          if ! offenders="$(jq -c '
            [ .results[].packages[]
              | . as $p
              | $p.groups[]
              | . as $g
              | ($g.ids) as $ids
              | [ $p.vulnerabilities[] | select(.id as $v | $ids | index($v)) ] as $members
              | (($g.max_severity // "") | (try tonumber catch null)) as $ms
              | ($ms != null and $ms >= 7.0) as $by_score
              | ([ $members[] | (.database_specific.severity // "" | ascii_upcase)
                   | select(. == "HIGH" or . == "CRITICAL") ] | length > 0) as $by_text
              | select($by_score or ($ms == null and $by_text))
              | { package: $p.package.name, ecosystem: $p.package.ecosystem, ids: $ids,
                  max_severity: ($g.max_severity // ""),
                  classified_by: (if $by_score then "cvss>=7.0" else "severity-text" end) }
            ] | unique' "$osv_json")"; then
            echo "osv-scanner: failed to classify the JSON report — failing the gate." >&2
            exit 1
          fi

          count="$(printf '%s' "$offenders" | jq 'length')"
          echo "osv-scanner: HIGH/CRITICAL offenders after ignores: $count"
          if [ "$count" -eq 0 ]; then
            echo "osv-scanner: advisories present but none HIGH or CRITICAL after ignores — pass."
            exit 0
          fi

          echo "osv-scanner: HIGH/CRITICAL advisories remain after ignores — failing the gate:" >&2
          printf '%s' "$offenders" | jq -r '.[] | "  [\(.ecosystem)] \(.package): \(.ids | join(", ")) (max_severity=\(.max_severity), \(.classified_by))"' >&2
          exit 1
      - name: Governance (process-refs + licenses + status fragments + test registration)
        run: |
          pnpm run lint:process-refs
          pnpm run lint:licenses
          pnpm run lint:status
          pnpm run lint:test-registration
      - name: Migration integrity (journal/chain/rebuild guards)
        run: pnpm --filter @magna-carta/database exec vp test run test/migration-integrity.test.ts

  # The API contract is code-as-contract: the committed OpenAPI snapshot, the generated client, the
  # Spectral hygiene lint, and the generated design tokens must all match what the source produces.
  contracts:
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
      - run: tar -xzf wasm-pkg.tgz

      - name: OpenAPI snapshot drift
        run: |
          pnpm --filter @magna-carta/worker run emit-openapi
          git diff --exit-code apps/worker/openapi/openapi.json

      - name: Generated client drift
        run: |
          pnpm run generate-client
          git diff --exit-code packages/api-client/src

      - name: Spectral hygiene lint
        run: pnpm --filter @magna-carta/worker exec spectral lint openapi/openapi.json --fail-severity warn

      - name: Design-token drift
        run: |
          pnpm --filter @magna-carta/design-tokens run build
          git diff --exit-code packages/design-tokens/generated

  # The container gate — two layers per CHANGED container: the workspace's own Rust gate (fmt --check
  # + clippy -D warnings + cargo test — each container is its own Cargo workspace, so the crates/-scoped
  # rust job never touches them), then the build-and-drive Docker acceptance suite where one exists
  # (Docker is on the runner here, unlike a local machine). A changed container that is neither mapped
  # to an acceptance suite nor explicitly listed as not-yet-covered FAILS the job — a new container must
  # opt in loudly, never silently join the untested set.
  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free runner disk for the container builds
        # This job stacks per-workspace cargo target dirs, the cargo cache, and full Docker image
        # builds (the scan image compiles Rust and bakes a clamd DB in-image); the stock runner image
        # leaves too little headroom — a scan+ocr change died registering Docker layers with "no space
        # left on device". Drop the preinstalled bundles this repo never uses and prune Docker's
        # preloaded images (every image the acceptance suites need is pulled by their builds anyway).
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/powershell
          docker system prune -af --volumes > /dev/null 2>&1 || true
          echo "after:  $(df -h / | tail -1)"

      - name: Resolve the diff base
        # Same resolution as the `changes` job: the event's base, else the merge-base with origin/main.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"
          echo "diff base: $base"

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show && rustc --version

      - name: Cache the cargo registry and container targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            containers/*/target
          key: cargo-containers-v2-${{ runner.os }}-${{ hashFiles('containers/*/Cargo.lock') }}
          restore-keys: |
            cargo-containers-v2-${{ runner.os }}-

      - name: Changed-container Rust gate (fmt + clippy + test per workspace)
        # Safe without a live stack: the daemon-dependent tests in these suites (e.g. the clamd INSTREAM
        # check, the live-DB differential gate) are #[ignore]d by their authors, so a plain `cargo test`
        # runs only the self-contained unit/integration tests; live wiring is the acceptance step's job.
        env:
          # Debuginfo dominates debug-build target size (the scan and ocr workspaces link ONNX Runtime
          # and gigabytes of it). CI never debugs these binaries interactively, and the disk saved is
          # what lets the Docker acceptance builds below fit on the same runner; the cache shrinks too.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          changed_files="$(git diff --name-only "$DIFF_BASE" HEAD)"
          for manifest in containers/*/Cargo.toml; do
            dir="$(dirname "$manifest")"
            if echo "$changed_files" | grep -q "^$dir/"; then
              echo "rust gate: $dir"
              cargo fmt --manifest-path "$manifest" --all --check
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
              cargo test --manifest-path "$manifest"
            fi
          done

      - name: Changed-container acceptance
        run: |
          changed_files="$(git diff --name-only "$DIFF_BASE" HEAD)"
          for dir in containers/*/; do
            name="$(basename "$dir")"
            echo "$changed_files" | grep -q "^containers/$name/" || continue
            case "$name" in
              # bash, never sh: the scripts use `set -o pipefail` and other bash-isms, and Ubuntu's sh
              # is dash — under sh they die on line 2 before testing anything.
              scan) bash containers/scan/tests/eicar_e2e.sh ;;
              recovery) bash containers/recovery/tests/recover_e2e.sh ;;
              bundle) bash containers/bundle/tests/acceptance.sh ;;
              # Known not-yet-covered: unit-tested above where a Cargo workspace exists, but no
              # acceptance suite yet. Listed by name so the gap stays visible on every run that touches
              # them — and so anything NOT listed fails below instead of passing green untested.
              collabora | file-repair | ocr | raster)
                echo "::warning::containers/$name changed but has no acceptance suite yet"
                ;;
              *)
                echo "containers/$name changed but is neither mapped to an acceptance suite nor listed as not-yet-covered — add it to one of the two." >&2
                exit 1
                ;;
            esac
          done

  # The single required status. It succeeds only if no required job failed or was cancelled; a job the
  # path-filter skipped counts as success. Require THIS in branch protection, not the individual jobs, so
  # the required set is stable as jobs are added or skipped.
  gate:
    needs:
      [
        changes,
        wasm,
        format,
        lint,
        typecheck,
        rust,
        test-node,
        test-worker,
        test-stories,
        governance,
        contracts,
        containers,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required check passed or was not needed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure* | *cancelled*)
              echo "gate: a required check failed"
              exit 1
              ;;
            *)
              echo "gate: all required checks passed or were skipped as not-needed"
              ;;
          esac
