<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Government Records Coverage — Magna Carta</title>
    <style>
      :root {
        --ink: #16181d; --muted: #6b7280; --line: #e5e7eb; --bg: #f6f6f3; --card: #fff;
        --uncovered: #e7e7e2;
        --property: #1f6f57; --property-soft: #a9d3c5;
        --business: #1f4f6b; --business-soft: #a9c1d0;
        --licensing: #6b3f86; --licensing-soft: #cbb9d9;
        --ok: #1d7a4d; --ok-soft: #e6f4ec; --bad: #b4471f; --bad-soft: #f8ece5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink);
        font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 70px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 25px; margin: 0 0 3px; }
      .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
      .toggle { display: inline-flex; background: #ecece7; border-radius: 10px; padding: 4px; gap: 2px; }
      .toggle button { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px;
        cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
      .toggle button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .toggle button .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px;
        margin-right: 6px; vertical-align: middle; }
      #subToggle[hidden] { display: none; }
      select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px;
        font-weight: 600; background: #fff; color: var(--ink); }
      .spacer { flex: 1; }
      .btn { padding: 8px 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
        font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
      .btn:hover { border-color: #c4d0d7; }
      .btn:disabled { opacity: .6; cursor: default; }
      .rebuild-msg { font-size: 12.5px; color: var(--muted); }

      .layout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
      .mapcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
        box-shadow: 0 1px 3px rgba(0,0,0,.04); }
      svg { width: 100%; height: auto; display: block; }
      .county { stroke: #fff; stroke-width: .2px; }
      .state-fill { stroke: #fff; stroke-width: .5px; }
      .state-border { fill: none; stroke: #fff; stroke-width: .7px; pointer-events: none; }
      .nation { fill: none; stroke: #cfcfc7; stroke-width: .8px; pointer-events: none; }
      .hoverable { cursor: pointer; }
      .hoverable:hover { stroke: var(--ink); stroke-width: 1px; }
      .sel-outline { fill: none; stroke: var(--ink); stroke-width: 1.4px; pointer-events: none; }

      aside { position: sticky; top: 18px; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
      .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
        margin: 0 0 4px; }
      .panel .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .panel .det { font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
      .legend { font-size: 12.5px; color: var(--muted); }
      .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin: 0 5px 0 12px;
        vertical-align: middle; }
      .hint { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

      /* state-detail list */
      .sd-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
      .sd-title { font-family: Georgia, serif; font-size: 19px; font-weight: 600; }
      .sd-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
      .sd-close { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px; }
      .rows { max-height: 460px; overflow: auto; border-top: 1px solid var(--line); }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
        padding: 9px 2px; border-bottom: 1px solid var(--line); }
      .row.sel { background: #f3f7f9; }
      .row .name { font-weight: 600; font-size: 14px; }
      .row .url { grid-column: 1 / -1; font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px; color: var(--muted); word-break: break-all; }
      .row .acts { display: flex; gap: 5px; }
      .ico { border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer;
        font-size: 12px; font-weight: 700; padding: 4px 8px; color: var(--ink); white-space: nowrap; }
      .ico:hover { border-color: #c4d0d7; }
      .ico.good.on { background: var(--ok-soft); color: var(--ok); border-color: #c7e6d4; }
      .ico.bad.on { background: var(--bad-soft); color: var(--bad); border-color: #eccdbf; }
      .ico.open { color: var(--business); }
      .sd-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
      .sd-foot .prog { font-size: 12.5px; color: var(--muted); }

      /* preview */
      .preview { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        overflow: hidden; }
      .preview[hidden] { display: none; }
      .pv-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
      .pv-bar .pv-url { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pv-frame { width: 100%; height: 560px; border: 0; background: #fafafa; }
      .pv-note { font-size: 12px; color: var(--bad); padding: 0 12px 8px; }

      .tip { position: fixed; pointer-events: none; background: #16181d; color: #fff; font-size: 12.5px;
        padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 9; white-space: nowrap; }
      code { background: #ecece7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } aside { position: static; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Government Records Coverage</h1>
      <p class="sub">
        Toggle the layer (and property system). <b>Click a state</b> to list and verify its links;
        open or preview each, mark it, and export. (<code>@magna-carta/government-links</code>)
      </p>

      <div class="controls">
        <div class="toggle" id="toggle">
          <button data-layer="property" class="on"><span class="dot" style="background:var(--property)"></span>Property</button>
          <button data-layer="business"><span class="dot" style="background:var(--business)"></span>Business</button>
          <button data-layer="licensing"><span class="dot" style="background:var(--licensing)"></span>Licensing</button>
        </div>
        <div class="toggle" id="subToggle">
          <button data-sys="assessor" class="on">Assessor</button>
          <button data-sys="recorder">Recorder</button>
          <button data-sys="gis">GIS</button>
        </div>
        <select id="stateSel"><option value="">Jump to state…</option></select>
        <span class="spacer"></span>
        <button id="export" class="btn">Export verifications</button>
        <button id="rebuild" class="btn" hidden title="Regenerate map data from the live registry">&#8635; Rebuild</button>
        <span id="rebuildMsg" class="rebuild-msg"></span>
      </div>

      <div class="layout">
        <div class="mapcard">
          <svg id="map" viewBox="0 0 975 610" aria-label="US coverage map"></svg>
        </div>
        <aside>
          <div class="panel" id="panel"></div>
        </aside>
      </div>

      <div class="preview" id="preview" hidden>
        <div class="pv-bar">
          <span class="pv-url" id="pvUrl"></span>
          <a class="btn" id="pvOpen" target="_blank" rel="noopener noreferrer">Open &#8599;</a>
          <button class="btn" id="pvClose">Close</button>
        </div>
        <div class="pv-note" id="pvNote">If this stays blank, the site blocks embedding — use Open.</div>
        <iframe class="pv-frame" id="pvFrame" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
    <div class="tip" id="tip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="coverage-data.js"></script>
    <script>
      const COV = window.COVERAGE || { property: [], business: [], licensing: [] };
      const COLORS = { property: "#1f6f57", business: "#1f4f6b", licensing: "#6b3f86" };
      const SOFT = { property: "#a9d3c5", business: "#a9c1d0", licensing: "#cbb9d9" };
      const UNCOVERED = "#e7e7e2";
      const SYS_LABEL = {
        assessor: "Assessor", recorder: "Recorder", gis: "GIS",
        businessEntity: "Business entity", ucc: "UCC", attorneyLicense: "Attorney",
      };

      // fips(2) -> state code, from any layer's data.
      const fipsToCode = new Map();
      for (const layerSites of Object.values(COV))
        for (const s of layerSites) fipsToCode.set(s.id.slice(0, 2), s.state);

      let layer = "property";
      let propSys = "assessor";
      let selected = null; // 2-digit state FIPS
      const activeSystem = () =>
        layer === "property" ? propSys : layer === "business" ? "businessEntity" : "attorneyLicense";
      const currentSites = () => COV[layer].filter((s) => s.system === activeSystem());

      // verification store
      const KEY = "mc-coverage-verify-v1";
      let reviews = {};
      try { reviews = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { reviews = {}; }
      const vkey = (s) => s.system + ":" + s.id;
      const saveReviews = () => localStorage.setItem(KEY, JSON.stringify(reviews));

      const svg = d3.select("#map");
      const tip = d3.select("#tip");
      const $ = (id) => document.getElementById(id);

      let gCounty, gState, selLayer, urlMap = new Map(), deepSet = new Set(), stateNames = new Map();

      d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json").then((us) => {
        const counties = topojson.feature(us, us.objects.counties).features;
        const states = topojson.feature(us, us.objects.states).features;
        const nation = topojson.feature(us, us.objects.nation);
        const projection = d3.geoAlbersUsa().fitSize([975, 610], nation);
        const path = d3.geoPath(projection);
        const stateName = new Map(states.map((s) => [s.id, s.properties.name]));
        stateNames = stateName;
        const stateFeature = new Map(states.map((s) => [s.id, s]));

        gCounty = svg.append("g");
        gState = svg.append("g");
        gCounty.selectAll("path").data(counties).join("path").attr("class", "county hoverable")
          .attr("d", path).on("mousemove", (e, d) => showTip(e, tipFor(d)))
          .on("mouseleave", hideTip).on("click", (e, d) => selectState(d.id.slice(0, 2)));
        gState.selectAll("path").data(states).join("path").attr("class", "state-fill hoverable")
          .attr("d", path).on("mousemove", (e, d) => showTip(e, tipFor(d)))
          .on("mouseleave", hideTip).on("click", (e, d) => selectState(d.id));
        svg.append("path").attr("class", "state-border")
          .attr("d", path(topojson.mesh(us, us.objects.states, (a, b) => a !== b)));
        svg.append("path").attr("class", "nation").attr("d", path(nation));
        selLayer = svg.append("path").attr("class", "sel-outline");

        function tipFor(d) {
          const has = urlMap.has(d.id);
          const nm = d.properties.name + (layer === "property" ? "" : "");
          return has ? "<b>" + nm + "</b> &middot; covered" : nm + " — not yet";
        }

        window.__selOutline = () => {
          if (selected && stateFeature.get(selected)) selLayer.attr("d", path(stateFeature.get(selected)));
          else selLayer.attr("d", null);
        };

        render();
      });

      function recompute() {
        const sites = currentSites();
        urlMap = new Map(sites.map((s) => [s.id, s.url]));
        deepSet = new Set(sites.filter((s) => s.deep).map((s) => s.id));
      }

      function render() {
        recompute();
        const c = COLORS[layer], soft = SOFT[layer], countyMode = layer === "property";
        if (gCounty) {
          gCounty.style("display", countyMode ? null : "none").selectAll("path")
            .attr("fill", (d) => (!urlMap.has(d.id) ? UNCOVERED : deepSet.has(d.id) ? c : soft));
          gState.style("display", countyMode ? "none" : null).selectAll("path")
            .attr("fill", (d) => (!urlMap.has(d.id) ? UNCOVERED : deepSet.has(d.id) ? c : soft));
        }
        if (window.__selOutline) window.__selOutline();
        $("subToggle").hidden = layer !== "property";
        document.querySelectorAll("#toggle button").forEach((b) => b.classList.toggle("on", b.dataset.layer === layer));
        document.querySelectorAll("#subToggle button").forEach((b) => b.classList.toggle("on", b.dataset.sys === propSys));
        renderPanel();
      }

      function statsPanel() {
        const sites = currentSites();
        const deep = sites.filter((s) => s.deep).length;
        const c = COLORS[layer];
        return (
          '<h2>' + cap(layer) + " &middot; " + SYS_LABEL[activeSystem()] + "</h2>" +
          '<div class="big">' + sites.length + "</div>" +
          '<div class="det">' + deep + " deep-link &middot; " + (sites.length - deep) + " search-only</div>" +
          '<div class="legend"><i style="background:' + c + '"></i>Deep-link<i style="background:' +
          SOFT[layer] + '"></i>Search only<i style="background:' + UNCOVERED + '"></i>Not yet</div>' +
          '<div class="hint">Click a state on the map (or use Jump to state) to list and verify its links.</div>'
        );
      }

      function statePanel() {
        const code = fipsToCode.get(selected) || selected;
        const sites = currentSites()
          .filter((s) => s.state === code)
          .sort((a, b) => a.name.localeCompare(b.name));
        let done = 0;
        const rows = sites.map((s) => {
            const st = reviews[vkey(s)];
            if (st) done++;
            return (
              '<div class="row" data-id="' + s.id + '">' +
              '<div class="name">' + s.name + "</div>" +
              '<div class="acts">' +
              '<a class="ico open" href="' + s.url + '" target="_blank" rel="noopener noreferrer">Open &#8599;</a>' +
              '<button class="ico pv" data-id="' + s.id + '">Preview</button>' +
              '<button class="ico good ' + (st === "good" ? "on" : "") + '" data-id="' + s.id + '" data-v="good">&#10003;</button>' +
              '<button class="ico bad ' + (st === "bad" ? "on" : "") + '" data-id="' + s.id + '" data-v="bad">&#10007;</button>' +
              "</div>" +
              '<div class="url">' + s.url + "</div>" +
              "</div>"
            );
          }).join("");
        return (
          '<div class="sd-head"><span class="sd-title">' + (stateNames.get(selected) || code) +
          ' <span style="color:var(--muted);font-weight:400;font-size:14px">' + code + "</span></span>" +
          '<button class="sd-close" id="sdClose" title="Back to overview">&times;</button></div>' +
          '<div class="sd-sub">' + cap(layer) + " &middot; " + SYS_LABEL[activeSystem()] + " &middot; " +
          sites.length + " " + (sites.length === 1 ? "portal" : "portals") + "</div>" +
          (sites.length ? '<div class="rows">' + rows + "</div>" : '<div class="hint">No ' +
            SYS_LABEL[activeSystem()].toLowerCase() + " portals wired for this state yet.</div>") +
          '<div class="sd-foot"><span class="prog">' + done + " / " + sites.length + " marked</span></div>"
        );
      }

      function renderPanel() {
        $("panel").innerHTML = selected ? statePanel() : statsPanel();
        if (!selected) return;
        $("sdClose").onclick = () => { selected = null; if (window.__selOutline) window.__selOutline(); renderPanel(); };
        $("panel").querySelectorAll(".ico.good, .ico.bad").forEach((b) =>
          (b.onclick = () => mark(b.dataset.id, b.dataset.v)));
        $("panel").querySelectorAll(".ico.pv").forEach((b) => (b.onclick = () => preview(b.dataset.id)));
      }

      function mark(id, v) {
        const s = currentSites().find((x) => x.id === id);
        if (!s) return;
        const k = vkey(s);
        reviews[k] = reviews[k] === v ? undefined : v;
        if (reviews[k] === undefined) delete reviews[k];
        saveReviews();
        renderPanel();
        const row = $("panel").querySelector('.row[data-id="' + id + '"]');
        if (row) row.classList.add("sel");
      }

      function preview(id) {
        const s = currentSites().find((x) => x.id === id);
        if (!s) return;
        $("preview").hidden = false;
        $("pvUrl").textContent = s.url;
        $("pvOpen").href = s.url;
        $("pvFrame").src = s.url;
        $("preview").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function selectState(fips) {
        selected = fips;
        if (window.__selOutline) window.__selOutline();
        $("stateSel").value = fips;
        renderPanel();
      }

      function showTip(e, html) {
        tip.html(html).style("opacity", 1).style("left", e.clientX + 14 + "px").style("top", e.clientY + 14 + "px");
      }
      function hideTip() { tip.style("opacity", 0); }
      const cap = (s) => s[0].toUpperCase() + s.slice(1);

      // state dropdown — every state that appears in any layer, alphabetical by code
      (function fillStates() {
        const seen = new Map();
        for (const [fips, code] of fipsToCode) seen.set(code, fips);
        const opts = [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0]));
        const sel = $("stateSel");
        for (const [code, fips] of opts) {
          const o = document.createElement("option");
          o.value = fips; o.textContent = code;
          sel.appendChild(o);
        }
        sel.onchange = () => { if (sel.value) selectState(sel.value); else { selected = null; if (window.__selOutline) window.__selOutline(); renderPanel(); } };
      })();

      $("toggle").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        layer = b.dataset.layer; render();
      });
      $("subToggle").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        propSys = b.dataset.sys; render();
      });
      $("pvClose").onclick = () => { $("preview").hidden = true; $("pvFrame").src = "about:blank"; };

      // export every marked verification across states/systems
      $("export").onclick = () => {
        const all = [...COV.property, ...COV.business, ...COV.licensing];
        const out = all
          .filter((s) => reviews[vkey(s)])
          .map((s) => ({ state: s.state, fips: s.id, system: s.system, name: s.name, status: reviews[vkey(s)], url: s.url }));
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "coverage-verifications.json";
        a.click();
      };

      // rebuild (served mode only)
      const rebuildBtn = $("rebuild"), rebuildMsg = $("rebuildMsg");
      if (location.protocol.startsWith("http")) {
        rebuildBtn.hidden = false;
        rebuildBtn.onclick = async () => {
          rebuildBtn.disabled = true; rebuildMsg.textContent = "Rebuilding…";
          try {
            const r = await fetch("/rebuild", { method: "POST" });
            if (!r.ok) throw new Error(await r.text());
            location.reload();
          } catch (e) { rebuildBtn.disabled = false; rebuildMsg.textContent = "Rebuild needs the server (tools/open-coverage-map.cmd)."; }
        };
      }
    </script>
  </body>
</html>
